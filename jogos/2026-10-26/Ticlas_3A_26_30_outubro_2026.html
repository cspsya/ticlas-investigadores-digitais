<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Missão das Sequências e do Som S — Investigadores Digitais</title><style>
:root{--ink:#233553;--blue:#5BA3D0;--orange:#E8834A;--cream:#FFF8F0;--green:#31835c;--red:#b93b47;--line:#d6e6ed}*{box-sizing:border-box}body{font-family:'Nunito','Segoe UI',Arial,sans-serif;color:var(--ink);margin:0;background:radial-gradient(circle at 12% 0%,#fce1c7,transparent 28%),linear-gradient(160deg,#fff8f0,#e7f5fc);min-height:100vh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #f5b841;outline-offset:3px}.wrap{max-width:1150px;margin:auto;padding:14px 18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.brand{font-weight:900;font-size:1.18rem}.brand small{display:block;color:#5b778b;font-size:.76rem}.pill{background:white;border:2px solid var(--line);border-radius:24px;padding:8px 13px;font-weight:850}.panel{background:#fff;border:2px solid #e5eff3;border-radius:26px;box-shadow:0 16px 40px #33577c1b;padding:clamp(18px,3vw,30px);min-height:500px}.hero{display:grid;grid-template-columns:170px 1fr;gap:25px;align-items:center}.hero img,.mascot{width:150px;max-width:100%;object-fit:contain;filter:drop-shadow(0 9px 8px #19334926)}h1{font-size:clamp(1.8rem,4vw,2.7rem);line-height:1.1;margin:7px 0 16px;color:#2a6687}h2{font-size:clamp(1.5rem,3vw,2rem);margin:6px 0;color:#2a6687}.sub{font-size:1.12rem;color:#526b82;font-weight:750}.btn{border:0;border-radius:16px;padding:14px 23px;background:var(--orange);color:#fff;font-weight:900;box-shadow:0 5px 0 #b95c2c}.btn.alt{background:var(--blue);box-shadow:0 5px 0 #347da6}.btn.mild{background:#edf6fb;color:#265c7c;box-shadow:0 4px 0 #c8dfeb}.btn:disabled{opacity:.45;cursor:not-allowed}.progress{height:12px;background:#e4f0f5;border-radius:10px;overflow:hidden;margin-bottom:16px}.progress>div{height:100%;background:linear-gradient(90deg,var(--blue),var(--orange));transition:width .3s}.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin:20px 0 4px}.nav .btn{font-size:.93rem;padding:10px 14px}.map{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:12px;margin-top:24px}.tile{min-height:142px;text-align:left;border:3px solid #dceaf2;border-radius:19px;background:#fff;padding:15px;box-shadow:0 5px 0 #dceaf2;font-weight:850;display:flex;flex-direction:column;gap:6px}.tile .num{color:#c76b34}.tile.done{border-color:#61ac80;background:#eaf8ee}.tile.now{border-color:var(--orange)}.question{border:2px dashed #cfe4f0;border-radius:18px;padding:17px;background:#f9fcfe;font-size:clamp(1.25rem,3vw,1.75rem);font-weight:850;text-align:center;white-space:pre-wrap;margin:17px auto}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.choice,.piece{min-height:68px;background:white;border:3px solid #d8e8ef;border-radius:17px;font-weight:900;font-size:1.26rem;padding:10px;box-shadow:0 4px 0 #d8e8ef}.choice.good,.piece.good{background:#e7f6ea;border-color:var(--green);box-shadow:0 4px 0 var(--green)}.choice.wrong,.piece.wrong{background:#ffe9eb;border-color:var(--red)}.feedback{min-height:40px;font-size:1.07rem;font-weight:850;text-align:center;margin-top:18px}.goodText{color:var(--green)}.badText{color:var(--red)}.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}.typing{width:min(100%,650px);margin:15px auto;display:block;border:3px solid #bfdce9;padding:14px 16px;font-size:1.28rem;font-weight:750;border-radius:14px}.sample{font-size:1.25rem;font-weight:800;max-width:800px;margin:auto}.assembly{min-height:74px;background:#fff9ef;border:3px dashed var(--orange);border-radius:18px;padding:12px;display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin:15px 0}.piece{min-height:56px;background:#fff;font-size:1rem;padding:10px 15px}.fraction{display:grid;grid-template-columns:repeat(var(--cols),1fr);width:min(240px,70vw);height:210px;margin:12px auto;border:4px solid #69452a;border-radius:15px;overflow:hidden;background:#fff}.fraction>i{background:#fff3d8;border:1px solid #97693e}.fraction>i.on{background:#e8834a}.fraction.pizza{border-radius:50%;transform:rotate(-15deg)}.hint{color:#5c758a;font-size:.97rem;text-align:center}.bottom{display:flex;flex-wrap:wrap;justify-content:center;gap:16px;font-size:.73rem;margin:22px 0;color:#5c7284}.bottom a{color:#376e8d}.teacher{border:2px solid #cfe2ed;background:#f8fcff;border-radius:15px;padding:18px;margin-top:20px}.teacher input{width:100%;max-width:280px;padding:10px;border:2px solid var(--line);border-radius:10px}.teacher table{width:100%;border-collapse:collapse}.teacher td,.teacher th{text-align:left;padding:8px;border-bottom:1px solid #dce5ec}@media(max-width:600px){.hero{grid-template-columns:1fr;text-align:center}.hero img{width:110px;margin:auto}.nav{justify-content:center}.panel{padding:15px}.tile{min-height:120px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}[hidden]{display:none!important}</style></head><body><div class="wrap"><header class="top"><div class="brand">Investigadores Digitais <small>com o Ticl@s · 3.º ano · 3.º A</small></div><span class="pill" id="counter">⭐ 0</span><button class="btn mild" id="prof" type="button">⚙ Professor</button></header><main class="panel" id="app" aria-live="polite"></main><nav class="nav"><button class="btn mild" id="home">🏠 Início</button><button class="btn mild" id="prev">⬅ Anterior</button><button class="btn alt" id="next">Próximo ➡</button></nav><footer class="bottom"><a href="https://sites.google.com/view/investigadores-a-descoberta/p%C3%A1gina-inicial" target="_blank" rel="noopener">Investigadores à Descoberta</a><a href="https://gavetadefichas.wordpress.com/" target="_blank" rel="noopener">Site Gaveta de Fichas</a><a href="https://gavetadefichas.blogspot.com/?m=1" target="_blank" rel="noopener">Blog Gaveta de Fichas</a><a href="https://www.facebook.com/100071380264004/?locale=pt_PT" target="_blank" rel="noopener">Facebook Gaveta de Fichas</a></footer></div><script>
'use strict';const CONFIG={"title": "Missão das Sequências e do Som S", "sub": "Padrões de repetição · S, SS, C, Ç e Z", "date": "30 de outubro de 2026", "turma": "3A", "parts": [["Descobre o padrão", "Escolhe a figura seguinte.", "pattern", [["🔵", "🟠"], ["🟩", "🟨", "🟨"], ["🔺", "⭐", "🔺", "🔵"], ["🟦", "🟦", "🔴"], ["🌙", "⭐", "☀️"], ["🔶", "🔷", "🔷", "🔷"]]], ["Continua a sequência", "Observa e continua as repetições.", "pattern", [["🔴", "🟢", "🟡"], ["⭐", "⭐", "🟦"], ["🔺", "🔺", "⚪", "⚪"], ["🍀", "🌼"], ["🟧", "🟦", "🟩", "🟦"]]], ["Qual é a regra?", "Identifica o grupo que se repete.", "choice", [["🔴 🔵 🔴 🔵 🔴 🔵", "🔴 🔵", ["🔴 🔵", "🔴 🔴", "🔵 🔵"]], ["⭐ ⭐ 🌙 ⭐ ⭐ 🌙", "⭐ ⭐ 🌙", ["⭐ ⭐ 🌙", "⭐ 🌙", "⭐ 🌙 🌙"]], ["🔺 🟦 🟩 🔺 🟦 🟩", "🔺 🟦 🟩", ["🔺 🟦 🟩", "🔺 🟦", "🟩 🟩 🟦"]]]], ["Som S — escolhe", "Completa as palavras com a escrita correta.", "choice", [["pa __ aro", "ss", ["ss", "s", "ç"]], ["ma __ a", "ss", ["ss", "ç", "z"]], ["ca __ a", "s", ["s", "ss", "ç"]], ["la __ o", "ç", ["ç", "ss", "z"]], ["a __ úcar", "ç", ["ç", "s", "ss"]], ["__ ereja", "c", ["c", "s", "ç"]], ["__ ebra", "z", ["z", "s", "c"]], ["__ inema", "c", ["c", "s", "ç"]], ["pi __ ina", "sc", ["sc", "ss", "ç"]]]], ["Palavras com S", "Escolhe a palavra corretamente escrita.", "choice", [["pássaro", "pássaro", ["pássaro", "pásaro", "páçaro"]], ["açúcar", "açúcar", ["açúcar", "assúcar", "asúcar"]], ["cereja", "cereja", ["cereja", "sereja", "çereja"]], ["zebra", "zebra", ["zebra", "sebra", "cebra"]], ["massa", "massa", ["massa", "maça", "masa"]], ["laço", "laço", ["laço", "lasso", "laso"]], ["cinema", "cinema", ["cinema", "sinema", "çinema"]], ["piscina", "piscina", ["piscina", "pissina", "piçina"]]]], ["Completa a palavra", "Escreve as letras que faltam.", "typing", [["pa__aro", "ss"], ["la_o", "ç"], ["a_úcar", "ç"], ["ma_a", "ss"], ["_ebra", "z"], ["_inema", "c"], ["_ereja", "c"]]], ["Ordena a frase", "Toca nas palavras pela ordem correta.", "order", ["O caracol passou pela casa.", "A menina viu uma zebra.", "O pássaro pousou na cerejeira.", "A rosa nasceu no jardim.", "O laço azul é bonito."]], ["Copia com atenção", "Copia as frases respeitando os sinais.", "copy", ["O caracol passou devagar pela relva.", "A menina encontrou uma rosa amarela.", "O pássaro voou sobre a casa.", "A zebra e o caracol apareceram na história."]]]};const parts=CONFIG.parts;const state={screen:'intro',mission:0,index:0,done:{},errors:{},stars:0,attempts:0,arr:[],answers:[],selected:[],locked:false,teacher:false};const app=document.getElementById('app'),byId=id=>document.getElementById(id);const len=i=>parts[i][3].length;const total=parts.reduce((n,p)=>n+p[3].length,0);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function completed(i){return (state.done[i]||[]).filter(Boolean).length}function completedTotal(){return parts.reduce((n,_,i)=>n+completed(i),0)}function progress(){return Math.round(completedTotal()/total*100)}function updateBar(){byId('counter').textContent='⭐ '+completedTotal()+' / '+total;byId('prev').disabled=state.screen==='intro'||(state.screen==='task'&&state.index===0&&state.mission===0);byId('next').hidden=state.screen!=='task';if(state.screen==='task')byId('next').disabled=!state.locked;}
function intro(){state.screen='intro';app.innerHTML=`<div class="hero"><img src="data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180"><circle cx="90" cy="90" r="78" fill="#dff2e8"/><text x="90" y="125" text-anchor="middle" font-size="100">🕵️</text></svg>')}" alt="Mascote dos investigadores"><div><span class="pill">3.º ano · ${esc(CONFIG.date)} · sem som</span><h1>${esc(CONFIG.title)}</h1><p class="sub">${esc(CONFIG.sub)}</p><p>8 missões para treinar, pensar, escrever e conquistar estrelas. Trabalha ao teu ritmo.</p><button class="btn" id="start">Começar missão ➡</button></div></div><div class="map">${parts.map((p,i)=>`<button class="tile ${completed(i)===len(i)?'done':''}" data-jump="${i}"><span class="num">MISSÃO ${i+1}</span><strong>${esc(p[0])}</strong><span>${completed(i)}/${len(i)} desafios ✓</span></button>`).join('')}</div>`;byId('start').onclick=()=>startMission(parts.findIndex((_,i)=>completed(i)<len(i))<0?0:parts.findIndex((_,i)=>completed(i)<len(i)));app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>startMission(+b.dataset.jump));updateBar()}
function startMission(i){state.screen='task';state.mission=i;state.index=0;showTask()}function questionData(){return parts[state.mission][3][state.index]}function rand(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function wordsFor(str){return str.split(' ')}function exercise(){const p=parts[state.mission],data=questionData(),type=p[2];state.locked=!!state.done[state.mission]?.[state.index];state.selected=[];let body='';if(type==='choice'){let [q,correct,opts]=data;body=`<div class="question">${esc(q)}</div><div class="choices">${rand([...new Set(opts)]).map(s=>`<button class="choice" data-answer="${esc(s)}">${esc(s)}</button>`).join('')}</div>`}else if(type==='typing'||type==='copy'){const q=type==='copy'?'Copia a frase exatamente como está.':data[0],answer=type==='copy'?data:data[1];body=`<div class="question">${esc(q)}</div>${type==='copy'?`<p class="sample">${esc(answer)}</p>`:''}<input class="typing" id="entry" aria-label="Escreve a resposta" autocomplete="off" spellcheck="false" autocapitalize="off" placeholder="Escreve aqui"><div class="row"><button class="btn" id="check">Verificar ✓</button></div>`}else if(type==='order'){state.arr=rand(wordsFor(data));body=`<div class="question">Ordena as palavras para formar uma frase.</div><div class="assembly" id="assemble" aria-label="Palavras selecionadas"></div><div class="row" id="pieces">${state.arr.map((w,j)=>`<button class="piece" data-word="${j}">${esc(w)}</button>`).join('')}</div><div class="row" style="margin-top:15px"><button class="btn mild" id="reset">↺ Recomeçar frase</button><button class="btn" id="check">Verificar ✓</button></div>`}else if(type==='pattern'){let seq=data,series=Array.from({length:6},(_,i)=>seq[i%seq.length]);let answer=seq[6%seq.length];let candidates=rand([...new Set([answer,...['⭐','🟦','🔴','🟩','🔺','🔵','🌼','🌙','🟠'].filter(x=>x!==answer).slice(0,3)])]);body=`<div class="question">${series.join('　')}　❓</div><div class="choices">${candidates.map(v=>`<button class="choice" data-answer="${esc(v)}">${esc(v)}</button>`).join('')}</div>`}else if(type==='fractions'){let [n,d]=data;body=`<div class="question">Que fração está pintada?</div><div class="fraction ${state.mission===2?'pizza':''}" style="--cols:${state.mission===2?d:(d===8?4:d===6?3:2)}">${Array.from({length:d},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div><div class="hint">As partes são iguais. Conta as partes pintadas e o total de partes.</div><div class="choices">${rand([...new Set([`${n}/${d}`,`${d}/${n}`,`${d-n}/${d}`,`${n}/${d+1}`])]).map(a=>`<button class="choice" data-answer="${esc(a)}">${esc(a)}</button>`).join('')}</div>`}return body}
function expected(){const type=parts[state.mission][2],d=questionData();return type==='choice'?d[1]:type==='typing'?d[1]:type==='copy'||type==='order'?d:type==='pattern'?d[6%d.length]:`${d[0]}/${d[1]}`}function normalize(s){return String(s).trim().replace(/\s+/g,' ').normalize('NFC')}function accept(given){if(state.locked)return;state.attempts++;let correct=normalize(given)===normalize(expected());const box=byId('feedback');if(!correct){state.errors[state.mission]=(state.errors[state.mission]||0)+1;box.className='feedback badText';box.textContent='Ainda não está certo. Tenta novamente!';return}if(!state.done[state.mission])state.done[state.mission]=[];state.done[state.mission][state.index]=true;state.locked=true;box.className='feedback goodText';box.textContent='Muito bem! ✓ Podes continuar.';app.querySelectorAll('.choice,.piece,#entry,#check').forEach(b=>b.disabled=true);app.querySelectorAll('.choice').forEach(b=>{if(b.dataset.answer===given)b.classList.add('good')});updateBar();save()}
function syncOrder(){byId('assemble').innerHTML=state.selected.map((i,k)=>`<button class="piece" data-remove="${k}">${esc(state.arr[i])}</button>`).join('');app.querySelectorAll('[data-word]').forEach(b=>b.disabled=state.selected.includes(+b.dataset.word));app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.selected.splice(+b.dataset.remove,1);syncOrder()})}function wire(){const type=parts[state.mission][2];app.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(state.locked)return;accept(b.dataset.answer);if(state.locked)b.classList.add('good');else b.classList.add('wrong')});if(type==='order'){app.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{state.selected.push(+b.dataset.word);syncOrder()});byId('reset').onclick=()=>{state.selected=[];syncOrder()}}if(type==='typing'||type==='copy'||type==='order'){byId('check').onclick=()=>accept(type==='order'?state.selected.map(i=>state.arr[i]).join(' '):byId('entry').value);if(type!=='order')byId('entry').addEventListener('keydown',e=>{if(e.key==='Enter')byId('check').click()})}}
function showTask(){state.screen='task';const p=parts[state.mission],i=state.index;app.innerHTML=`<div class="progress"><div style="width:${progress()}%"></div></div><div class="pill">MISSÃO ${state.mission+1} / 8　·　DESAFIO ${i+1} / ${len(state.mission)}</div><h2>${esc(p[0])}</h2><p class="sub">${esc(p[1])}</p>${exercise()}<div class="feedback" id="feedback"></div>`;wire();if(state.locked){byId('feedback').textContent='Desafio já concluído ✓';byId('feedback').className='feedback goodText';app.querySelectorAll('.choice,.piece,#entry,#check').forEach(b=>b.disabled=true)}updateBar()}
function advance(){if(state.screen!=='task')return;if(!state.locked)return;if(state.index<len(state.mission)-1){state.index++;showTask()}else if(state.mission<parts.length-1){state.mission++;state.index=0;showTask()}else{state.screen='finish';app.innerHTML=`<div style="text-align:center;padding:30px"><div style="font-size:5rem">🏆</div><h1>Missões concluídas!</h1><p class="sub">Conquistaste ${completedTotal()} de ${total} estrelas.</p><button class="btn" id="again">Ver missões</button></div>`;byId('again').onclick=intro;updateBar()}}byId('home').onclick=intro;byId('next').onclick=advance;byId('prev').onclick=()=>{if(state.screen!=='task'){intro();return}if(state.index>0)state.index--;else if(state.mission>0){state.mission--;state.index=len(state.mission)-1}showTask()};
function save(){try{localStorage.setItem('ticlas3_'+CONFIG.turma,JSON.stringify({done:state.done,errors:state.errors}))}catch(e){}}function load(){try{const d=JSON.parse(localStorage.getItem('ticlas3_'+CONFIG.turma)||'{}');state.done=d.done||{};state.errors=d.errors||{}}catch(e){}}
async function digest(text){if(!crypto.subtle)throw Error('Indisponível');const bytes=new TextEncoder().encode(text);return Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('')}const HASH='0ab6d63e627eaf2f63a43514d1722ec6de93c49fc7452a9de39fe1882e2f0d98';byId('prof').onclick=()=>{app.innerHTML=`<h2>Painel do professor</h2><p>Introduza a palavra-passe para consultar os resultados deste navegador.</p><input class="typing" type="password" id="pwd" autocomplete="off"><div class="row"><button class="btn" id="unlock">Entrar</button><button class="btn mild" id="cancel">Cancelar</button></div><p id="msg"></p>`;byId('cancel').onclick=intro;byId('unlock').onclick=async()=>{try{if(await digest(byId('pwd').value)!==HASH){byId('msg').textContent='Palavra-passe incorreta.';return}showTeacher()}catch(e){byId('msg').textContent='A verificação segura exige HTTPS ou localhost.'}};byId('next').hidden=true};function showTeacher(){app.innerHTML=`<h2>Resultados neste dispositivo</h2><p>Respostas certas: ${completedTotal()}/${total}. Erros registados: ${Object.values(state.errors).reduce((x,y)=>x+y,0)}.</p><table><thead><tr><th>Missão</th><th>Concluídos</th><th>Erros</th></tr></thead><tbody>${parts.map((p,i)=>`<tr><td>${esc(p[0])}</td><td>${completed(i)}/${len(i)}</td><td>${state.errors[i]||0}</td></tr>`).join('')}</tbody></table><div class="row" style="margin:20px"><button class="btn mild" id="return">Voltar</button><button class="btn" id="clear">Reiniciar progresso</button></div>`;byId('return').onclick=intro;byId('clear').onclick=()=>{if(confirm('Apagar o progresso neste navegador?')){state.done={};state.errors={};save();intro()}}};load();intro();
</script></body></html>
