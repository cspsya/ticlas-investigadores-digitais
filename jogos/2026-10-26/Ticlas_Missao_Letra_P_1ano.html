<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#FFF8F0"><title>A Missão da Letra P — Investigadores Digitais</title><style>
:root{--blue:#5BA3D0;--darkblue:#285775;--orange:#E8834A;--cream:#FFF8F0;--ink:#2D3142;--line:#d6e8ef;--green:#34834c;--light:#eaf5f9;--red:#bc4450}*{box-sizing:border-box}html{font-family:'Nunito','Segoe UI',Verdana,sans-serif;background:var(--cream);font-size:19px}body{margin:0;background:radial-gradient(circle at 12% 5%,#f7d9c2,transparent 30%),linear-gradient(135deg,#fff8f0,#e6f3f5);color:var(--ink);min-height:100vh}button,input{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible{outline:4px solid #ffc857;outline-offset:3px}[hidden]{display:none!important}.wrap{max-width:1150px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:13px}.brand{font-weight:950;color:var(--darkblue);font-size:1.06rem}.brand small{display:block;color:#647788;font-size:.65rem}.tools{display:flex;gap:8px;align-items:center}.pill,.iconbtn{border:2px solid var(--line);border-radius:30px;background:white;padding:9px 13px;font-weight:900}.iconbtn{min-width:46px}.shell{background:#fff;border:2px solid #e1edf2;border-radius:28px;padding:clamp(15px,3vw,28px);box-shadow:0 13px 35px #28577519;min-height:530px}.eyebrow{color:var(--darkblue);font-weight:950;font-size:.77rem;letter-spacing:.07em;text-transform:uppercase}.hero{display:grid;grid-template-columns:220px 1fr;align-items:center;gap:20px;min-height:410px}.mascot{width:100%;max-width:210px;filter:drop-shadow(0 12px 12px #20384825)}h1,h2,h3{font-family:'Fredoka','Trebuchet MS',sans-serif;line-height:1.12}h1{font-size:clamp(2.1rem,5vw,3.3rem);color:var(--darkblue);margin:8px 0}h2{font-size:clamp(1.4rem,3vw,2rem);color:var(--darkblue);margin:6px 0 12px}.bigp{font-size:clamp(4rem,15vw,8rem);color:var(--orange);font-weight:950;line-height:1.1;letter-spacing:.03em}.muted{color:#596e7e}.btn{border:0;border-radius:17px;padding:13px 22px;background:var(--orange);color:white;font-weight:950;box-shadow:0 5px 0 #b75e30}.btn.secondary{background:var(--blue);box-shadow:0 5px 0 var(--darkblue)}.btn.ghost{background:white;color:var(--darkblue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}.btn:active{transform:translateY(3px);box-shadow:none}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.center{justify-content:center;text-align:center}.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:20px 0}.mission{border:3px solid var(--line);border-radius:23px;background:linear-gradient(150deg,white,#f4fafc);padding:15px 7px;min-height:148px;display:grid;justify-items:center;align-content:center;gap:4px;position:relative;font-weight:900;box-shadow:0 5px 0 var(--line);color:var(--ink)}.mission:hover{border-color:var(--blue)}.mission.done{background:#e7f5e7;border-color:#65ab79;box-shadow:0 5px 0 #65ab79}.mission.active{border-color:var(--orange);box-shadow:0 5px 0 var(--orange)}.mission .ic{font-size:2.25rem}.mission .num{position:absolute;left:8px;top:8px;font-size:.68rem;border-radius:30px;background:var(--blue);color:white;padding:3px 9px}.mission small{font-size:.7rem;color:#4c6679}.game-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.bar{display:flex;gap:5px;flex:1;max-width:480px}.bar i{height:11px;flex:1;background:#e2eff4;border-radius:10px}.bar i.on{background:var(--orange)}.prompt{text-align:center;border-radius:20px;background:var(--light);padding:16px;margin:15px auto;max-width:850px}.prompt .visual{display:block;font-size:clamp(3.5rem,9vw,6rem);line-height:1.15}.prompt .glyph{font-size:clamp(3.5rem,8vw,6rem);font-weight:950;letter-spacing:.12em;color:var(--darkblue)}.prompt .label{font-size:1.16rem;font-weight:950}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;max-width:900px;margin:18px auto}.choice{border:3px solid var(--line);background:white;border-radius:20px;min-height:113px;font-size:clamp(1.55rem,4vw,2.8rem);font-weight:950;box-shadow:0 5px 0 var(--line);padding:9px;color:var(--ink);position:relative}.choice:hover{border-color:var(--blue)}.choice .em{display:block;font-size:3.1rem;line-height:1.15}.choice .txt{display:block;font-size:1.2rem}.choice.ok{border-color:var(--green);background:#e7f7e9;box-shadow:0 5px 0 var(--green)}.choice.no{border-color:var(--red);background:#fff0f0}.balloons .choice{border-radius:50% 50% 45% 45%;min-height:150px;background:var(--balloon,#e8834a);color:white;border-color:transparent;box-shadow:inset -10px -12px 0 #0002;animation:float 3s ease-in-out infinite}.balloons .choice:nth-child(2){animation-delay:-1s}.balloons .choice:nth-child(3){animation-delay:-2s}.balloons .choice.ok{background:var(--green);border-color:#205c34}.balloons .choice.no{background:#999}.balloons .choice::after{content:'';position:absolute;left:50%;bottom:-23px;width:2px;height:23px;background:#6e8e98}@keyframes float{50%{transform:translateY(-8px)}}.feed{font-size:1.13rem;font-weight:950;text-align:center;min-height:39px;margin:10px 0}.feed.ok{color:var(--green)}.feed.no{color:var(--red)}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:19px;flex-wrap:wrap}.tiles{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px auto}.tile{font-size:2.3rem;font-weight:950;border:3px solid var(--blue);border-radius:17px;background:white;min-width:70px;min-height:76px;padding:8px}.tile:disabled{opacity:.3}.assembled{display:flex;justify-content:center;align-items:center;gap:6px;min-height:95px;border:3px dashed var(--blue);border-radius:18px;background:#f5fbff;font-size:2.7rem;font-weight:950;letter-spacing:.06em;margin:auto;max-width:630px}.trace{display:block;width:min(100%,600px);height:230px;margin:14px auto;border:4px dashed #a9cbda;border-radius:22px;background:repeating-linear-gradient(transparent 0 74px,#d6e5eb 75px 77px,transparent 78px 113px);touch-action:none;cursor:crosshair}.traceline{color:#b5cbd9;font-size:7rem;font-weight:900;line-height:1}.footer{display:flex;justify-content:center;gap:10px 17px;flex-wrap:wrap;font-size:.64rem;margin-top:13px;color:#586e7d}.footer a{color:var(--darkblue)}.hint{font-size:.8rem;font-weight:800;color:#526e80}.mini{display:inline-block;border:2px solid #bcdce7;background:white;border-radius:15px;padding:9px 12px;font-weight:900}.celebrate{text-align:center;padding:15px}.celebrate .star{font-size:5rem}.modal{position:fixed;inset:0;background:#142d39b3;display:grid;place-items:center;z-index:10;padding:12px}.dialog{width:min(95vw,620px);max-height:90vh;overflow:auto;background:white;border-radius:23px;padding:22px}.dialog label{display:block;font-size:.8rem;margin:12px 0}.dialog input{width:100%;padding:12px;border:2px solid var(--line);border-radius:10px}.teacher-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.access{font-size:1.2rem}.sortword{font-size:2rem;font-weight:950;color:var(--darkblue)}.guide{display:inline-flex;align-items:center;gap:7px;border-radius:13px;background:#fff7e8;padding:7px 11px;font-size:.83rem;font-weight:850}.game-mascot{width:73px;float:left;margin-right:13px}.selected{background:#ffeccc!important;border-color:var(--orange)!important}.dots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.dot{width:20px;height:20px;border-radius:50%;background:#d9e9ed}.dot.yes{background:var(--green)}@media(max-width:700px){.hero{grid-template-columns:1fr;text-align:center}.hero .mascot{max-width:130px;margin:auto}.map{grid-template-columns:repeat(2,minmax(0,1fr))}.shell{min-height:0}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}.choice{min-height:95px}.top .brand{flex:1}.game-mascot{display:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}@media print{.top,.nav,.footer,.modal{display:none!important}}
</style></head><body><div class="wrap"><header class="top"><div class="brand">Investigadores Digitais<small>com o Ticl@s · Português · 1.º ano</small></div><div class="tools"><span class="pill" id="score">⭐ 0</span><span class="pill" title="Áudio permanentemente desligado">🔇 Sem som</span><button class="iconbtn" id="teacher" title="Painel do professor" aria-label="Painel do professor">⚙️</button></div></header><main class="shell" id="app" aria-live="polite"></main><footer class="footer"><a href="https://sites.google.com/view/investigadores-a-descoberta/p%C3%A1gina-inicial" target="_blank" rel="noopener">Investigadores à Descoberta</a><a href="https://gavetadefichas.wordpress.com/" target="_blank" rel="noopener">Site Gaveta de Fichas</a><a href="https://gavetadefichas.blogspot.com/?m=1" target="_blank" rel="noopener">Blog Gaveta de Fichas</a><a href="https://www.facebook.com/100071380264004/?locale=pt_PT" target="_blank" rel="noopener">Facebook Gaveta de Fichas</a></footer></div><div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div>
<script>
'use strict';
const APP=document.getElementById('app');
const ICONS=['🔎','🎈','🧩','🦆','🚂','🎨','✏️','🏆'];
const NAMES=['Caça ao P','Rebenta os balões','Família do P','Imagens e sílabas','Comboio das palavras','Palavras escondidas','Escreve o P','Desafio final'];
const PAIRS=[{w:'pato',e:'🦆',sy:'pa'},{w:'pera',e:'🍐',sy:'pe'},{w:'pipa',e:'🪁',sy:'pi'},{w:'porco',e:'🐷',sy:'po'},{w:'pudim',e:'🍮',sy:'pu'},{w:'pão',e:'🍞',sy:'pã'},{w:'peixe',e:'🐟',sy:'pei'},{w:'piano',e:'🎹',sy:'pi'},{w:'panela',e:'🍲',sy:'pa'},{w:'pirata',e:'🏴‍☠️',sy:'pi'},{w:'pote',e:'🏺',sy:'po'},{w:'papagaio',e:'🦜',sy:'pa'}];
const Q=[
[{kind:'letter',target:'P',opts:['P','B','R','D'],prompt:'Encontra o P'},{kind:'letter',target:'p',opts:['q','b','p','d'],prompt:'Encontra o p'},{kind:'letter',target:'P',opts:['B','P','D','R'],prompt:'Toca no P'},{kind:'letter',target:'p',opts:['p','q','b','a'],prompt:'Toca no p'},{kind:'letter',target:'P',opts:['P','F','T','B'],prompt:'Encontra o P'}],
[{kind:'balloon',target:'P',opts:['P','R','B','D'],prompt:'Rebenta o balão com P'},{kind:'balloon',target:'p',opts:['q','p','b','d'],prompt:'Rebenta o balão com p'},{kind:'balloon',target:'pa',opts:['pa','ba','ta','da'],prompt:'Rebenta o balão com pa'},{kind:'balloon',target:'pi',opts:['ti','bi','pi','di'],prompt:'Rebenta o balão com pi'},{kind:'balloon',target:'po',opts:['bo','to','do','po'],prompt:'Rebenta o balão com po'}],
[{kind:'syllable',target:'pa',opts:['pa','pe','pi','po'],prompt:'Encontra pa'},{kind:'syllable',target:'pe',opts:['pa','po','pe','pu'],prompt:'Encontra pe'},{kind:'syllable',target:'pi',opts:['pu','pi','pa','pe'],prompt:'Encontra pi'},{kind:'syllable',target:'po',opts:['po','pu','pi','pa'],prompt:'Encontra po'},{kind:'syllable',target:'pu',opts:['pa','po','pe','pu'],prompt:'Encontra pu'}],
[{kind:'picture',pic:'🦆',target:'pa',opts:['pa','pe','pi'],prompt:'Toca na sílaba inicial'},{kind:'picture',pic:'🍐',target:'pe',opts:['pi','po','pe'],prompt:'Toca na sílaba inicial'},{kind:'picture',pic:'🪁',target:'pi',opts:['pi','pa','pu'],prompt:'Toca na sílaba inicial'},{kind:'picture',pic:'🐷',target:'po',opts:['pa','po','pe'],prompt:'Toca na sílaba inicial'},{kind:'picture',pic:'🍮',target:'pu',opts:['po','pi','pu'],prompt:'Toca na sílaba inicial'}],
[{kind:'build',pic:'🦆',word:'pato',parts:['pa','to'],opts:['to','pa','pe']},{kind:'build',pic:'🍐',word:'pera',parts:['pe','ra'],opts:['ra','pa','pe']},{kind:'build',pic:'🪁',word:'pipa',parts:['pi','pa'],opts:['pa','po','pi']},{kind:'build',pic:'🐷',word:'porco',parts:['por','co'],opts:['co','por','par']},{kind:'build',pic:'🍮',word:'pudim',parts:['pu','dim'],opts:['dim','pu','pa']}],
[{kind:'missing',pic:'🦆',word:'pato',target:'p',display:'_ato',opts:['p','b','t']},{kind:'missing',pic:'🍐',word:'pera',target:'p',display:'_era',opts:['b','p','d']},{kind:'missing',pic:'🪁',word:'pipa',target:'pi',display:'__pa',opts:['pi','pe','po']},{kind:'missing',pic:'🐷',word:'porco',target:'po',display:'__rco',opts:['pa','pu','po']},{kind:'missing',pic:'🍮',word:'pudim',target:'pu',display:'__dim',opts:['pe','pu','pi']}],
[{kind:'trace',letter:'P'},{kind:'trace',letter:'p'},{kind:'trace',letter:'P'},{kind:'trace',letter:'p'},{kind:'trace',letter:'P p'}],
[{kind:'picture',pic:'🦆',target:'pa',opts:['po','pa','pe']},{kind:'letter',target:'p',opts:['b','q','p','d']},{kind:'build',pic:'🍐',word:'pera',parts:['pe','ra'],opts:['ra','pe','pa']},{kind:'picture',pic:'🐷',target:'po',opts:['pa','po','pi']},{kind:'balloon',target:'P',opts:['B','P','R','D']},{kind:'missing',pic:'🪁',word:'pipa',target:'pi',display:'__pa',opts:['po','pi','pu']}]
];
let state={screen:'home',mission:0,step:0,stars:0,done:[],attempts:0,wrong:0,finished:false,traceMarks:{}};
try{const saved=JSON.parse(localStorage.getItem('ticlas-letra-p-v1')||'null');if(saved&&Array.isArray(saved.done))state={...state,...saved,screen:'map',finished:false}}catch(e){}
const save=()=>{try{localStorage.setItem('ticlas-letra-p-v1',JSON.stringify({...state,screen:'map'}))}catch(e){}};
const mascot=()=>`<img class="mascot" alt="Ticl@s, a mascote dos Investigadores Digitais" src="${MASCOT_DATA}">`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){document.getElementById('score').textContent='⭐ '+state.stars;if(state.screen==='home')home();else if(state.screen==='map')map();else if(state.screen==='end')end();else game()}
function home(){APP.innerHTML=`<div class="hero"><div>${mascot()}</div><div><div class="eyebrow">MISSÃO DE PORTUGUÊS · 1.º ANO</div><h1>O grande mistério da <span style="color:var(--orange)">letra P</span></h1><div class="bigp" aria-label="P maiúsculo, p minúsculo">P p</div><p class="muted">8 missões · Jogar ao meu ritmo · Sem som</p><div class="row"><button class="btn" id="start">▶ COMEÇAR</button><span class="guide">🖱️ Toca ou clica para jogar</span></div></div></div>`;document.getElementById('start').onclick=()=>{state.screen='map';render()}}
function map(){APP.innerHTML=`<div class="row" style="justify-content:space-between"><div><div class="eyebrow">MAPA DAS MISSÕES</div><h2>Explora a letra P</h2></div><div class="guide">✅ ${state.done.length} de 8 missões</div></div><div class="map">${NAMES.map((n,i)=>`<button class="mission ${state.done.includes(i)?'done':''} ${i===state.mission?'active':''}" data-m="${i}" aria-label="Missão ${i+1}: ${n}"><span class="num">${i+1}</span><span class="ic">${ICONS[i]}</span><span>${n}</span><small>${state.done.includes(i)?'✓ Concluída':(Q[i].length+' desafios')}</small></button>`).join('')}</div><div class="row center"><span class="guide">Escolhe uma missão. Podes repetir as que já terminaste.</span>${state.done.length===8?'<button class="btn" id="finish">🏆 VER RESULTADO</button>':''}</div>`;APP.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{state.mission=+b.dataset.m;state.step=0;state.screen='game';render()});let f=document.getElementById('finish');if(f)f.onclick=()=>{state.screen='end';render()}}
function nav(next){return `<div class="nav"><button class="btn ghost" id="back">⬅ Mapa</button><button class="btn secondary" id="next" ${next?'':'disabled'}>Próximo ➡</button></div>`}
function game(){const mi=state.mission,q=Q[mi][state.step],n=Q[mi].length;state.finished=false;const colors=['#E8834A','#5BA3D0','#9B72CF','#db6482'];const head=`<div class="game-top"><div class="eyebrow">${ICONS[mi]} MISSÃO ${mi+1} · ${esc(NAMES[mi])}</div><span class="pill">${state.step+1} / ${n}</span></div><div class="bar" role="progressbar" aria-valuenow="${state.step+1}" aria-valuemax="${n}">${Array.from({length:n},(_,i)=>`<i class="${i<=state.step?'on':''}"></i>`).join('')}</div>`;
let body='';
if(q.kind==='letter'||q.kind==='syllable'||q.kind==='balloon'){body=`<div class="prompt"><span class="label">${esc(q.prompt)}</span><span class="glyph">${esc(q.target)}</span><div class="hint">👆 Toca na resposta certa</div></div>${choices(q.opts,q.target,q.kind==='balloon'?colors:null)}`}
if(q.kind==='picture'){body=`<div class="prompt"><span class="visual">${q.pic}</span><div class="label">${mi===7?'Qual é a primeira sílaba?':'Escolhe a primeira sílaba'}</div><div class="hint">👆 Observa a imagem e escolhe</div></div>${choices(q.opts,q.target)}`}
if(q.kind==='missing'){body=`<div class="prompt"><span class="visual">${q.pic}</span><span class="glyph">${q.display.replace('_','▢')}</span><div class="hint">🧩 Completa a palavra</div></div>${choices(q.opts,q.target)}`}
if(q.kind==='build'){body=`<div class="prompt"><span class="visual">${q.pic}</span><div class="label">🧩 Constrói a palavra</div></div><div class="assembled" id="assembled" aria-label="Sílabas colocadas">${q.parts.map(()=>'▢').join(' ')}</div><div class="tiles" id="tiles">${q.opts.map((x,i)=>`<button class="tile" data-tile="${i}" aria-label="Sílaba ${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="row center"><button class="btn ghost" id="clear">↺ Tentar outra vez</button></div>`}
if(q.kind==='trace'){body=`<div class="prompt"><div class="label">✏️ Desenha a letra com o dedo ou o rato</div><span class="glyph">${esc(q.letter)}</span><div class="hint">Segue o modelo. Depois, carrega em «Concluí».</div></div><div style="position:relative"><canvas id="canvas" class="trace" width="900" height="345" aria-label="Área para desenhar a letra"></canvas></div><div class="row center"><button class="btn ghost" id="clearTrace">↺ Apagar</button><button class="btn secondary" id="confirmTrace" disabled>✅ Concluí</button></div>`}
APP.innerHTML=head+`<div style="padding-top:9px">${body}</div><div class="feed" id="feedback" aria-live="polite"></div>`+nav(false);
document.getElementById('back').onclick=()=>{state.screen='map';save();render()};document.getElementById('next').onclick=next;
if(['letter','syllable','balloon','picture','missing'].includes(q.kind))APP.querySelectorAll('[data-answer]').forEach(btn=>btn.onclick=()=>answer(btn,btn.dataset.answer===q.target));
if(q.kind==='build')initBuild(q);if(q.kind==='trace')initTrace(q)}
function choices(opts,target,colors){return `<div class="choices ${colors?'balloons':''}">${opts.map((o,i)=>`<button class="choice" data-answer="${esc(o)}" ${colors?`style="--balloon:${colors[i%colors.length]}"`:''} aria-label="${esc(o)}">${esc(o)}</button>`).join('')}</div>`}
function feedback(ok){let f=document.getElementById('feedback');f.textContent=ok?'✅ Muito bem!':'↺ Experimenta outra vez';f.className='feed '+(ok?'ok':'no')}
function success(){if(state.finished)return;state.finished=true;state.stars++;state.attempts++;feedback(true);document.getElementById('next').disabled=false;save()}
function answer(el,ok){if(state.finished)return;if(ok){el.classList.add('ok');APP.querySelectorAll('[data-answer]').forEach(b=>b.disabled=true);success()}else{state.wrong++;el.classList.add('no');el.disabled=true;feedback(false);save()}}
function initBuild(q){let chosen=[];const draw=()=>{document.getElementById('assembled').textContent=chosen.length?chosen.join(' ')+' '+Array(q.parts.length-chosen.length).fill('▢').join(' '):q.parts.map(()=>'▢').join(' ')};APP.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{if(state.finished)return;let value=b.textContent;let wanted=q.parts[chosen.length];if(value===wanted){chosen.push(value);b.disabled=true;draw();if(chosen.length===q.parts.length)success()}else{state.wrong++;b.classList.add('selected');feedback(false);setTimeout(()=>b.classList.remove('selected'),450);save()}});document.getElementById('clear').onclick=()=>{if(state.finished)return;chosen=[];APP.querySelectorAll('[data-tile]').forEach(b=>b.disabled=false);draw();feedback(false)}}
function initTrace(q){const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let drawing=false,segments=0;function base(){ctx.clearRect(0,0,900,345);ctx.fillStyle='#c5dce8';ctx.font='bold 245px "Trebuchet MS", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(q.letter,450,169);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=15;ctx.strokeStyle='#E8834A'}base();const point=e=>{const r=canvas.getBoundingClientRect();return {x:(e.clientX-r.left)*900/r.width,y:(e.clientY-r.top)*345/r.height}};canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture(e.pointerId);let p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y)});canvas.addEventListener('pointermove',e=>{if(!drawing)return;let p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();segments++;if(segments>=10)document.getElementById('confirmTrace').disabled=false});const stop=()=>drawing=false;canvas.addEventListener('pointerup',stop);canvas.addEventListener('pointercancel',stop);document.getElementById('clearTrace').onclick=()=>{segments=0;base();document.getElementById('confirmTrace').disabled=true};document.getElementById('confirmTrace').onclick=success}
function next(){if(!state.finished)return;if(state.step<Q[state.mission].length-1){state.step++;save();render()}else{if(!state.done.includes(state.mission))state.done.push(state.mission);state.screen='map';state.step=0;save();render();if(state.done.length===8){state.screen='end';render()}}}
function end(){APP.innerHTML=`<div class="celebrate">${mascot()}<div class="eyebrow">MISSÃO CUMPRIDA</div><h1>Fantástico trabalho!</h1><div class="bigp">P p</div><p>Concluíste ${state.done.length} de 8 missões da letra P.</p><div class="star">🏆 ⭐</div><div class="row center"><button class="btn secondary" id="tomap">🗺️ Rever missões</button><button class="btn" id="restart">↺ Jogar novamente</button></div></div>`;document.getElementById('tomap').onclick=()=>{state.screen='map';render()};document.getElementById('restart').onclick=()=>{state={screen:'home',mission:0,step:0,stars:0,done:[],attempts:0,wrong:0,finished:false,traceMarks:{}};save();render()}}
function closeModal(){document.getElementById('modal').hidden=true}document.getElementById('teacher').onclick=()=>{document.getElementById('modal').hidden=false;document.getElementById('dialog').innerHTML=`<h2>⚙️ Painel do professor</h2><p class="hint">Área reservada · Palavra-passe predefinida: pixel2026</p><label>Palavra-passe<input type="password" id="password" autocomplete="off"></label><p id="authmsg" class="feed"></p><div class="row"><button class="btn secondary" id="login">Entrar</button><button class="btn ghost" id="cancel">Fechar</button></div>`;document.getElementById('cancel').onclick=closeModal;document.getElementById('login').onclick=login};
async function login(){const pass=document.getElementById('password').value;const bytes=new TextEncoder().encode(pass);if(!crypto.subtle){document.getElementById('authmsg').textContent='Este navegador não permite verificar a palavra-passe neste contexto. Abre o ficheiro num navegador atualizado.';return}const hash=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes))).map(x=>x.toString(16).padStart(2,'0')).join('');if(hash!==EXPECTED_HASH){document.getElementById('authmsg').textContent='Palavra-passe incorreta';return}document.getElementById('dialog').innerHTML=`<h2>⚙️ Painel do professor</h2><p>Progresso neste dispositivo (guardado apenas neste navegador).</p><div class="teacher-grid"><div class="mini">✅ Missões: ${state.done.length}/8</div><div class="mini">⭐ Respostas certas: ${state.attempts}</div><div class="mini">↺ Tentativas incorretas: ${state.wrong}</div><div class="mini">🔇 Áudio: desligado</div></div><p class="hint">Duração sugerida: 60 minutos, ao ritmo de cada aluno. O traçado é uma atividade exploratória, sem correção automática.</p><div class="row"><button class="btn secondary" id="report">🖨️ Imprimir resumo</button><button class="btn ghost" id="reset">↺ Limpar progresso</button><button class="btn ghost" id="doneModal">Fechar</button></div>`;document.getElementById('report').onclick=()=>window.print();document.getElementById('doneModal').onclick=closeModal;document.getElementById('reset').onclick=()=>{if(confirm('Eliminar o progresso deste dispositivo?')){localStorage.removeItem('ticlas-letra-p-v1');location.reload()}}}
