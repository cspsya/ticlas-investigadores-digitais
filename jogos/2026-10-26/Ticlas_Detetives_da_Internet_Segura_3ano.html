<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detetives da Internet Segura com o Ticl@s · 3.º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --t-1:#b0632a;--t-1d:#6e3a14;--t-1l:#f8e6d6;--t-2:#5f8a2a;--t-2d:#43631b;--t-fundo:#fff8ef;--t-fundo2:#f6e3cf;
  --ink:#2D3142;--ff:'Nunito','Segoe UI',system-ui,sans-serif;--ft:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --verde:#2f9e5b;--vermelho:#d94b4b;--amarelo:#FFC857;--azul:#3b7fc4;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ff);color:var(--ink);background:radial-gradient(circle at 20% 0%,var(--t-1l),var(--t-fundo) 60%);overflow:hidden}
body.legivel{--ff:Verdana,Tahoma,sans-serif;--ft:Verdana,Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer}
#app{height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 8px 4px}
#ecra-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#player{display:flex;flex-direction:column;border-radius:20px;overflow:hidden;box-shadow:0 18px 50px -18px rgba(45,49,66,.55),0 0 0 1px rgba(45,49,66,.08);background:#1c2030}
#player:fullscreen{border-radius:0;justify-content:center;background:#10131c;width:100vw;height:100vh;align-items:center}
#ecra{position:relative;overflow:hidden;background:var(--t-fundo)}
#palco{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}

/* ---------- fundo ---------- */
#fundo{position:absolute;inset:0}
#fundo svg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:44px;opacity:.28;animation:flutua 9s ease-in-out infinite;pointer-events:none;filter:saturate(.9)}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-16px) rotate(6deg)}}
.nuvem{animation:nuvem 60s linear infinite}
@keyframes nuvem{from{transform:translateX(-200px)}to{transform:translateX(1400px)}}

/* ---------- mascote ---------- */
#masc{position:absolute;z-index:5;transition:opacity .35s;pointer-events:none}
#masc img{height:100%;display:block;filter:drop-shadow(0 10px 12px rgba(60,30,10,.25));animation:respira 3.2s ease-in-out infinite;transform-origin:50% 100%}
#masc.fala img{animation:falar .32s ease-in-out infinite alternate}
#masc .sombra{position:absolute;left:12%;right:12%;bottom:-10px;height:22px;border-radius:50%;background:radial-gradient(rgba(60,40,20,.28),transparent 70%)}
#masc .aces{position:absolute;font-size:46px;top:-6px;right:4%;animation:baloica 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}
#masc.pose img{animation:pose .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.015,.99)}}
@keyframes falar{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-6px) rotate(1deg)}}
@keyframes pose{from{transform:scale(.88)}to{transform:scale(1)}}
@keyframes baloica{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.pos-esq{left:26px;bottom:104px;height:300px;width:320px}
.pos-dir{right:36px;bottom:110px;height:330px;width:350px}
.pos-grande{right:60px;bottom:118px;height:430px;width:440px}
.pos-canto{left:14px;bottom:8px;height:168px;width:190px}
#masc.pos-esq img,#masc.pos-canto img{margin-left:auto;margin-right:auto}
#masc.pos-dir img,#masc.pos-grande img{margin-left:auto}

/* ---------- legendas ---------- */
#legenda{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);max-width:1120px;width:max-content;z-index:20;
  background:rgba(22,26,40,.82);color:#fff;font:800 30px/1.3 var(--ff);padding:12px 28px;border-radius:18px;text-align:center;
  box-shadow:0 8px 20px -8px rgba(0,0,0,.4);transition:opacity .25s}
#legenda:empty,body.sem-leg #legenda{opacity:0}
body.leg-grande #legenda{font-size:38px}
#palco.int #legenda{left:220px;right:300px;transform:none;max-width:none;width:auto}
body.contraste #legenda{background:#000;color:#ffeb3b;border:3px solid #ffeb3b}

/* ---------- etiqueta do capítulo ---------- */
#cap-tag{position:absolute;left:22px;top:18px;z-index:15;background:rgba(255,255,255,.88);color:var(--t-1d);font:600 22px var(--ft);padding:8px 18px 8px 12px;border-radius:999px;box-shadow:0 6px 16px -8px rgba(0,0,0,.3);display:flex;gap:8px;align-items:center}
#cap-tag:empty,#palco.int #cap-tag{display:none}
#cap-tag b{background:var(--t-1);color:#fff;border-radius:999px;padding:2px 10px;font-size:17px}

/* ---------- cena ---------- */
#cena{position:absolute;inset:0;z-index:4}
#cena.entra{animation:entra .6s ease both}
@keyframes entra{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.abs{position:absolute}
.k{opacity:0;transform:translateY(18px) scale(.94);transition:opacity .5s,transform .6s cubic-bezier(.2,1.4,.4,1)}
.k.on{opacity:1;transform:none}
.k.pop{transform:scale(.3)}.k.pop.on{transform:none}
.cartao{background:#fff;border-radius:26px;box-shadow:0 14px 30px -14px rgba(45,49,66,.35),0 0 0 1px rgba(45,49,66,.05)}
body.contraste .cartao{box-shadow:0 0 0 4px #000}
.titulo-cena{font:700 44px/1.1 var(--ft);color:var(--t-1d)}
.chip{display:inline-flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:14px 22px;font:800 27px/1.15 var(--ff);box-shadow:0 10px 22px -12px rgba(45,49,66,.4)}
.chip .e{font-size:40px;line-height:1}
.chip.bom{background:#e7f6ec;color:#1d6b3c;border:3px solid #9fd8b4}
.chip.mau{background:#fdeaea;color:#9a2929;border:3px solid #f0b0b0}
.chip.info{background:#eef5fc;color:#24557f;border:3px solid #b5d3ee}
.carimbo{font:700 50px var(--ft);color:var(--vermelho);border:7px solid var(--vermelho);border-radius:18px;padding:6px 26px;background:rgba(255,255,255,.92);transform:rotate(-10deg) scale(2.2);opacity:0;transition:transform .45s cubic-bezier(.4,1.6,.6,1),opacity .3s;white-space:nowrap}
.carimbo.on{transform:rotate(-10deg) scale(1);opacity:1}
.carimbo.verde{color:var(--verde);border-color:var(--verde)}
.perigo-tag{left:370px;top:18px;background:var(--vermelho);color:#fff;font:600 26px var(--ft);padding:8px 22px;border-radius:999px;box-shadow:0 8px 18px -8px rgba(160,30,30,.6)}
.perigo-tag small{opacity:.85;font-size:20px}

/* título */
.logo-bolota{width:120px;height:140px}
.titulo-grande{font:700 86px/1 var(--ft);color:var(--t-1d);letter-spacing:-1px;text-shadow:0 4px 0 rgba(255,255,255,.8)}
.subtitulo{font:600 42px var(--ft);color:var(--t-2)}
.lema{font:800 30px/1.3 var(--ff);color:var(--ink);max-width:640px}
.pill{display:inline-block;background:var(--t-1);color:#fff;font:600 22px var(--ft);padding:6px 18px;border-radius:999px}

/* cidade */
.bolha{display:flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:10px 20px 10px 12px;font:800 26px var(--ff);box-shadow:0 10px 22px -10px rgba(45,49,66,.45);border:3px solid var(--t-1l)}
.bolha .e{font-size:38px}
.tracejado{stroke-dasharray:6 10;animation:dash 1.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-32}}

/* tesouros */
.tesouro{width:200px;text-align:center}
.tesouro svg{width:120px;height:144px;display:block;margin:0 auto;filter:drop-shadow(0 8px 8px rgba(120,70,20,.25))}
.tesouro .ico{position:absolute;left:50%;top:76px;transform:translateX(-50%);font-size:44px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.88);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.tesouro .nome{display:inline-block;margin-top:8px;background:#fff;border-radius:999px;padding:6px 16px;font:800 22px var(--ff);color:var(--t-1d);box-shadow:0 6px 14px -8px rgba(0,0,0,.35)}

/* janelas (chat, navegador, telemóvel) */
.janela{background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 24px 50px -20px rgba(30,35,55,.5),0 0 0 1px rgba(45,49,66,.08)}
.janela .barra{height:52px;background:#eef1f6;display:flex;align-items:center;gap:8px;padding:0 18px;font:800 21px var(--ff);color:#56607a}
.janela .barra i{width:14px;height:14px;border-radius:50%;display:inline-block}
.endereco{flex:1;margin-left:12px;background:#fff;border-radius:999px;padding:6px 16px;font:700 18px var(--ff);color:#8a93a8}
.msg{max-width:440px;padding:14px 20px;border-radius:22px;font:800 27px/1.25 var(--ff);box-shadow:0 6px 14px -10px rgba(0,0,0,.35)}
.msg.rec{background:#eef1f6;border-top-left-radius:6px}
.msg.env{background:#d8f3df;border-top-right-radius:6px;margin-left:auto}
.msg.mal{background:#fde8e8;border:3px solid #f2a7a7}
.avatar{width:96px;height:96px;perspective:600px}
.avatar .in{position:relative;width:100%;height:100%;transition:transform .9s cubic-bezier(.4,1.4,.6,1);transform-style:preserve-3d}
.avatar.on .in{transform:rotateY(180deg)}
.avatar .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:50%;overflow:hidden}
.avatar .verso{transform:rotateY(180deg)}
.popup{border-radius:26px;overflow:hidden;text-align:center;color:#fff;background:linear-gradient(160deg,#ffb938,#ff7a2f);border:6px solid #fff;box-shadow:0 24px 50px -16px rgba(200,80,0,.6)}
.popup .raios{position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg);animation:gira 12s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
.popup .btn-falso{display:inline-block;background:#e53935;color:#fff;font:700 34px var(--ft);padding:12px 34px;border-radius:999px;border:4px solid #fff;animation:pisca .7s ease-in-out infinite alternate}
@keyframes pisca{from{transform:scale(1);box-shadow:0 0 0 0 rgba(255,255,255,.7)}to{transform:scale(1.08);box-shadow:0 0 0 14px rgba(255,255,255,0)}}
.cursor{animation:cursor 2.4s ease-in-out infinite}
@keyframes cursor{0%,100%{transform:translate(70px,60px)}50%{transform:translate(0,0)}}
.tablet{perspective:1200px}
.tablet .in{position:relative;width:100%;height:100%;transition:transform 1s cubic-bezier(.4,1.2,.6,1);transform-style:preserve-3d}
.tablet.on .in{transform:rotateX(180deg)}
.tablet .lado{position:absolute;inset:0;backface-visibility:hidden;border-radius:34px;background:#23263a;padding:22px}
.tablet .tras{transform:rotateX(180deg);background:linear-gradient(150deg,#9aa3b8,#6c7489);display:flex;align-items:center;justify-content:center}
.ecra-mau{width:100%;height:100%;border-radius:16px;background:radial-gradient(circle at 40% 40%,#5b2c83,#1d1030);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.ecra-mau .borrao{position:absolute;border-radius:50%;filter:blur(26px);opacity:.7}
.telemovel{border-radius:46px;background:#23263a;padding:16px}
.telemovel .ecr{background:#f7f8fb;border-radius:32px;height:100%;padding:70px 18px 18px;display:flex;flex-direction:column;gap:16px;position:relative}
.telemovel .ecr::before{content:"";position:absolute;top:14px;left:50%;transform:translateX(-50%);width:110px;height:26px;border-radius:999px;background:#23263a}

/* semáforo */
.lamp{fill:#4a4f63;transition:fill .4s,filter .4s}
.lamp.l1.on{fill:#ff4d4d;filter:drop-shadow(0 0 22px #ff4d4d)}
.lamp.l2.on{fill:#ffc531;filter:drop-shadow(0 0 22px #ffc531)}
.lamp.l3.on{fill:#3fd07a;filter:drop-shadow(0 0 22px #3fd07a)}
.regra-linha{display:flex;align-items:center;gap:20px}
.regra-linha .grande{font:700 54px var(--ft)}
.regra-linha .e{font-size:64px;width:96px;height:96px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 22px -12px rgba(0,0,0,.4)}
.regra-linha p{margin:2px 0 0;font:800 25px var(--ff);color:#4d5468}

/* medalha / promessa */
.promessa{display:flex;align-items:center;gap:14px;font:800 30px var(--ff);background:#fff;border-radius:20px;padding:12px 20px;box-shadow:0 10px 22px -14px rgba(0,0,0,.4)}
.promessa .v{width:44px;height:44px;border-radius:50%;background:var(--verde);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}

/* ---------- interações ---------- */
.int-topo{left:220px;right:30px;top:20px;display:flex;align-items:center;gap:18px}
.int-topo .titulo-cena{font-size:40px}
.int-topo .prog{margin-left:auto;display:flex;gap:6px}
.int-topo .prog span{font-size:30px;opacity:.25;filter:grayscale(1);transition:.4s}
.int-topo .prog span.feito{opacity:1;filter:none;transform:scale(1.15)}
.btn{border:0;border-radius:22px;font:800 28px var(--ff);padding:16px 28px;background:#fff;color:var(--ink);box-shadow:0 8px 0 rgba(45,49,66,.16),0 14px 24px -14px rgba(45,49,66,.5);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(45,49,66,.16)}
.btn.prim{background:var(--t-1);color:#fff;box-shadow:0 8px 0 var(--t-1d),0 14px 24px -14px rgba(45,49,66,.5)}
.btn.sec{background:var(--t-2);color:#fff;box-shadow:0 8px 0 var(--t-2d),0 14px 24px -14px rgba(45,49,66,.5)}
.btn:focus-visible{outline:5px solid var(--azul);outline-offset:4px}
.btn.certo{background:#dff5e6!important;color:#1b6b3a!important;box-shadow:0 0 0 5px var(--verde),0 8px 0 #1b6b3a!important}
.btn.errado{background:#f3f3f3!important;color:#9aa0ad!important;box-shadow:none!important;transform:none!important;cursor:default}
.btn.treme{animation:treme .45s}
@keyframes treme{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.continuar{right:34px;bottom:96px;z-index:12;font-size:32px;padding:18px 36px;animation:chama 1.3s ease-in-out infinite}
@keyframes chama{50%{transform:scale(1.06)}}
.ouvir{border:0;background:#fff;border-radius:999px;width:58px;height:58px;font-size:28px;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);flex:none}
.situacao{display:flex;align-items:center;gap:26px;padding:26px 32px}
.situacao .e{font-size:92px;line-height:1;flex:none}
.situacao p{margin:0;font:800 36px/1.25 var(--ff)}
.opcoes{display:flex;flex-direction:column;gap:18px}
.opcoes .btn{display:flex;align-items:center;gap:18px;text-align:left;font-size:30px;padding:16px 26px}
.opcoes .btn .e{font-size:44px;line-height:1}
.opcoes.lado{flex-direction:row}
.opcoes.lado .btn{flex:1;flex-direction:column;text-align:center;padding:22px 18px;gap:10px}
.opcoes.lado .btn .e{font-size:70px}
/* toca ou partilha */
.zona{width:330px;height:370px;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:18px;font:700 32px var(--ft);border:0}
.zona.toca{background:linear-gradient(170deg,#8b5a2b,#5e3a1a);color:#fff;box-shadow:0 10px 0 #3f2610,0 18px 30px -14px rgba(0,0,0,.5)}
.zona.partilha{background:linear-gradient(170deg,#e8f7ec,#c9ecd4);color:#1d6b3c;box-shadow:0 10px 0 #8fcfa5,0 18px 30px -14px rgba(0,0,0,.4)}
.zona .cont{position:absolute;top:14px;right:16px;background:#fff;color:var(--ink);border-radius:999px;min-width:46px;height:46px;font:800 26px var(--ff);display:flex;align-items:center;justify-content:center;padding:0 10px}
.zona:hover{transform:translateY(-3px)}
.carta{width:380px;height:330px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;transition:transform .55s cubic-bezier(.5,-0.3,.6,1),opacity .5s}
.carta .e{font-size:120px;line-height:1}
.carta p{margin:0;font:800 34px/1.2 var(--ff);padding:0 20px}
.carta.vai-esq{transform:translateX(-430px) scale(.3) rotate(-20deg);opacity:0}
.carta.vai-dir{transform:translateX(430px) scale(.3) rotate(20deg);opacity:0}
.chega{animation:chega .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes chega{from{transform:scale(.4) translateY(80px);opacity:0}}
/* conversa */
.conversa{left:360px;top:44px;width:880px;padding:26px 40px;text-align:center}
.conversa .eti{display:inline-block;background:var(--t-2);color:#fff;font:600 24px var(--ft);border-radius:999px;padding:6px 18px}
.conversa h2{font:700 48px/1.12 var(--ft);color:var(--t-1d);margin:12px 0 18px}
.icones{display:flex;justify-content:center;gap:22px;flex-wrap:wrap}
.icones div{width:130px;padding:12px 6px;border-radius:24px;background:var(--t-1l);font:800 20px var(--ff);color:var(--t-1d)}
.icones div span{display:block;font-size:56px;line-height:1.15}
.relogio{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:16px;font:800 26px var(--ff);color:#5a6175}
.relogio svg{width:66px;height:66px;transform:rotate(-90deg)}
.relogio circle.pr{transition:stroke-dashoffset 1s linear}
.dica-prof{margin-top:12px;font:700 20px var(--ff);color:#7a8194}
/* confetes */
.confete{position:absolute;width:14px;height:20px;border-radius:3px;z-index:30;pointer-events:none;animation:confete 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confete{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* ---------- camadas por cima do palco ---------- */
.camada{position:absolute;inset:0;z-index:40;display:none;background:rgba(255,250,244,.96)}
.camada.aberta{display:block;animation:entra .35s ease}
#inicio{background:linear-gradient(160deg,var(--t-fundo),var(--t-1l))}
.fechar{position:absolute;right:24px;top:20px;width:60px;height:60px;border-radius:50%;border:0;background:#fff;font-size:30px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.lista-caps{left:80px;right:80px;top:120px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.lista-caps button{display:flex;gap:18px;align-items:center;text-align:left;border:0;background:#fff;border-radius:24px;padding:16px 20px;box-shadow:0 10px 22px -14px rgba(0,0,0,.4);font:inherit;color:inherit;transition:transform .15s}
.lista-caps button:hover{transform:translateY(-3px)}
.lista-caps button.atual{box-shadow:0 0 0 4px var(--t-1),0 10px 22px -14px rgba(0,0,0,.4)}
.lista-caps .e{font-size:52px;flex:none}
.lista-caps b{display:block;font:700 30px var(--ft);color:var(--t-1d)}
.lista-caps small{display:block;font:700 19px/1.3 var(--ff);color:#6b7286}
.lista-caps .min{margin-left:auto;flex:none;background:var(--t-1l);color:var(--t-1d);font:800 22px var(--ff);border-radius:999px;padding:6px 14px}
.defs{left:110px;right:110px;top:100px;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}
.def{display:flex;flex-direction:column;gap:8px}
.def>span{font:800 22px var(--ff);color:#5a6175}
.seg{display:flex;background:#fff;border-radius:16px;padding:5px;gap:5px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:10px 8px;font:800 21px var(--ff);color:#5a6175}
.seg button.sel{background:var(--t-1);color:#fff}
.def select{font:800 22px var(--ff);padding:12px;border-radius:16px;border:0;box-shadow:0 6px 14px -10px rgba(0,0,0,.4);color:var(--ink);background:#fff}

/* ---------- barra de controlos (estilo leitor de vídeo) ---------- */
#controlos{display:flex;align-items:center;gap:6px;padding:8px 12px;background:#1c2030;color:#fff;flex-wrap:nowrap}
.cb{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:transparent;color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;transition:background .15s}
.cb:hover{background:rgba(255,255,255,.12)}
.cb.desl{opacity:.45}
.cb svg{width:24px;height:24px;fill:currentColor}
#bplay{width:52px;height:52px;border-radius:50%;background:var(--t-1)}
#bplay:hover{background:var(--t-1d)}
#linha{flex:1;min-width:120px;height:44px;display:flex;align-items:center;gap:3px;position:relative;margin:0 8px}
#linha .ct{position:relative;height:10px;border-radius:6px;background:rgba(255,255,255,.18);cursor:pointer;transition:height .15s}
#linha .ct:hover{height:16px}
#linha .ct .f{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--t-1);width:0}
#linha .ct .ic{position:absolute;left:50%;top:-30px;transform:translateX(-50%);font-size:18px;opacity:.85;pointer-events:none}
#linha .ct.atual .ic{opacity:1;transform:translateX(-50%) scale(1.25)}
#tempo{font:800 15px var(--ff);color:#c9cede;min-width:96px;text-align:center;font-variant-numeric:tabular-nums}
#tempo.passou{color:#ffb38a}
footer{font:700 12px var(--ff);color:#7a8194;padding:4px 0 2px;display:flex;gap:14px;justify-content:center;text-align:center}

/* ---------- certificado ---------- */
#cert{position:fixed;inset:0;z-index:100;background:rgba(20,24,36,.7);display:none;align-items:center;justify-content:center;padding:20px}
#cert.aberta{display:flex}
#cert .folha{background:#fff;width:min(1000px,96vw);aspect-ratio:297/210;border-radius:14px;position:relative;padding:4% 6%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1.2vh;border:14px double var(--t-1);color:#2D3142}
#cert h1{font:700 clamp(28px,4.4vw,54px)/1.05 var(--ft);color:var(--t-1d);margin:0}
#cert .sub{font:800 clamp(14px,1.6vw,20px) var(--ff);color:var(--t-2);letter-spacing:2px;text-transform:uppercase}
#cert .nome{margin:2vh auto 0;width:70%;border-bottom:3px dotted #9aa0ad;height:6vh}
#cert p{font:700 clamp(14px,1.7vw,21px)/1.45 var(--ff);margin:0}
#cert img{position:absolute;right:4%;bottom:6%;width:17%}
#cert .medalha{position:absolute;left:5%;bottom:7%;width:13%}
#cert .ass{display:flex;justify-content:space-between;margin-top:3vh;font:700 clamp(12px,1.4vw,17px) var(--ff);padding:0 18%}
#cert .ass div{border-top:2px solid #9aa0ad;padding-top:6px;min-width:28%}
#cert .acoes{position:absolute;top:-64px;right:0;display:flex;gap:10px}
@media print{
  body{background:#fff;overflow:visible}
  #app{display:none}
  #cert{position:static;display:flex!important;background:none;padding:0}
  #cert .folha{width:100%;border-radius:0;box-shadow:none}
  #cert .acoes{display:none}
}
@media (max-width:760px){#tempo{display:none}.cb{width:38px}}

/* ---------- 3.º ano: peças novas ---------- */
.tesouro.peq{width:170px}
.tesouro.peq svg{width:100px;height:120px}
.tesouro.peq .ico{top:62px;width:58px;height:58px;font-size:36px}
.tesouro.peq .nome{font-size:20px;padding:5px 12px}
.marca{transition:background .4s,box-shadow .4s;border-radius:6px}
.marca.on{background:#ffe27a;box-shadow:0 0 0 4px #ffe27a}
.sortear{border:0;border-radius:999px;background:#fff;color:var(--t-1d);font:800 22px var(--ff);padding:10px 18px;box-shadow:0 6px 14px -8px rgba(0,0,0,.4);flex:none}
.sortear:hover{transform:translateY(-2px)}
.sorteado{position:absolute;right:30px;top:76px;z-index:35;display:flex;align-items:center;gap:18px;background:var(--t-1);color:#fff;border-radius:30px;padding:18px 40px;box-shadow:0 20px 50px -16px rgba(0,0,0,.5);animation:sorteio .6s cubic-bezier(.3,1.6,.5,1)}
.sorteado span{font-size:80px;line-height:1}
.sorteado small{display:block;font:800 24px var(--ff);opacity:.9}
.sorteado b{font:700 76px/1 var(--ft)}
.sorteado.sai{opacity:0;transition:opacity .5s}
@keyframes sorteio{from{transform:scale(.3);opacity:0}}
.opcoes.mono .btn span:last-child{font-family:Consolas,'Courier New',monospace;font-size:34px}
.carta-s{width:520px;height:210px;display:flex;align-items:center;gap:22px;padding:20px 28px;transition:transform .5s cubic-bezier(.5,-.2,.6,1),opacity .5s}
.carta-s .e{font-size:96px;line-height:1;flex:none}
.carta-s p{margin:0;font:800 34px/1.2 var(--ff);flex:1}
.carta-s.voa{transform:translate(var(--tx),var(--ty)) scale(.25);opacity:0}
.cesto{height:240px;border:0;border-radius:28px;background:var(--f);box-shadow:0 0 0 5px var(--c),0 10px 0 var(--d),0 18px 30px -14px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:stretch;padding:14px 16px;transition:transform .12s;color:var(--d)}
.cesto:hover{transform:translateY(-3px)}
.cesto .cab{display:flex;align-items:center;gap:10px;font:700 30px/1.1 var(--ft);text-align:left}
.cesto .cab .e{font-size:44px}
.cesto .cont{margin-left:auto;background:#fff;color:var(--ink);border-radius:999px;min-width:46px;height:46px;font:800 24px var(--ff);display:flex;align-items:center;justify-content:center}
.cesto .dentro{flex:1;display:flex;flex-wrap:wrap;align-content:flex-start;gap:6px;margin-top:12px;background:rgba(255,255,255,.6);border-radius:18px;padding:8px}
.cesto .dentro span{font-size:40px;line-height:1.1;animation:chega .5s cubic-bezier(.2,1.5,.4,1)}
.partes{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:10px}
.parte{border:3px dashed transparent;background:#f7f8fb;border-radius:14px;text-align:left;font:800 23px/1.25 var(--ff);color:var(--ink);padding:7px 14px;position:relative;transition:background .2s,border-color .2s}
.parte:hover{border-color:#b5d3ee;background:#eef5fc}
.partes.chat .parte{background:#eef1f6;border-top-left-radius:4px;max-width:92%}
.parte.pista{background:#fde8e8;border:3px solid var(--vermelho);color:#7a1f1f}
.parte.pista::after{content:attr(data-et);position:absolute;right:10px;top:-14px;background:var(--vermelho);color:#fff;font:800 16px var(--ff);padding:2px 10px;border-radius:999px;white-space:nowrap}
.parte.nao{opacity:.55}
.det-msg .carimbo{z-index:3}
.slots{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.slot{height:54px;border:3px dashed #cfd5e2;border-radius:16px;display:flex;align-items:center;justify-content:center;font:800 26px var(--ff);color:#b0b6c4}
.slot.cheio{border:3px solid var(--vermelho);background:#fdeaea;color:#9a2929;justify-content:flex-start;padding:0 14px;font-size:21px}
.visor{flex:1;font:800 44px Consolas,'Courier New',monospace;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cursor-pisca{animation:pisca2 1s steps(1) infinite;color:var(--t-1)}
@keyframes pisca2{50%{opacity:0}}
.pecas{display:flex;flex-direction:column;gap:10px}
.grupo b{display:block;font:800 21px var(--ff);color:#5a6175;margin-bottom:6px}
.grupo>div{display:flex;flex-wrap:wrap;gap:8px}
.peca{border:0;border-radius:14px;background:#fff;font:800 24px Consolas,'Courier New',monospace;padding:7px 13px;box-shadow:0 5px 0 rgba(45,49,66,.15),0 10px 18px -12px rgba(0,0,0,.4);color:var(--ink)}
.peca:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(45,49,66,.15)}
.peca.mau{background:#fdeaea;color:#9a2929;font-family:var(--ff);font-size:21px}
.grupo.cuidado b{color:#9a2929}
.medidor{height:26px;border-radius:14px;background:#eef1f6;overflow:hidden}
.barra-f{height:100%;width:0;border-radius:14px;transition:width .4s,background .4s}
.nivel{font:700 32px var(--ft);margin:10px 0 6px}
.regras{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.regras li{font:800 21px var(--ff);color:#8a91a3;display:flex;gap:10px;align-items:center}
.regras li::before{content:'○';width:30px;height:30px;border-radius:50%;background:#eef1f6;display:flex;align-items:center;justify-content:center;font-size:18px;color:#8a91a3;flex:none}
.regras li.ok{color:#1d6b3c}
.regras li.ok::before{content:'✓';background:var(--verde);color:#fff}
.feitas{margin-top:12px;font:800 22px var(--ff);color:var(--t-1d)}
.nova{width:100%;margin-top:12px;font:800 28px/1.3 var(--ff);border:3px solid #cfd5e2;border-radius:18px;padding:12px 16px;resize:none;color:var(--ink)}
.nova:focus{outline:none;border-color:var(--t-1)}
.ideias{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.ideias[hidden]{display:none}
.ideia{border:0;text-align:left;background:var(--t-1l);color:var(--t-1d);border-radius:14px;padding:8px 12px;font:800 17px/1.2 var(--ff)}
.lista-regras{margin:14px 0 0;padding-left:30px;font:800 22px/1.3 var(--ff);display:flex;flex-direction:column;gap:8px;max-height:270px;overflow:auto}
.lista-regras li.vazia{list-style:none;margin-left:-30px;color:#9aa0ad;font-weight:700}
.tira{border:0;background:#f3f3f3;border-radius:50%;width:30px;height:30px;font-size:14px;color:#8a91a3;vertical-align:middle}
#cert .cartaz-folha{aspect-ratio:210/297;width:auto;height:min(92vh,1100px);justify-content:flex-start;padding:6% 7%;text-align:left}
#cert .cartaz-folha .sub{text-align:center}
#cert .cartaz-folha h1{text-align:center;font-size:clamp(26px,3.6vh,46px);margin-bottom:2vh}
#cert .cartaz-folha ol{font:800 clamp(15px,2.3vh,28px)/1.4 var(--ff);padding-left:1.4em;display:flex;flex-direction:column;gap:1.2vh;margin:0}
#cert .cartaz-folha .regra-ouro{margin-top:auto;text-align:center;font:800 clamp(16px,2.6vh,30px) var(--ff);padding-bottom:12%}
#cert .cartaz-folha img{width:24%;right:5%;bottom:4%}
#cert .rodape-folha{position:absolute;left:7%;bottom:4%;font:700 clamp(10px,1.4vh,15px) var(--ff);color:#7a8194}
@media print{#cert .cartaz-folha{height:auto;width:100%;min-height:270mm;border-radius:0}}
.int-topo .titulo-cena{white-space:nowrap;font-size:36px}
.int-topo .prog span{font-size:24px}
.carimbo{pointer-events:none}

function pascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100, d = Math.floor(b / 4), e = b % 4,
    f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
    i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451),
    mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(ano, mes - 1, dia);
}
const FESTA_DA_FLOR = { 2027: [429, 530] };
const FESTA_DA_FLOR_APROX = [425, 525];
function temaDoDia(data = new Date()) {
  const ano = data.getFullYear(), hoje = new Date(ano, data.getMonth(), data.getDate());
  const md = (data.getMonth() + 1) * 100 + data.getDate();
  const mais = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const entre = (a, b) => hoje >= a && hoje <= b;
  const P = pascoa(ano);
  const primeiroFev = new Date(ano, 1, 1);
  const internetSegura = new Date(ano, 1, 1 + ((2 - primeiroFev.getDay() + 7) % 7) + 7);
  if (entre(mais(internetSegura, -1), mais(internetSegura, 3))) return 'internet';
  if (entre(mais(P, -52), mais(P, -46))) return 'carnaval';
  if (entre(mais(P, -7), mais(P, 1))) return 'pascoa';
  if (md >= 1031 && md <= 1102) return 'paopordeus';
  if (md >= 1103 && md <= 1113) return 'saomartinho';
  if (md >= 1201 || md <= 106) return 'natal';
  const [ffIni, ffFim] = FESTA_DA_FLOR[ano] || FESTA_DA_FLOR_APROX;
  if (md >= ffIni && md <= ffFim) return 'festadaflor';
  if (md >= 529 && md <= 602) return 'crianca';
  if (md >= 901 && md <= 930) return 'regresso';
  if (md >= 1001 && md <= 1130) return 'outono';
  if (md >= 107 && md <= 319) return 'inverno';
  if (md >= 320 && md <= 621) return 'primavera';
  if (md >= 622 && md <= 831) return 'verao';
  return 'neutro';
}

let voz = null;
function escolherVoz() {
  if (!('speechSynthesis' in window)) return;

  .replace(/\p{Extended_Pictographic}️?(?:‍\p{Extended_Pictographic}️?)*/gu, ' ').replace(/\s+/g, ' ').trim();

  const tok = S.token; let feito = false;
  const acabar = () => { if (feito) return; feito = true; masc.classList.remove('fala'); if (tok === S.token && fim) fim(); };
  const n = palavras(texto);
  if (prefs.narr && voz) {

    u.lang = voz.lang; u.voice = voz; u.rate = prefs.lento ? 0.8 : 0.95; u.pitch = 1.08;

function estimativa(seg) {
  if (seg.tipo === 'cena') return seg.falas.reduce((s, f) => s + palavras(f.t) / 2.3 + .9, 1.5);
  if (seg.tipo === 'conversa') return seg.seg + 20;
  if (seg.tipo === 'rapida') return 50;
  if (seg.tipo === 'quiz') return seg.n * 45;
  if (seg.tipo === 'separar') return Object.values(seg.quantos).reduce((a, b) => a + b, 0) * 35;
  if (seg.tipo === 'detetive') return 300;
  if (seg.tipo === 'construtor') return 270;
  if (seg.tipo === 'cartaz') return 300;
  return 30;
}
const EST = SEGMENTOS.map(estimativa), TOTAL = EST.reduce((a, b) => a + b, 0);
const capDe = i => CAPITULOS.findIndex(c => c.id === SEGMENTOS[i].cap);
const capNum = id => CAPITULOS.findIndex(c => c.id === id);

function construirLinha() {
  const l = $('#linha'); l.innerHTML = '';
  CAPITULOS.forEach((c, ci) => {
    const idx = SEGMENTOS.map((s, i) => s.cap === c.id ? i : -1).filter(i => i >= 0);
    const peso = idx.reduce((s, i) => s + EST[i], 0);
    const d = document.createElement('div'); d.className = 'ct'; d.style.flex = peso; d.title = `${ci + 1}. ${c.titulo} (~${c.min} min)`;
    d.innerHTML = `<span class="ic">${c.e}</span><div class="f"></div>`;
    d.onclick = ev => {
      const r = d.getBoundingClientRect(), frac = (ev.clientX - r.left) / r.width;

  });
}
function progresso() {
  const seg = SEGMENTOS[S.i];

  else if (S.int && S.int.total) frac = S.int.feitos / S.int.total;

      <div style="display:flex;align-items:center;gap:10px"><img src="${IMG.ideia}" alt="" style="height:64px"><div style="font:700 26px/1.1 var(--ft);color:var(--t-1d)">As regras da Internet Segura da nossa turma</div></div>
      <ol class="lista-regras"></ol>
      <div style="position:absolute;left:20px;right:20px;bottom:16px;display:flex;gap:10px">
        <button class="btn sec" data-a="imprimir" style="flex:1;font-size:22px;padding:12px">🖨️ Imprimir</button>
        <button class="btn" data-a="apagar" style="font-size:22px;padding:12px" title="Apagar o cartaz">🗑️</button>
      </div>
    </div>`;
  ligarTopo();
  const ta = cena.querySelector('.nova'), lista = cena.querySelector('.lista-regras');
  const desenhar = () => {
    lista.innerHTML = regras.length ? regras.map((r, i) => `<li>${esc(r)} <button class="tira" data-i="${i}" title="Retirar">✕</button></li>`).join('') : '<li class="vazia">As regras da turma vão aparecer aqui.</li>';
    lista.querySelectorAll('.tira').forEach(b => b.onclick = () => { regras.splice(+b.dataset.i, 1); guardarRegras(regras); desenhar(); });
    if (regras.length && !S.int.feito) { botaoContinuar(); }
  };
  const juntar = t => {
    t = t.replace(/\s+/g, ' ').trim(); if (!t) return;
    t = t[0].toUpperCase() + t.slice(1); if (!/[.!?]$/.test(t)) t += '.';
    if (regras.some(r => r.toLowerCase() === t.toLowerCase())) { dizerInt('Essa regra já está no cartaz!'); return; }
    if (regras.length >= 8) { dizerInt('O cartaz já tem 8 regras. Está completo!'); return; }
    regras.push(t); guardarRegras(regras); desenhar(); bip('certo'); pose('trofeu');
    confetes(1020, 300, 30); dizerInt('Boa regra! ' + t);
  };
  S.int = { feito: false, ler: () => dizerInt(seg.intro) };
  cena.querySelector('[data-a="add"]').onclick = () => { juntar(ta.value); ta.value = ''; };
  ta.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); juntar(ta.value); ta.value = ''; } });
  cena.querySelector('[data-a="ideias"]').onclick = () => { const d = cena.querySelector('.ideias'); d.hidden = !d.hidden; };
  cena.querySelectorAll('.ideia').forEach(b => b.onclick = () => juntar(b.textContent));
  cena.querySelector('[data-a="imprimir"]').onclick = abrirCartaz;
  cena.querySelector('[data-a="apagar"]').onclick = () => { if (regras.length && confirm('Apagar todas as regras do cartaz?')) { regras = []; guardarRegras(regras); desenhar(); } };
  desenhar();
  if (S.tocando) S.int.ler(); else $('#legenda').textContent = 'Vem ao quadro escrever uma regra para o cartaz.';
}
function abrirCartaz() {
  const regras = regrasCartaz(), d = new Date();
  const c = $('#cert');
  document.getElementById('pagina').textContent = '@page{size:A4 portrait;margin:10mm}';
  c.innerHTML = `<div class="folha cartaz-folha">
      <div class="acoes"><button class="btn prim" onclick="window.print()">🖨️ Imprimir</button><button class="btn" onclick="fecharFolha()">✕ Fechar</button></div>
      <div class="sub">3.º ano · Detetives da Internet Segura</div>
      <h1>As nossas regras da Internet Segura</h1>
      <ol>${(regras.length ? regras : ['(Ainda sem regras: escrevam-nas na atividade do cartaz.)']).map(r => `<li>${esc(r)}</li>`).join('')}</ol>
      <div class="regra-ouro"><b style="color:#d93a3a">✋ Para</b> · <b style="color:#c48a00">🤔 Pensa</b> · <b style="color:#22a35a">🙋 Pede ajuda</b></div>
      <img src="${IMG.aponta}" alt="Ticl@s">
      <div class="rodape-folha">${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()} · Coordenadora TIC C. Sofia O.</div>
    </div>`;
  c.classList.add('aberta');
}
function fecharFolha() { $('#cert').classList.remove('aberta'); }

/* =====================================================================
   8. CAMADAS: início, capítulos, definições, certificado
   ===================================================================== */
function verInicio() {
  const c = $('#inicio');
  c.innerHTML = `
    <img src="${IMG.ola}" alt="" style="position:absolute;right:70px;bottom:70px;height:440px;filter:drop-shadow(0 14px 16px rgba(60,30,10,.25))">
    <div style="position:absolute;left:90px;top:70px;width:720px">
      <span class="pill">3.º ano · TIC · Cidadania Digital · ~60 min</span>
      <div class="titulo-grande" style="margin-top:20px;font-size:76px">Detetives da<br>Internet Segura</div>
      <div class="subtitulo" style="margin-top:8px">com o Ticl@s 🌰</div>
      <div class="lema" style="margin-top:14px;font-size:26px">Dados pessoais, palavras-passe fortes, armadilhas da Internet e sites amigáveis.</div>
      <div style="display:flex;flex-direction:column;gap:16px;margin-top:30px;width:560px">
        <button class="btn prim" id="modo-quadro" style="text-align:left;display:flex;gap:16px;align-items:center"><span style="font-size:44px">🖥️</span><span>Quadro interativo<br><small style="font-weight:700;opacity:.9;font-size:20px">com narração do Ticl@s</small></span></button>
        <button class="btn" id="modo-pc" style="text-align:left;display:flex;gap:16px;align-items:center"><span style="font-size:44px">💻</span><span>Computador<br><small style="font-weight:700;color:#6b7286;font-size:20px">sem som, com legendas</small></span></button>
      </div>
      <div id="aviso-voz" style="margin-top:14px;font:700 18px var(--ff);color:#8a5a00"></div>
    </div>`;
  $('#modo-quadro').onclick = () => comecar('quadro');
  $('#modo-pc').onclick = () => comecar('pc');
  const av = () => { if ($('#aviso-voz')) $('#aviso-voz').textContent = ('speechSynthesis' in window) && !voz && speechSynthesis.getVoices().length ? '⚠️ Este computador não tem voz em português de Portugal: as legendas guiam a aula.' : ''; };
  av(); setTimeout(av, 1500);
}
function comecar(modo) {
  prefs.modo = modo;
  if (modo === 'quadro') { prefs.narr = true; prefs.som = true; } else { prefs.narr = false; prefs.som = false; prefs.leg = true; }
  guardar(); aplicarAparencia();
  $('#inicio').classList.remove('aberta');
  S.comecou = true; if (!S.inicio) S.inicio = Date.now();
  irPara(0, true);
}
function recomecar() { S.inicio = Date.now(); irPara(0, true); }

function abrirMenu() {
  if (!S.comecou) return;
  const estava = S.tocando; if (estava) alternar();
  const c = $('#menu');
  c.innerHTML = `<button class="fechar" aria-label="Fechar">✕</button>
    <div class="abs titulo-cena" style="left:80px;top:40px">Capítulos e guião da aula</div>
    <div class="abs lista-caps">${CAPITULOS.map((cp, i) => `<button data-c="${cp.id}" class="${capDe(S.i) === i ? 'atual' : ''}"><span class="e">${cp.e}</span><span><b>${i + 1}. ${cp.titulo}</b><small>${esc(cp.dica)}</small></span><span class="min">${cp.min} min</span></button>`).join('')}</div>`;
  c.classList.add('aberta');
  c.querySelector('.fechar').onclick = () => c.classList.remove('aberta');
  c.querySelectorAll('.lista-caps button').forEach(b => b.onclick = () => { c.classList.remove('aberta'); irPara(SEGMENTOS.findIndex(s => s.cap === b.dataset.c), true); });
}
function abrirDefs() {
  const estava = S.tocando; if (estava) alternar();
  const c = $('#defs');
  const seg = (k, ops) => `<div class="seg" data-k="${k}">${ops.map(([v, t]) => `<button data-v="${v}" class="${String(prefs[k]) === String(v) ? 'sel' : ''}">${t}</button>`).join('')}</div>`;
  c.innerHTML = `<button class="fechar" aria-label="Fechar">✕</button>
    <div class="abs titulo-cena" style="left:110px;top:36px">Definições da professora</div>
    <div class="abs defs">
      <label class="def"><span>🎨 Tema (muda sozinho com a data)</span><select id="sel-tema"><option value="auto">Automático: ${TEMAS[temaDoDia()].nome}</option>${Object.entries(TEMAS).map(([k, t]) => `<option value="${k}" ${prefs.tema === k ? 'selected' : ''}>${t.nome}</option>`).join('')}</select></label>
      <div class="def"><span>👥 Perfil</span>${seg('perfil', [['turma', 'Turma'], ['apoio', 'Apoio (menos opções)']])}</div>
      <label class="def"><span>🎲 N.º de alunos (para chamar ao quadro)</span><select id="sel-alunos">${Array.from({ length: 23 }, (_, i) => i + 8).map(n => `<option ${+prefs.alunos === n ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
      <div class="def"><span>🗣️ Narração do Ticl@s</span>${seg('narr', [[true, 'Ligada'], [false, 'Desligada']])}</div>
      <div class="def"><span>🐢 Velocidade da voz</span>${seg('lento', [[false, 'Normal'], [true, 'Mais lenta']])}</div>
      <div class="def"><span>🔔 Sons de acerto</span>${seg('som', [[true, 'Ligados'], [false, 'Desligados']])}</div>
      <div class="def"><span>💬 Legendas</span>${seg('leg', [[true, 'Ligadas'], [false, 'Desligadas']])}</div>
      <div class="def"><span>🔠 Tamanho das legendas</span>${seg('legGrande', [[false, 'Normal'], [true, 'Grande']])}</div>
      <div class="def"><span>👓 Leitura</span>${seg('contraste', [[false, 'Cores normais'], [true, 'Alto contraste']])}${seg('legivel', [[false, 'Letra do jogo'], [true, 'Letra simples']])}</div>
    </div>
    <div class="abs" style="left:110px;bottom:30px;font:700 18px var(--ff);color:#7a8194">Teclas: espaço = reproduzir/pausa · ← → = parte anterior/seguinte · F = ecrã inteiro · C = legendas</div>`;
  c.classList.add('aberta');
  c.querySelector('.fechar').onclick = () => c.classList.remove('aberta');
  c.querySelector('#sel-tema').onchange = e => { prefs.tema = e.target.value; guardar(); aplicarAparencia(); };
  c.querySelector('#sel-alunos').onchange = e => { prefs.alunos = +e.target.value; saco = []; guardar(); };
  c.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = g.dataset.k, v = b.dataset.v; prefs[k] = v === 'true' ? true : v === 'false' ? false : v;
    g.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b));
    guardar(); aplicarAparencia(); if (k === 'narr' && !prefs.narr) calar();
  }));
}
function abrirCertificado() {
  const d = new Date(), meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const c = $('#cert');
  document.getElementById('pagina').textContent = '@page{size:A4 landscape;margin:8mm}';
  c.innerHTML = `<div class="folha">
      <div class="acoes"><button class="btn prim" onclick="window.print()">🖨️ Imprimir</button><button class="btn" onclick="fecharFolha()">✕ Fechar</button></div>
      <div class="sub">Certificado</div>
      <h1>Detetive da Internet Segura</h1>
      <p style="margin-top:1vh">Este certificado é atribuído a</p>
      <div class="nome"></div>
      <p style="margin-top:1.5vh">por saber proteger os seus <b>dados pessoais</b>, criar palavras-passe fortes, descobrir armadilhas e seguir a regra de ouro:<br><b style="color:#d93a3a">Para</b> · <b style="color:#c48a00">Pensa</b> · <b style="color:#22a35a">Pede ajuda</b></p>
      <div class="ass"><div>${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}</div><div>A Coordenadora TIC<br>C. Sofia O.</div></div>
      <svg class="medalha" viewBox="0 0 240 330"><path d="M70 0H120L100 120H50Z" style="fill:var(--t-1)"/><path d="M170 0H120L140 120H190Z" style="fill:var(--t-2)"/><circle cx="120" cy="200" r="104" fill="url(#gOuro)" stroke="#b8860b" stroke-width="6"/><g transform="translate(78 146)"><use href="#escudo" width="84" height="100"/></g></svg>
      <img src="${IMG.trofeu}" alt="Ticl@s">
    </div>`;
  c.classList.add('aberta');
}

/* =====================================================================
   9. ARRANQUE
   ===================================================================== */
$('#bplay').onclick = () => { if (!S.comecou) comecar(prefs.modo || 'quadro'); else alternar(); };
$('#bseg').onclick = () => S.comecou && seguinte();
$('#bant').onclick = () => S.comecou && anterior();
$('#bcc').onclick = () => { prefs.leg = !prefs.leg; guardar(); aplicarAparencia(); };
$('#bsom').onclick = () => { const on = !(prefs.narr || prefs.som); prefs.narr = on; prefs.som = on; guardar(); aplicarAparencia(); if (!on) calar(); };
$('#bmenu').onclick = abrirMenu;
$('#bdefs').onclick = abrirDefs;
$('#bfs').onclick = () => { try { if (document.fullscreenElement) document.exitFullscreen(); else $('#player').requestFullscreen(); } catch (e) { } };
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('select,input,textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); $('#bplay').click(); }
  else if (e.key === 'ArrowRight') $('#bseg').click();
  else if (e.key === 'ArrowLeft') $('#bant').click();
  else if (e.key === 'f' || e.key === 'F') $('#bfs').click();
  else if (e.key === 'c' || e.key === 'C') $('#bcc').click();
  else if (e.key === 'Escape') document.querySelectorAll('.camada.aberta:not(#inicio), #cert.aberta').forEach(x => x.classList.remove('aberta'));
});
setInterval(() => {
  if (!S.inicio) return;
  const s = Math.floor((Date.now() - S.inicio) / 1000), t = $('#tempo');
  t.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} / 60 min`;
  t.classList.toggle('passou', s >= 3600);
}, 1000);

mascImg.src = IMG.ola; mascImg.dataset.p = 'ola';
aplicarAparencia(); construirLinha(); verInicio(); ajustar(); progresso();
window.addEventListener('load', ajustar);
</script>
</body>
</html>
