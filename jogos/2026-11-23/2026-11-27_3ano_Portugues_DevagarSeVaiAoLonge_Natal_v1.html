<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devagar se vai ao longe no Natal — s, ss, c, ç com o Ticl@s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2F6E96; --verde-esc:#285775; --verde-claro:#E6F1F8;
  --laranja:#E8834A; --creme:#FFF8F0; --azul:#5BA3D0; --amarelo:#FFC857; --verdew:#6BBF59;
  --texto:#2D3436; --suave:#6B7478; --branco:#FFFFFF; --linha:#E6DED2;
  --bg1:#F2F8FF; --bg2:#E0ECF9; --acc2:#D94848;
  --cor-s:#3F86C2; --cor-ss:#8E6BC8; --cor-c:#E8834A; --cor-cc:#3E9B3A;
  --escala:1;
  --fonte-titulo:'Fredoka','Trebuchet MS',sans-serif;
  --fonte-texto:'Nunito','Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--escala))}
body{margin:0;font-family:var(--fonte-texto);color:var(--texto);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;line-height:1.45}
body.legivel{--fonte-titulo:Verdana,Arial,sans-serif;--fonte-texto:Verdana,Arial,sans-serif;letter-spacing:.03em;word-spacing:.08em}
body.contraste{--texto:#000;--suave:#222;--bg1:#fff;--bg2:#fff;--linha:#000;--verde:#145214;--verde-esc:#0b3a0b;--cor-s:#0B4F8A;--cor-ss:#4B2A8A;--cor-c:#9A3A00;--cor-cc:#145214;--acc2:#000}
body.contraste .card,body.contraste .stage{border:3px solid #000!important;box-shadow:none!important}
#deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#deco span{position:absolute;font-size:2.2rem;opacity:.16;animation:flutua 9s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(6deg)}}
body.contraste #deco{display:none}
.app{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 16px 0}
/* Cabeçalho */
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--branco);border-radius:20px;padding:10px 14px;box-shadow:0 4px 0 rgba(0,0,0,.06)}
.topo .logo{width:46px;height:46px;border-radius:14px;background:var(--laranja);display:grid;place-items:center;color:#fff;font-family:var(--fonte-titulo);font-weight:700;font-size:1.05rem;flex:none}
.topo h1{font-family:var(--fonte-titulo);font-size:1.25rem;margin:0;color:var(--verde-esc);line-height:1.15}
.topo h1 small{display:block;font-family:var(--fonte-texto);font-size:.8rem;color:var(--suave);font-weight:700}
.ferr{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.ferr button{border:2px solid var(--linha);background:var(--creme);border-radius:12px;min-width:42px;height:42px;font-weight:800;font-size:.95rem;cursor:pointer;color:var(--texto);font-family:var(--fonte-texto)}
.ferr button:hover{border-color:var(--verde)}
.ferr button[aria-pressed="true"]{background:var(--verde);color:#fff;border-color:var(--verde)}
/* Progresso */
.prog{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:12px 0 10px}
.prog i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:.8rem;font-weight:800;background:#fff;border:2px solid var(--linha);color:var(--suave)}
.prog i.feito{background:var(--verde);border-color:var(--verde);color:#fff}
.prog i.atual{border-color:var(--acc2);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc2) 30%,transparent);color:var(--texto)}
.prog .fase{font-size:.75rem;align-self:center;color:var(--suave);font-weight:800;margin:0 4px}
/* Palco */
.stage{background:var(--branco);border-radius:26px;box-shadow:0 8px 0 rgba(0,0,0,.06),0 10px 30px rgba(0,0,0,.06);display:grid;grid-template-columns:190px 1fr;gap:18px;padding:20px;min-height:430px}
.mascote{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.mascote .fig{position:relative;width:170px}
.mascote img{width:100%;height:auto;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.12));animation:respira 3.5s ease-in-out infinite}
.mascote .aces{position:absolute;top:-10px;right:6px;font-size:2.4rem;animation:baloica 2.4s ease-in-out infinite;transform-origin:50% 90%}
.mascote .nome{font-family:var(--fonte-titulo);font-weight:600;color:var(--verde-esc);margin-top:6px}
.mascote .estrelas{margin-top:8px;font-size:1.05rem;font-weight:800;color:var(--texto);background:#FFF4D6;border-radius:999px;padding:4px 12px}
@keyframes respira{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes baloica{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
.mascote.salta img{animation:salta .6s ease}
@keyframes salta{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.04)}70%{transform:translateY(0)}}
.conteudo{min-width:0}
.fala{position:relative;background:var(--verde-claro);border-radius:18px;padding:12px 52px 12px 16px;font-size:1.08rem;font-weight:700;margin-bottom:14px}
.fala::before{content:"";position:absolute;left:-12px;top:22px;border:8px solid transparent;border-right:12px solid var(--verde-claro);border-left:0}
.fala h2{font-family:var(--fonte-titulo);margin:0 0 2px;font-size:1.35rem;color:var(--verde-esc)}
.fala .ouvir{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;border:0;background:#fff;cursor:pointer;font-size:1.1rem;box-shadow:0 2px 0 rgba(0,0,0,.1)}
/* Navegação */
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.nav button{font-family:var(--fonte-titulo);font-size:1.05rem;font-weight:600;border:0;border-radius:16px;padding:12px 18px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .1s}
.nav button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.15)}
.nav .b-ini{background:#fff;color:var(--texto)}
.nav .b-ant{background:var(--azul);color:#fff}
.nav .b-prox{background:var(--verde);color:#fff}
.nav button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.nav .cont{font-weight:800;color:var(--suave)}
/* Botões genéricos */
.btn{font-family:var(--fonte-titulo);font-weight:600;font-size:1.1rem;border:0;border-radius:16px;padding:12px 20px;cursor:pointer;background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-esc);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--verde-esc)}
.btn.sec{background:#fff;color:var(--texto);box-shadow:0 4px 0 var(--linha);border:2px solid var(--linha)}
.btn.laranja{background:var(--laranja);box-shadow:0 4px 0 #B85F2E}
.linha-btn{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
/* Feedback */
.fb{min-height:46px;margin-top:12px;border-radius:14px;padding:10px 14px;font-weight:800;font-size:1.05rem;display:none}
.fb.ok{display:block;background:#E3F5DF;color:#1E5E1B}
.fb.quase{display:block;background:#FFF1DE;color:#8A4A12}
.treme{animation:treme .45s}
@keyframes treme{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
/* Início */
.inicio h2{font-family:var(--fonte-titulo);font-size:2rem;margin:0;color:var(--verde-esc);line-height:1.1}
.inicio .sub{font-size:1.1rem;color:var(--suave);font-weight:700;margin:6px 0 16px}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.escolha{border:3px solid var(--linha);border-radius:18px;padding:14px;background:var(--creme);cursor:pointer;text-align:left;font-family:var(--fonte-texto);color:var(--texto)}
.escolha b{display:block;font-family:var(--fonte-titulo);font-size:1.15rem}
.escolha span{font-size:.92rem;color:var(--suave);font-weight:600}
.escolha .ic{font-size:1.8rem}
.escolha[aria-pressed="true"]{border-color:var(--verde);background:var(--verde-claro)}
.rotulo{font-weight:800;margin:16px 0 8px;font-size:1rem}
.num{font-size:1.4rem;width:110px;padding:8px 12px;border-radius:14px;border:3px solid var(--linha);font-family:var(--fonte-titulo);text-align:center}
.mapa{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.mapa span{background:#fff;border:2px dashed var(--linha);border-radius:12px;padding:6px 10px;font-size:.9rem;font-weight:700}
/* Chips e ordenação */
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:16px;background:var(--creme);border-radius:18px;min-height:86px}
.slot{min-width:96px;height:58px;border:3px dashed #CFC4B4;border-radius:14px;display:grid;place-items:center}
.slot.mal .chip{background:#F6C9A9}
.pool{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px;min-height:62px}
.chip{font-family:var(--fonte-titulo);font-size:1.35rem;font-weight:600;padding:10px 18px;border-radius:14px;background:#fff;border:0;box-shadow:0 4px 0 rgba(0,0,0,.14);cursor:pointer;color:var(--texto);transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{outline:4px solid var(--amarelo);transform:translateY(-3px)}
.pool .chip:nth-child(4n+1){background:#FCE3D3}.pool .chip:nth-child(4n+2){background:#DCEEF8}.pool .chip:nth-child(4n+3){background:#E2F3DD}.pool .chip:nth-child(4n+4){background:#FFF0C6}
/* Quiz */
.qtopo{display:flex;justify-content:space-between;font-weight:800;color:var(--suave);margin-bottom:6px}
.pergunta{font-family:var(--fonte-titulo);font-size:1.4rem;font-weight:600;margin:4px 0 14px}
.opcoes{display:grid;grid-template-columns:1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:var(--fonte-texto);font-size:1.12rem;font-weight:700;color:#fff;border:0;border-radius:16px;padding:12px 14px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .1s}
.opt .let{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.3);display:grid;place-items:center;font-family:var(--fonte-titulo)}
.opt:nth-child(1){background:#D9604C}.opt:nth-child(2){background:#3F86C2}.opt:nth-child(3){background:#E5A21C}.opt:nth-child(4){background:#4C9A42}
.opt:hover{transform:translateY(-2px)}
.opt.apagada{opacity:.35}
.opt.certa{outline:5px solid #1E5E1B;outline-offset:2px}
.barra{height:10px;background:var(--creme);border-radius:999px;overflow:hidden;margin-bottom:10px}
.barra i{display:block;height:100%;background:var(--verde);transition:width .4s}
/* Poema */
.poema{background:#FFFDF8;border:2px solid var(--linha);border-radius:18px;padding:16px 20px;columns:2 240px;column-gap:28px}
.poema h3{column-span:all;font-family:var(--fonte-titulo);margin:0 0 4px;color:var(--verde-esc);font-size:1.4rem}
.poema .autor{column-span:all;font-size:.85rem;color:var(--suave);font-weight:700;margin-bottom:10px}
.estrofe{break-inside:avoid;margin:0 0 14px;font-size:1.18rem;line-height:1.75}
.estrofe .n{font-size:.75rem;font-weight:800;color:var(--suave);display:block;line-height:1.2}
.pal{cursor:pointer;border-radius:6px;padding:0 2px}
.cacar .pal:hover{background:#FFF0C6}
.pal.achou{background:var(--amarelo);font-weight:800}
.pal.nao{background:#F6C9A9}
.verpoema{margin:0 0 12px}
.verpoema summary{cursor:pointer;font-weight:800;color:var(--verde-esc)}
.verpoema .poema{margin-top:8px}
.contagem{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.contagem b{background:var(--creme);border-radius:10px;padding:6px 10px}
/* Regras */
.regras{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.carta{perspective:800px;height:210px;cursor:pointer;border:0;background:none;padding:0;font-family:var(--fonte-texto)}
.carta .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.carta.virada .in{transform:rotateY(180deg)}
.carta .fr,.carta .vs{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.carta .fr b{font-family:var(--fonte-titulo);font-size:4rem;line-height:1}
.carta .fr small{font-weight:800;opacity:.9}
.carta .vs{transform:rotateY(180deg);background:#fff!important;color:var(--texto);border:4px solid;text-align:center;font-size:.98rem;font-weight:700}
.carta .vs em{font-style:normal;display:block;margin-top:6px;font-family:var(--fonte-titulo);font-size:1.05rem}
/* Classificar */
.caixas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.caixa{border-radius:18px;padding:8px;min-height:150px;border:3px solid;background:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:background .2s}
.caixa h4{margin:0;font-family:var(--fonte-titulo);font-size:2rem;color:#fff;width:100%;text-align:center;border-radius:12px}
.caixa .dentro{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.caixa .dentro span{font-size:.92rem;font-weight:800;background:var(--creme);border-radius:8px;padding:2px 8px}
.caixa.alvo{background:#FFFBE6}
/* Completar */
.palavra-grande{font-family:var(--fonte-titulo);font-size:3rem;text-align:center;letter-spacing:.04em;margin:14px 0}
.lacuna{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--acc2);color:var(--verde);text-align:center}
.letras{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.letras button{font-family:var(--fonte-titulo);font-size:2.2rem;font-weight:700;color:#fff;border:0;border-radius:18px;padding:12px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.dica{background:#F2F7FF;border-left:6px solid var(--azul);border-radius:12px;padding:8px 12px;font-weight:700;margin-top:10px}
/* Cópia */
.modelo{font-family:var(--fonte-titulo);font-size:2.1rem;background:var(--creme);border-radius:18px;padding:14px 16px;text-align:center;letter-spacing:.03em;word-break:break-word}
.modelo span{border-radius:5px;padding:0 1px;transition:background .15s}
.modelo .c-ok{color:#1E7A1B;background:#E3F5DF}
.modelo .c-mal{color:#A8320E;background:#FAD3BF;text-decoration:underline wavy}
.modelo .c-prox{outline:3px solid var(--amarelo);background:#FFF6D6}
.escrever{width:100%;font-family:var(--fonte-titulo);font-size:2rem;padding:12px 16px;border-radius:16px;border:4px solid var(--azul);margin-top:12px;outline:none;background:#fff;color:var(--texto)}
.escrever:focus{border-color:var(--verde);box-shadow:0 0 0 4px var(--verde-claro)}
.teclas{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:.92rem;font-weight:700;color:var(--suave)}
.teclas span{background:#fff;border:2px solid var(--linha);border-radius:10px;padding:4px 8px}
kbd{display:inline-block;min-width:1.7em;text-align:center;font-family:var(--fonte-titulo);background:#fff;border:2px solid #BDB3A3;border-bottom-width:4px;border-radius:7px;padding:0 5px;color:var(--texto)}
.dicatecla{min-height:40px;margin-top:10px;font-weight:800;color:#2F5F8A;background:#EEF6FC;border-radius:12px;padding:8px 12px;display:none}
.caderno{margin-top:14px;background:#fff;border:2px solid var(--linha);border-radius:14px;padding:6px 14px 6px 46px;position:relative;background-image:repeating-linear-gradient(transparent 0 35px,#D7E6F3 35px 36px);min-height:44px}
.caderno::before{content:"";position:absolute;left:34px;top:0;bottom:0;width:2px;background:#F2A6A6}
.caderno p{margin:0;height:36px;line-height:34px;font-family:var(--fonte-titulo);font-size:1.25rem;color:#24527A}
.caderno .vazio{color:var(--suave);font-family:var(--fonte-texto);font-size:.95rem}
/* Corrida */
.pista{position:relative;display:grid;grid-template-columns:repeat(11,1fr);gap:4px;background:#E9DCC4;border-radius:18px;padding:12px 10px;margin:10px 0 14px}
.pista i{height:44px;border-radius:10px;background:#F7EEDD;font-style:normal;display:grid;place-items:center;font-size:1.7rem}
.pista i.meta{background:#fff}
.pista i.pass{background:#DCEFD6}
/* Certificado */
#cert{border:10px double var(--laranja);border-radius:22px;padding:22px;text-align:center;background:#FFFDF6;position:relative}
#cert h2{font-family:var(--fonte-titulo);font-size:2.1rem;margin:0;color:var(--verde-esc)}
#cert .grande{font-size:2.6rem;letter-spacing:.1em}
#cert img{width:120px}
#cert .meta{display:flex;justify-content:space-around;flex-wrap:wrap;gap:8px;font-weight:800;margin-top:10px}
/* Rodapé */
.site-footer{margin:18px 0 0;padding:16px 10px 70px;text-align:center;color:var(--suave)}
.footer-brand{font-family:var(--fonte-titulo);font-weight:600;color:var(--verde-esc);font-size:1.05rem}
.footer-links{display:flex;gap:10px 18px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.footer-links a{display:inline-flex;align-items:center;gap:6px;color:var(--texto);font-weight:700;text-decoration:none;font-size:.92rem}
.footer-links a:hover{color:var(--verde)}
.footer-copy{font-size:.85rem;font-weight:700}
/* Professor */
.b-prof{position:fixed;right:12px;bottom:12px;z-index:5;width:44px;height:44px;border-radius:50%;border:2px solid var(--linha);background:#fff;font-size:1.2rem;cursor:pointer;opacity:.75}
.modal{position:fixed;inset:0;background:rgba(30,40,30,.45);z-index:20;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto}
.modal.aberto{display:flex}
.modal .caixa-m{background:#fff;border-radius:22px;max-width:720px;width:100%;padding:20px;position:relative}
.modal h3{font-family:var(--fonte-titulo);margin:0 0 10px;color:var(--verde-esc)}
.modal h4{margin:16px 0 6px}
.modal .fechar{position:absolute;right:14px;top:12px;border:0;background:var(--creme);border-radius:50%;width:38px;height:38px;font-size:1.1rem;cursor:pointer}
.modal select,.modal input{font-size:1rem;padding:8px 10px;border-radius:10px;border:2px solid var(--linha);font-family:var(--fonte-texto)}
.saltos{display:flex;flex-wrap:wrap;gap:6px}
.saltos button{border:2px solid var(--linha);background:var(--creme);border-radius:10px;padding:6px 10px;cursor:pointer;font-weight:700;font-family:var(--fonte-texto)}
.tabela{width:100%;border-collapse:collapse;font-size:.92rem}
.tabela th,.tabela td{border-bottom:1px solid var(--linha);padding:5px;text-align:left}
.nota{background:var(--creme);border-radius:12px;padding:10px 12px;font-size:.92rem}
.nota ol{margin:6px 0 0;padding-left:20px}

/* Diálogo */
.dlg{position:fixed;inset:0;background:rgba(20,40,60,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-in{background:#fff;border-radius:22px;padding:22px;max-width:440px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.dlg-in p{font-size:1.15rem;font-weight:800;margin:0 0 6px}
.nav button:disabled.b-ini{opacity:.4}
/* Ecrã largo (sem coluna da mascote) */
.stage.largo{grid-template-columns:1fr}
.stage.largo .mascote{display:none}
.stage.largo .fala::before{display:none}
/* Cópia do texto */
.ct{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
.ct-lado{display:flex;flex-direction:column;gap:12px}
.ct-rot{font-family:var(--fonte-titulo);font-weight:600;color:var(--verde-esc);margin-bottom:6px}
.ct-modelo,.ct-passos{background:var(--creme);border:2px solid var(--linha);border-radius:16px;padding:10px 12px}
.ct-modelo{font-size:1.02rem;line-height:1.5}
.mtit{font-weight:800;margin-bottom:8px}
.mest{margin-bottom:8px}
.ml{display:flex;gap:6px;border-radius:8px;padding:0 4px}
.ml .mk{width:1.1em;flex:none;font-weight:800;color:#1E7A1B}
.ml.ok{color:#1E7A1B}
.ml.atual{background:#FFF6D6;outline:2px solid var(--amarelo)}
.ml.atual .mk{color:#B07800}
.ml mark{background:#FAD3BF;color:#A8320E;border-radius:3px;padding:0 1px;text-decoration:underline}
.ml mark.mais{font-size:.8rem}
.ct-passos ol{margin:0;padding-left:22px;font-size:.95rem;font-weight:600}
.ct-passos li{margin:0 0 8px;color:var(--suave)}
.ct-passos li.atual{color:var(--texto);font-weight:800}
.ct-passos li.ok{color:#1E7A1B;text-decoration:line-through;text-decoration-thickness:1px}
.ct-passos li.ok::marker{content:"✔ "}
.ct-passos .bt{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;border:1px solid #9AA9BA;border-radius:4px;background:#fff;vertical-align:middle;padding:0 3px}
.wd{border:1px solid #B9C3CE;border-radius:10px;overflow:hidden;background:#F3F2F1;box-shadow:0 4px 14px rgba(0,0,0,.08);font-family:"Segoe UI",Arial,sans-serif;min-width:0}
.wd-tit{background:#2B579A;color:#fff;font-size:.9rem;padding:6px 12px;display:flex;align-items:center;gap:8px}
.wd-abas{display:flex;gap:2px;background:#2B579A;padding:0 8px;overflow-x:auto}
.wd-abas span{color:#fff;font-size:.85rem;padding:5px 10px;white-space:nowrap}
.wd-abas span.on{background:#F3F2F1;color:#2B579A;border-radius:4px 4px 0 0;font-weight:700}
.wd-fita{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-bottom:1px solid #D5D9DE;background:#F3F2F1}
.wd-grp{display:flex;flex-direction:column;align-items:center;gap:3px;padding:0 8px;border-right:1px solid #D5D9DE}
.wd-grp:last-child{border-right:0}
.wd-grp small{font-size:.7rem;color:#555}
.wd-lin{display:flex;gap:3px;align-items:center}
.wd-b{min-width:32px;height:32px;border:1px solid transparent;border-radius:4px;background:transparent;font-size:1rem;cursor:pointer;color:#222;display:inline-flex;align-items:center;justify-content:center;font-family:"Times New Roman",serif}
.wd-b:hover{background:#E1E6EC;border-color:#C5CED8}
.wd-b.realce{background:#FFF1B8;border:2px solid #E0A800}
.wd-cor{position:relative;flex-direction:column;gap:0;line-height:1}
.wd-cor span{font-weight:700;border-bottom:4px solid #c00000;padding:0 3px}
.wd-cor input{position:absolute;inset:0;opacity:0;cursor:pointer}
.wd select{height:30px;border:1px solid #B9C3CE;border-radius:4px;background:#fff;font-size:.85rem}
#wdFonte{width:130px}#wdTam{width:54px}
.wd-regua{height:14px;margin:0 18px;background:repeating-linear-gradient(90deg,#fff 0 9px,#C8CED6 9px 10px);border:1px solid #D5D9DE;border-top:0}
.wd-area{background:#E6E6E6;padding:16px;max-height:470px;overflow:auto}
.wd-pag{background:#fff;min-height:420px;padding:36px 44px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-family:Calibri,Carlito,Arial,sans-serif;font-size:19px;line-height:1.45;color:#111;outline:none;caret-color:#2B579A;word-break:break-word}
.wd-pag:focus{box-shadow:0 0 0 3px #A7C4E8,0 1px 4px rgba(0,0,0,.25)}
.wd-estado{background:#2B579A;color:#fff;font-size:.78rem;display:flex;gap:18px;padding:4px 12px;flex-wrap:wrap}
@media (max-width:860px){.ct{grid-template-columns:1fr}.wd-pag{padding:20px;min-height:300px}}
/* Confetti */
.confete{position:fixed;top:-12px;width:10px;height:14px;z-index:30;pointer-events:none;animation:cai 1.8s linear forwards;border-radius:2px}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg)}}
/* Modo quadro */
body.quadro .opt,body.quadro .chip{padding:16px 20px}
/* Responsivo */
@media (max-width:760px){
  .stage{grid-template-columns:1fr;padding:14px}
  .mascote{flex-direction:row;gap:12px}
  .mascote .fig{width:90px}
  .mascote .aces{font-size:1.5rem}
  .fala::before{display:none}
  .escolhas,.regras,.caixas{grid-template-columns:1fr 1fr}
  .palavra-grande{font-size:2.3rem}
  .modelo{font-size:1.5rem}
  .escrever{font-size:1.5rem}
  .topo h1{font-size:1.05rem}
}
@media print{
  body{background:#fff}
  body *{visibility:hidden}
  #cert,#cert *{visibility:visible}
  #cert{position:absolute;left:0;top:0;width:100%}
  #deco,.b-prof{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

let actx=null;
function tom(freqs,dur=.12,tipo="sine",vol=.18){
  if(!S.som)return;
  try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=tipo;o.frequency.value=f;
      const t=actx.currentTime+i*dur;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g).connect(actx.destination);o.start(t);o.stop(t+dur*1.8);});}catch(e){}
}

      <div class="caderno" id="cad">${feitas.length?feitas.map(f=>`<p>${esc(f)}</p>`).join(""):`<p class="vazio">O teu caderno digital: o que copiares bem aparece aqui.</p>`}</div>`;
    const inp=area.querySelector("#esc");
    const pinta=()=>{const t=inp.value;let h="";
      for(let k=0;k<m.length;k++){let cl="";if(k<t.length)cl=t[k]===m[k]?"c-ok":"c-mal";else if(k===t.length)cl="c-prox";
        h+=`<span class="${cl}">${m[k]===" "?"&nbsp;":esc(m[k])}</span>`;}

      dt.innerHTML=d;dt.style.display=d?"block":"none";};
    inp.oninput=()=>{pinta();limparFb();};
    inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();verifica();}};
    area.querySelector("#ver").onclick=verifica;
    pinta();trackedTimeout(()=>inp.focus(),60);

  }
  function avancar(){i++;if(i<lista.length)mostra();else{registar(id,certas,lista.length);area.innerHTML=`<div class="palavra-grande">✍️ ${certas} / ${lista.length}</div><div class="caderno">${feitas.map(f=>`<p>${esc(f)}</p>`).join("")}</div>`;concluir(id,tipo==="pal"?"✔ Copiaste todas as palavras! Carrega em «Próximo».":"✔ Copiaste todas as frases com cuidado! Agora vais copiar o texto no processador de texto.");}}
  function verifica(){
    const inp=area.querySelector("#esc");if(!inp)return;const m=lista[i];const t=inp.value.replace(/\s+/g," ").trim();
    if(!t){feedback(false,"Escreve primeiro na caixa branca.");inp.focus();return;}
    if(t===m){if(tentativas===0)certas++;feitas.push(m);somOk();inp.disabled=true;feedback(true,"✔ Copiado sem erros! "+(i<lista.length-1?"Vamos à seguinte.":""));trackedTimeout(avancar,1100);}
    else{tentativas++;somQuase();inp.classList.remove("treme");void inp.offsetWidth;inp.classList.add("treme");
      feedback(false,"Quase! Olha para as letras a laranja e corrige com calma.");
      if(tentativas>=3)area.querySelector("#mais").innerHTML=`<button class="btn sec" id="seg">Continuar ➜</button>`,area.querySelector("#seg").onclick=()=>{feitas.push(m);avancar();};
      inp.focus();}
  }
  mostra();
}

function dicaCar(ch){
  if(ch===undefined)return "";
  if(ch==="—")return "O travessão <b>—</b> escreve-se com o hífen <kbd>-</kbd> (ao lado do ponto final).";
  if(ch==="ç")return "O <kbd>ç</kbd> está na tecla à direita do <kbd>L</kbd>.";
  if(/[áéíóú]/.test(ch))return `Carrega primeiro em <kbd>´</kbd> (à direita do <kbd>+</kbd>) e depois em <kbd>${ch.normalize("NFD")[0]}</kbd>.`;
  if(/[ãõ]/.test(ch))return `Carrega primeiro em <kbd>~</kbd> (à direita do <kbd>º</kbd>) e depois em <kbd>${ch.normalize("NFD")[0]}</kbd>.`;
  if(/[ÁÉÍÓÚ]/.test(ch))return `Carrega em <kbd>´</kbd> e depois, com o <kbd>Shift ⇧</kbd> carregado, em <kbd>${ch.normalize("NFD")[0]}</kbd>.`;
  if(ch!==ch.toLowerCase())return `Mantém o <kbd>Shift ⇧</kbd> carregado e carrega em <kbd>${ch}</kbd>.`;
  if(ch==="!")return "<kbd>Shift ⇧</kbd> + <kbd>1</kbd> faz o ponto de exclamação.";
  if(ch===":")return "<kbd>Shift ⇧</kbd> + <kbd>.</kbd> faz os dois pontos.";
  if(ch==="…")return "As reticências são três pontos seguidos: <kbd>.</kbd><kbd>.</kbd><kbd>.</kbd>";
  if(ch===",")return "A vírgula <kbd>,</kbd> está ao lado do <kbd>M</kbd>.";
  if(ch===".")return "O ponto final <kbd>.</kbd> está ao lado da vírgula.";
  if(ch===" ")return "Agora um espaço — a barra comprida do teclado.";
  return "";
}
function linhasEditor(ed){
  const L=[];let cur={t:"",el:null,nos:[]};
  const flush=()=>{L.push(cur);cur={t:"",el:null,nos:[]};};
  const bloco=n=>n.nodeType===1&&/^(DIV|P|H[1-6]|LI|UL|OL|BLOCKQUOTE)$/.test(n.nodeName);
  (function w(n,blk){
    for(const c of n.childNodes){
      if(c.nodeType===3){if(c.nodeValue){cur.t+=c.nodeValue;cur.nos.push(c);}if(!cur.el)cur.el=blk;}
      else if(c.nodeName==="BR"){if(!cur.el)cur.el=blk;flush();}
      else if(bloco(c)){if(cur.t)flush();cur={t:"",el:null,nos:[]};w(c,c);if(cur.t)flush();cur={t:"",el:null,nos:[]};}
      else if(c.nodeType===1)w(c,blk);
    }
  })(ed,ed);
  if(cur.t)flush();
  return L.map(l=>Object.assign(l,{n:normLinha(l.t)}));
}

function confirmar(msg,simTxt,aoSim){

     <p style="margin:8px 0 0">O excerto de «Versos diversos para meninos travessos» lê-se no manual. O poema «A caminho da ceia» é original e foi escrito para treinar os mesmos casos (s, ss, c, ç) com o tema do Natal e do inverno.</p></div>
   <h4>Resultados guardados neste computador (${res.length})</h4>
   ${res.length?`<table class="tabela"><tr><th>N.º</th><th>Data</th><th>Perfil</th><th>%</th><th>⭐</th></tr>${res.slice().reverse().map(r=>`<tr><td>${esc(r.n)}</td><td>${esc(r.d)}</td><td>${esc(r.p)}</td><td>${r.pct}%</td><td>${"⭐".repeat(r.e)}</td></tr>`).join("")}</table>`:"<p>Ainda não há resultados.</p>"}
   <p style="font-size:.85rem;color:var(--suave)">Só se guarda o número do aluno, sem nomes, e apenas neste computador.</p>
   <div class="linha-btn"><button class="btn sec" id="pLimpa">🗑️ Limpar resultados</button><button class="btn" id="pFecha">Fechar</button></div>`;
  c.querySelector(".fechar").onclick=fecharProf;c.querySelector("#pFecha").onclick=fecharProf;
  c.querySelector("#pTema").onchange=e=>{CONF.tema=e.target.value;gravarLS(CHAVE+"_conf",CONF);aplicarTema();};
  c.querySelectorAll("[name=pPerf]").forEach(r=>r.onchange=()=>{S.perfil=r.value;});
  c.querySelector("#pSom").onchange=e=>{S.som=e.target.checked;atualizarSom();};
  c.querySelectorAll(".saltos button").forEach(b=>b.onclick=()=>{if(!S.modo){S.modo="pc";}fecharProf();ir(+b.dataset.k);});
  c.querySelector("#pLimpa").onclick=()=>confirmar("Apagar todos os resultados guardados neste computador?","Sim, apagar",()=>{gravarLS(CHAVE+"_res",[]);abrirProf();});
}
function fecharProf(){$("#modal").classList.remove("aberto");}
/* ===================== ARRANQUE ===================== */
$("#bIni").onclick=()=>reiniciar(true);
$("#bAnt").onclick=()=>ir(S.idx-1);
$("#bProx").onclick=()=>ir(S.idx+1);
$("#bOuvir").onclick=()=>{const e=ECRAS[S.idx];falar(e.tit+". "+e.txt,true);};
$("#bMais").onclick=()=>{CONF.escala=Math.min(1.4,+(CONF.escala+.1).toFixed(2));aplicarConf();};
$("#bMenos").onclick=()=>{CONF.escala=Math.max(.85,+(CONF.escala-.1).toFixed(2));aplicarConf();};
$("#bLeg").onclick=()=>{CONF.legivel=!CONF.legivel;aplicarConf();};
$("#bCon").onclick=()=>{CONF.contraste=!CONF.contraste;aplicarConf();};
$("#bSom").onclick=()=>{S.som=!S.som;atualizarSom();if(S.som)somOk();};
$("#bEcra").onclick=()=>{try{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}catch(e){}};
if(!document.fullscreenEnabled)$("#bEcra").style.display="none";
$("#bProf").onclick=abrirProf;
$("#modal").onclick=e=>{if(e.target.id==="modal")fecharProf();};
document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharProf();});
aplicarConf();aplicarTema();atualizarSom();ir(0);
</script>
