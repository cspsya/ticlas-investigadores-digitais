<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ticl@s | O Percurso de Natal — 4.º ano</title><style>
:root{--gold:#efcb80;--cream:#fff7e5;--muted:#c2d4c9;--blue:#2f6f9a;--rep:#a5721f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#315749,#102925 70%);color:var(--cream);font:18px/1.45 system-ui,'Segoe UI',sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit;background:#28574a;border:1px solid #769786;border-radius:12px;padding:10px 16px;font-weight:700;min-height:48px;touch-action:manipulation}
button:hover:not(:disabled){background:#396e5d}button:focus-visible,a:focus-visible{outline:3px solid #ffe29c;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:var(--gold);color:#142e25;border-color:var(--gold)}.primary:hover:not(:disabled){background:#ffe3a7}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,calc((100vw - 1200px)/2));background:#0a201d;border-bottom:1px solid #a98c52;flex-wrap:wrap}
.brand{font-weight:900;color:var(--gold);letter-spacing:1px}.small{font-size:14px;color:var(--muted)}
#ticlas-voltar-portal{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:9px 14px;border:1px solid #c9a865;border-radius:10px;background:#28574a;color:var(--gold);font-weight:700;text-decoration:none}
main{max-width:1200px;margin:auto;padding:18px}h1,h2,h3,p{margin-top:0}h3{margin-bottom:8px}
h1{font-family:Georgia,serif;color:var(--gold);font-size:clamp(32px,5vw,54px);line-height:1.05;margin-bottom:10px}h2{font-family:Georgia,serif;color:var(--gold);font-size:24px;margin-bottom:8px}
.panel{background:linear-gradient(145deg,#23453c,#15332e);border:1px solid #688476;border-radius:16px;padding:16px;box-shadow:0 10px 30px #0003}
.hidden{display:none!important}
.hero{display:grid;grid-template-columns:1fr 1.2fr;gap:22px;align-items:center;margin-bottom:18px}.hero img{width:100%;border-radius:16px;border:1px solid #9b855b;aspect-ratio:16/9;object-fit:cover}
.worlds{display:grid;gap:14px}.world{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center}.world img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px}
.levels{display:flex;flex-wrap:wrap;gap:10px}.lvl{width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;padding:4px;border-radius:14px;background:#1f4a5e;border-color:#81a8bd;line-height:1.1}.lvl .st{font-size:13px;color:#ffd56b;letter-spacing:1px;min-height:15px}.lvl.next{background:var(--gold);color:#142e25;border-color:var(--gold)}.lvl.next .st{color:#7a5a10}.lvl:disabled{background:#182e2a}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}.stars{color:#ffd56b;font-size:22px;letter-spacing:2px}
.task{font-size:22px;font-weight:700;margin:0 0 12px}
.game{display:grid;grid-template-columns:minmax(280px,1fr) minmax(300px,1fr);gap:16px;align-items:start}
.boardWrap{display:flex;justify-content:center}.board{position:relative;display:grid;width:min(100%,460px);border-radius:14px;overflow:hidden;border:3px solid #c9a865;background:#eef7fa}
.cell{position:relative;box-shadow:inset 0 0 0 1px #b9d3dd;display:flex;align-items:center;justify-content:center;background:#eef7fa}.cell.alt{background:#e2eff5}
.cell svg{width:76%;height:76%}.cell.ice{background:#cfe8f3}
.cell.trail::after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:#e0a83a;opacity:.9}
.actor{position:absolute;transition:left .32s ease,top .32s ease;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}.actor img{width:94%;height:94%;object-fit:contain;filter:drop-shadow(0 3px 3px #0006)}
.actor.bump{animation:bump .45s}@keyframes bump{25%{transform:translateX(-9%) rotate(-6deg)}50%{transform:translateX(9%) rotate(6deg)}75%{transform:translateX(-5%)}}
.palette{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.pbtn{min-width:98px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--blue);border-color:#8cc0e0;font-size:30px;line-height:1}.pbtn small{font-size:14px;font-weight:700}
.pbtn.rep{background:var(--rep);border-color:#e3bc6b}.pbtn:hover:not(:disabled){filter:brightness(1.12);background:var(--blue)}.pbtn.rep:hover:not(:disabled){background:var(--rep)}
.prog{min-height:96px;background:#0c2420;border:3px dashed #829a86;border-radius:14px;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;cursor:pointer}
.prog.active{border-color:var(--gold)}
.solbox{border:2px dashed var(--gold);border-radius:14px;padding:10px;margin:12px 0;background:#0000002a}.prog.sol{min-height:0;cursor:default;border-style:solid}#buy{border-color:var(--gold)}
.tile{position:relative;width:60px;height:60px;border-radius:12px;background:var(--blue);border:2px solid #8cc0e0;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;transition:transform .15s}
.tile.run{outline:4px solid var(--gold);outline-offset:2px;transform:scale(1.1)}
.x{position:absolute;top:-10px;right:-10px;width:28px;height:28px;min-height:28px;padding:0;border-radius:50%;background:#8a3338;border:2px solid #fff;font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:1}
.repbox{background:var(--rep);border:2px solid #e3bc6b;border-radius:14px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:6px;position:relative;min-width:160px;cursor:pointer}
.repbox.active{outline:4px solid var(--gold);outline-offset:2px}
.rephead{display:flex;align-items:center;gap:6px;font-weight:800}.rephead button{min-height:38px;width:38px;padding:0;font-size:24px;background:#5d3f0e;border-color:#e3bc6b}.num{font-size:26px;min-width:36px;text-align:center;background:#fff3d6;color:#4a330b;border-radius:8px}
.repbody{display:flex;flex-wrap:wrap;gap:12px;min-height:66px;background:#0c2420b0;border-radius:10px;padding:8px;align-items:center}
.slot{width:60px;height:60px;border:2px dashed #e3bc6b;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#e3bc6b}.prog>.slot{border-color:#9fb8a6;color:#9fb8a6}
.prog.fn{border-color:#a58bc0;background:#1d1530}.prog.fn.active{border-color:#e0c4ff}.tile.call{background:#6b3f8a;border-color:#c6a0df;font-family:Georgia,serif}.pbtn.fnb{background:#6b3f8a;border-color:#c6a0df}.pbtn.fnb:hover:not(:disabled){background:#6b3f8a}.actor .dir{position:absolute;right:-2%;bottom:-2%;width:38%;height:38%;border-radius:50%;background:#ffe1a0;color:#152c29;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:clamp(12px,2.2vw,20px);box-shadow:0 1px 4px #0006}.actor.flip img{transform:scaleX(-1)}
.explain{background:#102b25;border:1px solid #5e7c6e;border-radius:12px;padding:8px 12px;margin:0 0 14px}.explain summary{cursor:pointer;font-weight:800;color:var(--gold)}.explain p{margin:8px 0 2px}#lang{font:inherit;font-size:16px;padding:8px;border-radius:10px;background:#28574a;color:#fff7e5;border:1px solid #769786;min-height:44px}
.count{font-size:17px;margin:8px 0 12px}.count b{color:var(--gold)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{display:flex;gap:12px;align-items:center;background:#102b25;border-radius:12px;padding:10px;margin-top:12px;min-height:86px;font-size:19px;border-left:4px solid #b49b63}.msg img{width:66px;height:66px;object-fit:contain;background:#fff;border-radius:10px;flex:none}.msg.ok{border-color:#7bca94;color:#c9f3cc}.msg.bad{border-color:#e68a74;color:#ffd9c8}
.win{text-align:center}.big{font-size:40px;color:#ffd56b;letter-spacing:3px;margin:6px 0 14px}
footer{text-align:center;padding:20px;color:var(--muted);font-size:13px}footer button{background:none;border:none;color:var(--muted);text-decoration:underline;min-height:auto;font-size:13px;padding:4px;font-weight:400}footer button:hover:not(:disabled){background:none;color:#fff}
dialog{background:#193a33;color:var(--cream);border:1px solid var(--gold);border-radius:15px;max-width:460px}dialog::backdrop{background:#0009}
@media(max-width:780px){.hero,.game,.world{grid-template-columns:1fr}.world img{max-height:150px}header{flex-direction:column;align-items:flex-start}}
@media print{header,footer,#home,#play,#final .actions,#final label,.explain{display:none!important}body{background:#fff;color:#000}#final{display:block!important}.panel{background:#fff;box-shadow:none;border:3px solid #15372d}h1,h2{color:#15372d}.big{color:#a07a14}#student{border:none;font-size:26px!important;font-weight:800}}

<main>
<section id="home"><div class="hero"><div><div class="small" data-t="MISSÃO DE NATAL"></div><h1 data-t="O Percurso de Natal"></h1><p data-t="O Pai Natal perdeu os presentes na neve! Programa o Ticl@s com repetições e funções para os apanhar todos."></p><p class="small" data-t="Usa a «Ajuda» quando precisares: a primeira ajuda é grátis; a segunda mostra o caminho, mas custa 1 estrela."></p><p class="small" data-t="Cada estrela vale 2 pontos. Quando tiveres 3 pontos, podes trocá-los pela resposta correta."></p><div class="actions"><button class="primary" id="start"></button><button id="toFinal" class="hidden" data-t="Ver diploma"></button></div></div><img id="heroImg" alt="" data-ta="O Ticl@s num tabuleiro com presentes"></div><div class="worlds" id="worlds"></div></section>
<section id="play" class="hidden"><div class="top"><button id="back" data-t="← Níveis"></button><span id="lvlLabel" class="small"></span><span id="lvlStars" class="stars"></span></div><p class="task" id="task"></p><details id="explain" class="explain"><summary id="explainQ"></summary><p id="explainA"></p></details>
<div class="game"><div class="panel"><div class="boardWrap"><div id="board" class="board"></div></div><div id="msg" class="msg" role="status" aria-live="polite"></div></div>
<div class="panel"><h3 data-t="1. Escolhe os blocos"></h3><div id="palette" class="palette"></div><div id="solBox" class="hidden solbox"><h3 style="margin:0 0 8px" data-t="Resposta correta — copia estes blocos para o teu programa:"></h3><div id="solProg" class="prog sol"></div><div id="solFnWrap" class="hidden"><h3 style="margin:10px 0 6px" data-t="ƒ Função"></h3><div id="solFn" class="prog fn sol"></div></div></div><h3 data-t="2. O teu programa"></h3><div id="prog" class="prog"></div><div id="fnWrap" class="hidden"><h3 style="margin-top:14px" data-t="ƒ Função"></h3><p class="small" style="margin:0 0 6px" data-t="Põe aqui os blocos que se repetem. O bloco ƒ no programa executa a função."></p><div id="fnProg" class="prog fn"></div></div><div class="count" id="count"></div><div class="actions"><button class="primary" id="run" data-t="▶ Executar"></button><button id="step" data-t="Passo a passo"></button><button id="restart" data-t="Recomeçar"></button><button id="help"></button><button id="buy" class="hidden"></button><span id="points" class="small" style="align-self:center"></span><button id="next" class="primary hidden"></button></div></div></div></section>
<section id="final" class="hidden"><div class="panel win" style="max-width:640px;margin:auto"><h1 data-t="Parabéns!"></h1><img id="finalImg" alt="" data-ta="Ticl@s com um troféu" style="width:190px;background:#fff;border-radius:14px"><h2 data-t="Diploma do Percurso de Natal"></h2><p id="finalText"></p><p class="big" id="finalStars"></p><label for="student" data-t="Nome do aluno"></label><p><input id="student" maxlength="80" style="font:inherit;padding:10px;border-radius:10px;border:1px solid #aaa;width:100%;text-align:center"></p><div class="actions" style="justify-content:center"><button class="primary" onclick="window.print()" data-t="Imprimir diploma"></button><button id="finalBack" data-t="Ver níveis"></button></div></div></section>
</main>
<footer>Coordenadora TIC C. Sofia O. · Ticl@s — Investigadores Digitais · 1.º Ciclo · <button id="teacher" data-t="Professor: abrir todos os níveis"></button></footer>

function stop(){token++;if(busy)lock(false)}
function sayErr(e){const k=e.message;say(()=>T(k),3,'bad')}
async function run(){if(busy)return;let list;try{list=compile()}catch(e){sayErr(e);return}resetBoard();lock(true);const t=++token;say(()=>T('O Ticl@s está a andar…'));await wait(300);for(const st of list){if(t!==token)return;const res=doStep(st);if(res!=='go'){lock(false);return}await wait(st.t==='TL'||st.t==='TR'?320:450)}if(t!==token)return;lock(false);missing()}
function step(){if(busy)return;if(!steps){let list;try{list=compile()}catch(e){sayErr(e);return}resetBoard();steps=list;si=0}const res=doStep(steps[si]);si++;if(res!=='go'){steps=null;return}if(si>=steps.length){steps=null;missing()}else{const a=si,b=steps.length;say(()=>T('Passo {a} de {b}. Carrega outra vez em «Passo a passo».',{a,b}))}}
function win(){const L=LEVELS[cur],n=total(),pen=helpN>=2,k=Math.max(1,starsFor(L,n)-(pen?1:0));data.stars[cur]=Math.max(data.stars[cur]||0,k);if(data.unlocked<cur+2)data.unlocked=Math.min(LEVELS.length,cur+2);save();buyBtn();$('lvlStars').textContent=starStr(data.stars[cur]);const p=par(L);say(()=>T('Muito bem!')+' '+starStr(k)+' '+(k===3?T('Programa perfeito!'):pen&&n<=p?T('Programa perfeito, mas a ajuda do caminho custou 1 estrela.'):T('Usaste {n} blocos. Consegues com {p}?',{n,p})),4,'ok');$('next').classList.remove('hidden');steps=null}
function finalScreen(){stop();show('final');$('finalImg').src=POSES[4];$('finalText').textContent=T(LEARNED,{n:LEVELS.length});$('finalStars').textContent=`${Object.values(data.stars).reduce((a,b)=>a+b,0)} / ${LEVELS.length*3} ★`;$('student').value=data.name||''}
let onYes=null,askKeys=null;function ask(title,text,fnc){askKeys=[title,text];$('cTitle').textContent=T(title);$('cText').textContent=T(text);onYes=fnc;$('confirm').showModal()}
$('cNo').onclick=()=>$('confirm').close();$('cYes').onclick=()=>{$('confirm').close();if(onYes)onYes()};
$('heroImg').src=IMG.grid;
$('start').onclick=()=>{const i=LEVELS.findIndex((L,j)=>!data.stars[j]);openLevel(i<0?LEVELS.length-1:Math.min(i,data.unlocked-1))};
$('toFinal').onclick=finalScreen;$('finalBack').onclick=home;$('back').onclick=home;
$('buy').onclick=()=>{if(busy||points()<3||!confirm(T('Trocar 3 pontos pela resposta correta? Vais ver os blocos certos e montas tu o programa.')))return;data.spent=(data.spent||0)+3;data.sol=data.sol||{};data.sol[cur]=true;save();buyBtn();$('solBox').scrollIntoView({behavior:'smooth',block:'nearest'})};$('run').onclick=run;$('step').onclick=step;$('help').onclick=()=>{const L=LEVELS[cur];helpN++;if(helpN===1)say(()=>T('Ajuda:')+' '+T(L.hint),2);else{trailOn=true;drawBoard();say(()=>T('Ajuda:')+' '+T(L.hint)+' '+T('Segue os pontos amarelos no tabuleiro.')+(helpN===2?' '+T('(Esta ajuda custou 1 estrela.)'):''),2)}helpBtn()};
$('restart').onclick=()=>{if(busy)return;const L=LEVELS[cur];prog=copy(L.preset||[]);fn=copy(L.presetFn||[]);active={list:prog,area:'main'};resetBoard();render();say(()=>T(L.preset||L.presetFn?'O programa voltou ao início, com o erro.':'Programa limpo. Começa outra vez!'))};
$('prog').onclick=()=>{if(busy)return;active={list:prog,area:'main'};render()};
$('fnProg').onclick=()=>{if(busy)return;active={list:fn,area:'fn'};render()};
$('next').onclick=()=>{if(cur===LEVELS.length-1)finalScreen();else openLevel(cur+1)};
$('student').oninput=()=>{data.name=$('student').value;save()};
$('teacher').onclick=()=>ask('Abrir todos os níveis?','Esta opção é para o professor: todos os níveis ficam disponíveis neste computador.',()=>{data.unlocked=LEVELS.length;save();home()});
$('resetAll').onclick=()=>ask('Começar de novo?','O progresso e as estrelas guardados neste computador serão apagados.',()=>{data=fresh();save();home()});
initLang(()=>{applyStatic();const portal=$('ticlas-voltar-portal');portal.lastChild.textContent=' '+T('Voltar ao Ticl@s');portal.title=portal.ariaLabel=T('Voltar à página inicial do Ticl@s');if(askKeys&&$('confirm').open){$('cTitle').textContent=T(askKeys[0]);$('cText').textContent=T(askKeys[1])}if(!$('play').classList.contains('hidden')){texts();if(lastSay)say(...lastSay)}else if(!$('final').classList.contains('hidden'))finalScreen();else home()});

</script></body></html>
