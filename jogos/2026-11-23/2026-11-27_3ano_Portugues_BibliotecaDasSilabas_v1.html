<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Biblioteca das Sílabas com o Ticl@s — 3.º ano</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#2F6E96; --verde-esc:#285775; --verde-claro:#E6F1F8;
  --creme:#FFF8F0; --tinta:#2B3A33; --cinza:#6B7A72;
  --mono:#F2B01E; --di:#3F8FC4; --tri:#4FA844; --poli:#E0603A;
  --mono-c:#FFF3CF; --di-c:#DCEEFA; --tri-c:#DFF3DB; --poli-c:#FCE1D8;
  --madeira:#B9814F; --madeira-esc:#8A5A30;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--tinta);background:var(--creme);
  background-image:radial-gradient(circle at 12% 8%,#E6F1F8 0,transparent 38%),radial-gradient(circle at 92% 90%,#FFE9C9 0,transparent 36%);
  display:flex;flex-direction:column;min-height:100vh}
h1,h2,h3,button,.fred{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--verde);color:#fff}
header .tit{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:600;font-size:1.15rem;flex:1}
header .pontos{font-weight:800;background:#fff;color:var(--verde-esc);border-radius:999px;padding:4px 14px}
#trilho{display:flex;gap:6px;justify-content:center;padding:10px 8px 0;flex-wrap:wrap}
#trilho span{width:30px;height:38px;border-radius:4px 4px 2px 2px;background:#E4DCCF;display:flex;align-items:center;justify-content:center;
  font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:600;font-size:.85rem;color:#8a8275;border-bottom:4px solid #cfc5b5}
#trilho span.feito{background:var(--verde);color:#fff;border-bottom-color:var(--verde-esc)}
#trilho span.atual{outline:3px solid var(--mono);outline-offset:2px}
main{flex:1;width:100%;max-width:1000px;margin:0 auto;padding:14px 16px 8px}
.ecra{display:none}
.ecra.ativo{display:block;animation:entra .35s ease}
@keyframes entra{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cartao{background:#fff;border-radius:22px;padding:20px 22px;box-shadow:0 6px 0 #E9DFD0,0 10px 24px rgba(60,40,10,.08)}
.topo{display:flex;gap:16px;align-items:flex-end;margin-bottom:14px}
.topo img{height:120px;max-width:150px;object-fit:contain;flex:none}
.balao{position:relative;background:var(--verde-claro);border:2px solid #BFD9EA;border-radius:18px;padding:12px 16px;font-size:1.08rem;line-height:1.45;flex:1}
.balao:before{content:"";position:absolute;left:-12px;bottom:22px;border:10px solid transparent;border-right-color:#BFD9EA;border-left:0}
.balao h2{margin:0 0 4px;color:var(--verde-esc);font-size:1.35rem}
.balao p{margin:4px 0}
button{cursor:pointer;border:0;font-size:1.05rem;font-weight:600;border-radius:14px;padding:10px 20px;transition:transform .08s}
button:active{transform:translateY(2px)}
button:focus-visible{outline:3px solid #1b4dff;outline-offset:2px}
.btn{background:var(--verde);color:#fff;box-shadow:0 4px 0 var(--verde-esc)}
.btn.sec{background:#fff;color:var(--verde-esc);border:2px solid var(--verde);box-shadow:0 4px 0 #BFD9EA}
.btn:disabled{background:#D9D4CB;color:#8a8275;box-shadow:0 4px 0 #BDB6A9;cursor:not-allowed}
nav.fundo{display:flex;gap:10px;justify-content:center;padding:10px 16px}
footer{text-align:center;font-size:.85rem;color:var(--cinza);padding:6px 10px 12px}
footer a{color:var(--cinza)}
footer button{background:none;padding:2px 6px;font-size:.85rem;color:var(--cinza);font-weight:400}
.msg{min-height:34px;margin:10px 0 0;font-weight:800;font-size:1.05rem;text-align:center}
.msg.ok{color:var(--verde-esc)} .msg.erro{color:#C2401C}
.conta{font-weight:800;color:var(--cinza);text-align:right;margin-bottom:6px}
.c-mono{background:var(--mono-c);border-color:var(--mono)!important}
.c-di{background:var(--di-c);border-color:var(--di)!important}
.c-tri{background:var(--tri-c);border-color:var(--tri)!important}
.c-poli{background:var(--poli-c);border-color:var(--poli)!important}
.treme{animation:treme .35s}
@keyframes treme{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.salta{animation:salta .4s}
@keyframes salta{50%{transform:scale(1.12)}}

/* início */
.inicio{text-align:center}
.inicio img{height:210px;max-width:90%;object-fit:contain}
.inicio h1{font-size:2.3rem;color:var(--verde-esc);margin:6px 0 2px}
.inicio p{font-size:1.15rem;margin:6px auto;max-width:620px}
.perfis{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.perfis button{background:#fff;border:3px solid #D9D4CB;min-width:210px;padding:14px;font-size:1.15rem}
.perfis button small{display:block;font-family:'Nunito','Segoe UI',Arial,sans-serif;font-weight:600;color:var(--cinza);font-size:.9rem}
.perfis button.sel{border-color:var(--verde);background:var(--verde-claro)}

/* recorda */
.tipos{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tipo{border:3px solid;border-radius:16px;padding:12px;text-align:center}
.tipo b{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.15rem;display:block}
.tipo .n{font-size:.95rem;margin:2px 0 8px}
.tipo .ex{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.3rem;font-weight:600;background:#fff;border-radius:10px;padding:6px}
.tipo .ex i{font-style:normal;color:var(--cinza);font-weight:400}
.passos{font-size:1.08rem;line-height:1.6;margin:14px 0 0;padding-left:22px}
kbd{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;background:#fff;border:2px solid #b9b2a6;border-bottom-width:4px;border-radius:8px;padding:1px 9px;font-size:1rem}
.teclas{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:6px}
.teclas div{background:#FBF4E9;border-radius:14px;padding:12px 14px;font-size:1.05rem;line-height:1.7}

/* cortar */
.palavra-corte{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin:22px 0 8px;min-height:92px}
.letra{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:600;font-size:3rem;line-height:1;padding:10px 2px;border-bottom:6px solid #E4DCCF}
.corte{width:26px;height:84px;background:none;padding:0;border-radius:8px;position:relative;font-size:1.3rem;color:#c9c0b1}
.corte:hover{background:#F3ECDF}
.corte:after{content:"✂";}
.corte.on{background:var(--mono-c)}
.corte.on:after{content:"";position:absolute;left:11px;top:4px;bottom:4px;width:4px;border-radius:2px;background:var(--poli)}
.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.classes button{border:3px solid;color:var(--tinta);padding:12px 6px}
.centro{text-align:center}

/* arrumar */
.fichas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:56px;margin-bottom:14px}
.ficha{background:#fff;border:3px solid #CFC5B5;color:var(--tinta);font-size:1.25rem;padding:8px 16px;box-shadow:0 4px 0 #CFC5B5}
.ficha.sel{border-color:var(--verde);background:var(--verde-claro);box-shadow:0 4px 0 var(--verde);transform:translateY(-3px)}
.gavetas{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.gaveta{border:3px dashed;border-radius:16px;min-height:170px;padding:8px;color:var(--tinta);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:1rem}
.gaveta b{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.05rem}
.gaveta span{background:#fff;border-radius:8px;padding:2px 10px;font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:500}

/* balões */
.ceu{position:relative;height:330px;border-radius:18px;overflow:hidden;background:linear-gradient(#CFEBFA,#F3FBFF);border:3px solid #BFDFF2}
.alvo{text-align:center;font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.25rem;font-weight:600;margin-bottom:8px}
.alvo span{border:3px solid;border-radius:12px;padding:2px 14px}
.bal{position:absolute;bottom:-90px;width:128px;height:78px;border-radius:50%;color:#fff;font-size:1.15rem;padding:0;
  animation:sobe linear infinite;box-shadow:inset -8px -8px 0 rgba(0,0,0,.12)}
.bal:after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:#9aa}
@keyframes sobe{from{transform:translateY(0)}to{transform:translateY(-560px)}}
.bal.errado{background:#9AA3A0!important;animation-play-state:paused}
.bal{transition:opacity .25s}
.bal.pum{opacity:0;pointer-events:none}

/* escrever */
.escreve{text-align:center}
.mostra{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:600;font-size:2.6rem;margin:14px 0 6px}
input[type=text],textarea{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.5rem;border:3px solid #CFC5B5;border-radius:14px;padding:10px 14px;width:min(100%,460px);text-align:center;color:var(--tinta);background:#fff}
textarea{width:100%;text-align:left;font-size:1.25rem;min-height:84px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 4px var(--verde-claro)}
input.certo{border-color:var(--verde);background:var(--verde-claro)}
.modelo{color:var(--cinza);font-size:1rem;margin:4px 0 12px}
.linha{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:12px}

/* intruso */
.quatro{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:8px}
.quatro button{background:#fff;border:3px solid #CFC5B5;box-shadow:0 5px 0 #CFC5B5;color:var(--tinta);font-size:1.6rem;padding:22px 8px}
.quatro button.certo{border-color:var(--verde);background:var(--verde-claro);box-shadow:0 5px 0 var(--verde)}
.quatro button.fora{opacity:.45}
.quatro small{display:block;font-family:'Nunito','Segoe UI',Arial,sans-serif;font-size:.95rem;color:var(--cinza);font-weight:700;min-height:1.2em}

/* roda */
.roda-zona{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:center}
.roda-caixa{position:relative;width:240px;height:240px;margin:0 auto}
.roda{width:240px;height:240px;border-radius:50%;border:8px solid var(--madeira-esc);transition:transform 2.6s cubic-bezier(.2,.8,.2,1);
  background:conic-gradient(var(--mono) 0 45deg,var(--di) 0 90deg,var(--tri) 0 135deg,var(--poli) 0 180deg,var(--mono) 0 225deg,var(--di) 0 270deg,var(--tri) 0 315deg,var(--poli) 0 360deg);position:relative}
.roda b{position:absolute;left:50%;top:50%;font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.5rem;color:#fff;width:40px;margin-left:-20px;height:30px;margin-top:-15px;text-align:center;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.seta{position:absolute;left:50%;top:-14px;margin-left:-14px;border:14px solid transparent;border-top:26px solid var(--tinta);z-index:2}
.pedido{font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-size:1.3rem;font-weight:600;min-height:2.6em}
.usadas{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.usadas span{border:2px solid;border-radius:10px;padding:2px 10px;font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif}

/* frutos */
.frutos{display:grid;gap:10px;margin-top:8px}
.frutos label{display:grid;grid-template-columns:150px 1fr 40px;gap:10px;align-items:center;font-family:'Fredoka','Nunito','Trebuchet MS','Segoe UI',sans-serif;font-weight:600;font-size:1.1rem}
.frutos label span.et{border:3px solid;border-radius:12px;padding:6px 8px;text-align:center}
.frutos input{width:100%;text-align:left;font-size:1.3rem}
.frutos em{font-style:normal;font-size:1.4rem}

/* frases */
.lista-ok{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-wrap:wrap;gap:8px 18px;font-weight:700;color:var(--cinza)}
.lista-ok li.s{color:var(--verde-esc)}
.lista-ok li:before{content:"○ "} .lista-ok li.s:before{content:"✔ "}

/* final */
.final{text-align:center}
.final img{height:200px;max-width:90%;object-fit:contain}
.estrelas{font-size:2.6rem;letter-spacing:6px;margin:4px 0}
.resumo{width:100%;border-collapse:collapse;margin:12px 0;text-align:left}
.resumo td,.resumo th{padding:6px 10px;border-bottom:2px solid #F0E8DB}
.minhas{text-align:left;background:#FBF4E9;border-radius:14px;padding:10px 16px}
.minhas p{margin:6px 0;font-size:1.1rem}
.confete{position:fixed;top:-20px;width:10px;height:16px;z-index:9;animation:cai linear forwards;pointer-events:none}
@keyframes cai{to{transform:translateY(105vh) rotate(540deg)}}

@media (max-width:720px){
  .tipos,.classes,.gavetas{grid-template-columns:repeat(2,1fr)}
  .roda-zona,.teclas{grid-template-columns:1fr}
  .topo img{height:84px}.letra{font-size:2.1rem}.corte{width:20px;height:64px}
  .frutos label{grid-template-columns:110px 1fr 30px}
  .inicio h1{font-size:1.7rem}.inicio img{height:150px}
}
@media (prefers-reduced-motion:reduce){.ecra.ativo,.salta,.treme{animation:none}.roda{transition:none}}
</style>
<style id="ticlas-estilo-portal">
#ticlas-voltar-portal {
  box-sizing:border-box; display:inline-flex; align-items:center; justify-content:center;
  gap:7px; flex:0 0 auto; min-height:44px; padding:8px 14px;
  border:2px solid #285775; border-radius:12px; background:#fff; color:#285775;
  font:800 16px/1.2 'Nunito','Segoe UI',sans-serif; white-space:nowrap;
  text-decoration:none; cursor:pointer; touch-action:manipulation; position:relative;
}
#ticlas-voltar-portal:hover {background:#285775;color:#fff}
#ticlas-voltar-portal:focus-visible {outline:3px solid #E8834A;outline-offset:3px}
#ticlas-voltar-portal span {font-size:21px;line-height:1}
#ticlas-nav-portal {box-sizing:border-box;flex:0 0 auto;width:100%;max-width:1180px;
  margin:0 auto;padding:6px 14px;display:flex;justify-content:flex-start;align-items:center}
body > #ticlas-nav-portal + .app {min-height:calc(100% - 56px)}
@media print {#ticlas-voltar-portal,#ticlas-nav-portal {display:none!important}}
</style>
</head>

const main=$('#main');
function cabeca(pose,titulo,html){return `<div class="topo"><img src="${MASC[pose]}" alt="Ticl@s"><div class="balao"><h2>${titulo}</h2>${html}</div></div>`}
function pontos(){return ECRAS.filter(e=>e.jogo&&E.feito[e.id]).length}
function pintaBarra(){
  $('#pontos').textContent='⭐ '+pontos()+' / '+ECRAS.filter(e=>e.jogo).length;
  $('#trilho').innerHTML=ECRAS.map((e,i)=>`<span class="${(E.feito[e.id]||(e.livre&&i<E.i))?'feito':''} ${i===E.i?'atual':''}" title="${e.t}">${i===0?'🏠':i===ECRAS.length-1?'🏁':i}</span>`).join('');
  const e=ECRAS[E.i];
  $('#bAnt').disabled=E.i===0;
  $('#bProx').disabled=E.i===ECRAS.length-1||!(e.livre||E.feito[e.id]||E.prof);
}
function vai(i){
  limpaTempos();E.i=Math.max(0,Math.min(ECRAS.length-1,i));
  main.innerHTML='<section class="ecra ativo cartao" id="ecra"></section>';
  ECRAS[E.i].f($('#ecra'));pintaBarra();window.scrollTo(0,0);
}
function erro(id){E.erros[id]=(E.erros[id]||0)+1;guarda()}
function concluido(id){E.feito[id]=true;guarda();pintaBarra();$('#bProx').classList.add('salta');trackedTimeout(()=>$('#bProx').classList.remove('salta'),500)}
function diz(el,txt,ok){el.textContent=txt;el.className='msg '+(ok?'ok':'erro')}
function fimJogo(sec,id,texto){
  E.erros[id]=E.erros[id]||0;concluido(id);
  sec.innerHTML=cabeca('missao','Muito bem!',`<p>${texto}</p><p>Ganhaste mais uma estrela ⭐. Clica em <b>Próximo ▶</b> para continuares.</p>`)+
   `<p class="centro"><button class="btn sec" id="rep">↻ Jogar outra vez</button></p>`;
  $('#rep',sec).onclick=()=>vai(E.i);
}
$('#bInicio').onclick=()=>vai(0);
$('#bAnt').onclick=()=>vai(E.i-1);
$('#bProx').onclick=()=>vai(E.i+1);
$('#bProf').onclick=()=>{
  if(E.prof){E.prof=false;$('#bProf').textContent='🔒';pintaBarra();return}
  const p=prompt('Painel da professora — palavra-passe (a mesma dos outros jogos do Ticl@s):');
  if(p!==null&&sha256(p)===HASH_PROF){E.prof=true;$('#bProf').textContent='🔓';pintaBarra();
    if(confirm('Navegação desbloqueada.\n\nQueres também apagar o progresso guardado neste computador?')){E.feito={};E.erros={};E.frases=[];guarda();vai(0)}}
  else if(p!==null)alert('Palavra-passe errada.');
};

/* ---------- 2. parte a palavra ---------- */
function jogoCortar(s){
  const id='cortar';
  const lista=baralha([...baralha(porClasse(TEXTO,2)).slice(0,q(2,2)),...baralha(porClasse(TEXTO,3)).slice(0,q(4,2)),...porClasse(TEXTO,4).slice(0,q(3,1)),W('mão')]);
  let k=0,tent=0;
  function ronda(){
    if(k>=lista.length)return fimJogo(s,id,'Partiste todas as palavras em sílabas sem as estragar.');
    const w=lista[k];tent=0;const letras=[...w.p];
    s.innerHTML=cabeca('analisar','Jogo 1 — Parte a palavra','<p>Clica nas <b>tesouras ✂</b> para cortares a palavra em sílabas. Depois clica em <b>Verificar</b>.</p><p>Se a palavra só tiver uma sílaba, não cortes nada!</p>')+
     `<div class="conta">Palavra ${k+1} de ${lista.length}</div>
      <div class="palavra-corte">${letras.map((l,i)=>`<span class="letra">${l}</span>`+(i<letras.length-1?`<button class="corte" data-i="${i+1}" aria-label="cortar depois de ${l}"></button>`:'')).join('')}</div>
      <p class="centro"><button class="btn" id="ver">Verificar</button></p>
      <div id="fase2" hidden><p class="centro fred" style="font-size:1.2rem">Agora classifica a palavra:</p><div class="classes">${botoesClasse()}</div></div>
      <p class="msg" id="m"></p>`;
    $$('.corte',s).forEach(b=>b.onclick=()=>b.classList.toggle('on'));
    const certos=[];let a=0;w.sil.slice(0,-1).forEach(x=>{a+=[...x].length;certos.push(a)});
    $('#ver',s).onclick=()=>{
      const meus=$$('.corte.on',s).map(b=>+b.dataset.i);
      if(meus.join()===certos.join()){
        $$('.corte',s).forEach(b=>b.disabled=true);$('#ver',s).hidden=true;$('#fase2',s).hidden=false;
        diz($('#m',s),'Cortes certos: '+pontinhos(w),true);
      }else{
        erro(id);tent++;$('.palavra-corte',s).classList.add('treme');trackedTimeout(()=>$('.palavra-corte',s).classList.remove('treme'),400);
        let pista=meus.length!==certos.length?(meus.length<certos.length?'Faltam cortes. Diz a palavra devagar.':'Tens cortes a mais. Diz a palavra devagar.'):'O número de cortes está certo, mas o sítio não.';
        if(tent>=q(3,2))pista+=' Pista: esta palavra tem '+w.n+(w.n===1?' sílaba.':' sílabas.');
        diz($('#m',s),pista,false);
      }
    };
    $$('.classes button',s).forEach(b=>b.onclick=()=>{
      if(+b.dataset.c===w.c){diz($('#m',s),'Certo! «'+w.p+'» é '+classe(w.n).nome+'.',true);$$('.classes button',s).forEach(x=>x.disabled=true);k++;trackedTimeout(ronda,1300)}
      else{erro(id);b.classList.add('treme');b.disabled=true;diz($('#m',s),'Conta outra vez: '+pontinhos(w),false)}
    });
  }
  ronda();
}

/* ---------- 3. arrumar na arca ---------- */
function jogoArrumar(s){
  const id='arrumar',n=q(4,2);
  const lista=baralha([1,2,3,4].flatMap(c=>baralha(porClasse(TEXTO,c)).slice(0,n)));
  let sel=null,falta=lista.length;const errosP={};
  s.innerHTML=cabeca('resolver','Jogo 2 — Arruma na arca','<p>Estas palavras saíram do texto. Clica numa <b>palavra</b> e depois na <b>gaveta</b> certa.</p>')+
   `<div class="fichas">${lista.map((w,i)=>`<button class="ficha" data-i="${i}">${w.p}</button>`).join('')}</div>
    <div class="gavetas">${CLASSES.slice(1).map((c,i)=>`<button class="gaveta c-${c.id}" data-c="${i+1}"><b>${c.pl}</b><small>${c.n}</small></button>`).join('')}</div>
    <p class="msg" id="m"></p>`;
  $$('.ficha',s).forEach(b=>b.onclick=()=>{$$('.ficha',s).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;diz($('#m',s),'',true)});
  $$('.gaveta',s).forEach(g=>g.onclick=()=>{
    if(!sel)return diz($('#m',s),'Primeiro clica numa palavra.',false);
    const w=lista[+sel.dataset.i];
    if(+g.dataset.c===w.c){
      const sp=document.createElement('span');sp.textContent=pontinhos(w);g.appendChild(sp);sel.remove();sel=null;falta--;
      diz($('#m',s),'Boa!',true);if(!falta)trackedTimeout(()=>fimJogo(s,id,'A arca do avô ficou toda arrumada.'),900);
    }else{
      erro(id);errosP[w.p]=(errosP[w.p]||0)+1;g.classList.add('treme');trackedTimeout(()=>g.classList.remove('treme'),400);
      diz($('#m',s),errosP[w.p]>=q(2,1)?'Pista: '+pontinhos(w)+'. Conta as sílabas.':'Essa gaveta não é a certa para «'+w.p+'». Conta as sílabas devagar.',false);
    }
  });
}

/* ---------- 4. balões ---------- */
function jogoBaloes(s){
  const id='baloes',ordem=baralha([1,2,3,4]),todas=[...TEXTO,...ALIM];let r=0;
  const cores=['#E0603A','#3F8FC4','#8E6BBF','#2E9E4F','#D9488B','#E39A12'];
  function ronda(){
    if(r>=ordem.length)return fimJogo(s,id,'Rebentaste só os balões certos. Que pontaria!');
    const c=ordem[r],cl=CLASSES[c];
    const alvos=baralha(porClasse(todas,c)).slice(0,q(4,3)),outros=baralha(todas.filter(w=>w.c!==c)).slice(0,q(6,3));
    const bal=baralha([...alvos,...outros]);let falta=alvos.length;
    s.innerHTML=cabeca('focar','Jogo 3 — Rebenta os balões','<p>Rebenta <b>só</b> os balões que têm a palavra pedida. Cuidado: não cliques à sorte!</p>')+
     `<div class="conta">Ronda ${r+1} de 4</div>
      <div class="alvo">Rebenta os <span class="c-${cl.id}">${cl.pl}</span> (${cl.n}) — faltam <b id="f">${falta}</b></div>
      <div class="ceu">${bal.map((w,i)=>`<button class="bal" data-i="${i}" style="left:${4+(i%5)*19+Math.random()*3}%;background:${cores[i%cores.length]};animation-duration:${q(13,19)+Math.random()*5}s;animation-delay:${-(i*2.3)}s">${w.p}</button>`).join('')}</div>
      <p class="msg" id="m"></p>`;
    $$('.bal',s).forEach(b=>b.onclick=()=>{
      const w=bal[+b.dataset.i];
      if(w.c===c){b.disabled=true;b.classList.add('pum');falta--;$('#f',s).textContent=falta;diz($('#m',s),pontinhos(w)+' — certo!',true);
        if(!falta){r++;trackedTimeout(ronda,1200)}}
      else{erro(id);b.classList.add('errado');b.disabled=true;diz($('#m',s),'«'+w.p+'» é '+classe(w.n).nome+': '+pontinhos(w),false);
        trackedTimeout(()=>{b.classList.remove('errado');b.disabled=false},2500)}
    });
  }
  ronda();
}

/* ---------- 6. escreve com tracinhos ---------- */
function jogoHifen(s){
  const id='hifen';
  const lista=baralha([...baralha(porClasse(TEXTO,2)).slice(0,q(2,2)),...baralha(porClasse(TEXTO,3)).slice(0,q(3,2)),...baralha([...porClasse(TEXTO,4),...porClasse(ALIM,4)]).slice(0,q(3,1))]);
  let k=0,tent=0;
  function ronda(){
    if(k>=lista.length)return fimJogo(s,id,'Escreveste todas as palavras divididas em sílabas.');
    const w=lista[k];tent=0;
    s.innerHTML=cabeca('programar','Jogo 4 — Escreve com tracinhos','<p>Escreve a palavra dividida em sílabas, com um <b>tracinho</b> <kbd>-</kbd> entre as sílabas. No fim carrega em <kbd>Enter</kbd>.</p>')+
     `<div class="conta">Palavra ${k+1} de ${lista.length}</div>
      <div class="escreve"><div class="mostra">${w.p}</div><div class="modelo">Exemplo: livros → li-vros</div>
      <input type="text" id="in" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Escreve a palavra dividida em sílabas">
      <div class="linha"><button class="btn" id="ver">Verificar</button></div></div>
      <p class="msg" id="m"></p>`;
    const inp=$('#in',s);inp.focus();
    const ver=()=>{
      if(inp.disabled)return;
      const v=inp.value.trim().replace(/\s*-\s*/g,'-');
      if(!v)return diz($('#m',s),'Escreve a palavra na caixa.',false);
      if(v.toLowerCase()===w.sil.join('-').toLowerCase()){
        inp.disabled=true;inp.classList.add('certo');diz($('#m',s),'Certo! «'+w.p+'» é '+classe(w.n).nome+' ('+w.n+' sílabas).',true);k++;trackedTimeout(ronda,1500);return}
      erro(id);tent++;inp.classList.add('treme');trackedTimeout(()=>inp.classList.remove('treme'),400);
      const letras=v.replace(/-/g,'').toLowerCase(),partes=v.split('-').filter(x=>x).length;let p;
      if(letras!==w.p.toLowerCase())p=semAcento(letras)===semAcento(w.p.toLowerCase())?'Atenção aos acentos e à cedilha!':'Há letras trocadas ou em falta. Copia a palavra com atenção.';
      else if(!v.includes('-'))p='Faltam os tracinhos entre as sílabas.';
      else if(partes<w.n)p='Tens poucas sílabas. Diz a palavra devagar.';
      else if(partes>w.n)p='Tens sílabas a mais. Diz a palavra devagar.';
      else p='O número de sílabas está certo, mas os tracinhos não estão no sítio.';
      if(tent>=q(3,2))p+=' Pista: tem '+w.n+' sílabas e a primeira é «'+w.sil[0]+'».';
      diz($('#m',s),p,false);
    };
    $('#ver',s).onclick=ver;inp.onkeydown=e=>{if(e.key==='Enter')ver()};
  }
  ronda();
}

/* ---------- 7. intruso ---------- */
function jogoIntruso(s){
  const id='intruso',todas=[...TEXTO,...ALIM],total=q(8,5);let k=0;
  function ronda(){
    if(k>=total)return fimJogo(s,id,'Descobriste todos os intrusos.');
    const c=1+(k%4);let o;do{o=1+Math.floor(Math.random()*4)}while(o===c);
    const tres=baralha(porClasse(todas,c)).slice(0,3),intr=baralha(porClasse(todas,o))[0],ops=baralha([...tres,intr]);
    s.innerHTML=cabeca('analisar','Jogo 5 — Descobre o intruso','<p>Três palavras têm o <b>mesmo número de sílabas</b>. Uma é diferente. Qual é a intrusa?</p>')+
     `<div class="conta">Ronda ${k+1} de ${total}</div>
      <div class="quatro">${ops.map((w,i)=>`<button data-i="${i}">${w.p}<small></small></button>`).join('')}</div><p class="msg" id="m"></p>`;
    const mostra=()=>$$('.quatro button',s).forEach(b=>{$('small',b).textContent=pontinhos(ops[+b.dataset.i])});
    if(E.apoio)mostra();
    $$('.quatro button',s).forEach(b=>b.onclick=()=>{
      const w=ops[+b.dataset.i];
      if(w===intr){mostra();$$('.quatro button',s).forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('fora')});b.classList.add('certo');
        diz($('#m',s),'«'+w.p+'» é '+classe(w.n).nome+'. As outras são '+CLASSES[c].pl+'.',true);k++;trackedTimeout(ronda,2600)}
      else{erro(id);b.classList.add('treme');b.disabled=true;$('small',b).textContent=pontinhos(w);diz($('#m',s),'Essa não é a intrusa. Conta as sílabas de todas.',false)}
    });
  }
  ronda();
}

/* ---------- 8. roda ---------- */
function jogoRoda(s){
  const id='roda',seq=baralha(q([0,1,2,3,4,5,6,7],[0,1,2,3,5]));let k=0,ang=0,atual=null,usadas=[];
  s.innerHTML=cabeca('testar','Jogo 6 — A roda da biblioteca','<p>Roda a roda. Depois procura <b>na tua cópia do texto</b> «A biblioteca do avô» uma palavra com esse número de sílabas e escreve-a.</p><p>Não podes repetir palavras!</p>')+
   `<div class="conta" id="c"></div>
    <div class="roda-zona"><div><div class="roda-caixa"><div class="seta"></div><div class="roda" id="r">${[1,2,3,'4+',1,2,3,'4+'].map((n,i)=>`<b style="transform:rotate(${i*45+22.5}deg) translateY(-82px)">${n}</b>`).join('')}</div></div>
     <p class="centro"><button class="btn" id="gira">Rodar a roda</button></p></div>
     <div><div class="pedido" id="p">Clica em «Rodar a roda».</div>
      <input type="text" id="in" disabled autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Palavra do texto">
      <div class="linha" style="justify-content:flex-start"><button class="btn" id="ver" disabled>Verificar</button></div>
      <p class="msg" id="m" style="text-align:left"></p><div class="usadas" id="u"></div></div></div>`;
  const inp=$('#in',s),conta=()=>$('#c',s).textContent='Palavra '+Math.min(k+1,seq.length)+' de '+seq.length;conta();
  $('#gira',s).onclick=()=>{
    const seg=seq[k];$('#gira',s).disabled=true;diz($('#m',s),'',true);
    const alvo=360-(seg*45+22.5);ang=Math.ceil(ang/360)*360+1080+alvo;$('#r',s).style.transform='rotate('+ang+'deg)';
    trackedTimeout(()=>{atual=(seg%4)+1;const cl=CLASSES[atual];
      $('#p',s).innerHTML='Escreve um <span class="c-'+cl.id+'" style="border:3px solid;border-radius:10px;padding:0 10px">'+cl.nome+'</span> do texto ('+cl.n+').';
      inp.disabled=false;$('#ver',s).disabled=false;inp.value='';inp.focus()},2700);
  };
  const ver=()=>{
    if(inp.disabled)return;const v=inp.value.trim().toLowerCase();if(!v)return;
    const falha=t=>{erro(id);inp.classList.add('treme');trackedTimeout(()=>inp.classList.remove('treme'),400);diz($('#m',s),t,false)};
    if(usadas.includes(v))return falha('Já usaste essa palavra. Procura outra.');
    const d=DIC[v];
    if(!d){const sa=Object.keys(DIC).find(x=>semAcento(x)===semAcento(v));
      return falha(sa?'Atenção aos acentos! Vê como está escrita no texto.':v.includes('-')||v.includes(' ')?'Escreve só uma palavra, sem tracinhos nem espaços.':'Não encontro essa palavra no texto. Copia-a tal como está.')}
    if(!d.includes(atual))return falha('«'+v+'» está no texto, mas é '+CLASSES[d[0]].nome+'. Procura outra.');
    usadas.push(v);const sp=document.createElement('span');sp.className='c-'+CLASSES[atual].id;sp.textContent=v;$('#u',s).appendChild(sp);
    diz($('#m',s),'Certo! «'+v+'» é '+CLASSES[atual].nome+'.',true);inp.disabled=true;$('#ver',s).disabled=true;k++;
    if(k>=seq.length)trackedTimeout(()=>fimJogo(s,id,'Encontraste no texto: '+usadas.join(', ')+'.'),1400);
    else{conta();$('#gira',s).disabled=false;$('#p',s).textContent='Roda outra vez!'}
  };
  $('#ver',s).onclick=ver;inp.onkeydown=e=>{if(e.key==='Enter')ver()};
}

/* ---------- 9. frutos ---------- */
function jogoFrutos(s){
  const id='frutos',cs=q([2,2,3,3,4,4],[2,3,4]);
  s.innerHTML=cabeca('equipa','Jogo 7 — O cesto dos frutos','<p>Escreve nomes de <b>frutos</b> de acordo com as indicações. Em cada linha, um fruto diferente. Carrega em <kbd>Enter</kbd> para verificar.</p>')+
   `<div class="frutos">${cs.map((c,i)=>`<label><span class="et c-${CLASSES[c].id}">${CLASSES[c].nome}</span><input type="text" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false"><em></em></label>`).join('')}</div>
    <p class="centro"><button class="btn" id="verF">Verificar</button></p><p class="msg" id="m"></p>`;
  const ins=$$('input',s);ins[0].focus();
  ins.forEach((inp,i)=>{
    const ver=()=>{
      if(inp.disabled)return;const v=inp.value.trim().toLowerCase();if(!v)return;
      const falha=t=>{erro(id);inp.classList.add('treme');trackedTimeout(()=>inp.classList.remove('treme'),400);diz($('#m',s),t,false)};
      if(ins.some(o=>o!==inp&&o.disabled&&o.value===v))return falha('Já escreveste esse fruto. Pensa noutro.');
      const n=FRUTOS[v];
      if(!n){const sa=Object.keys(FRUTOS).find(x=>semAcento(x)===semAcento(v));
        return falha(sa?'Quase! Falta um acento, um til ou uma cedilha nessa palavra.':'O Ticl@s não conhece esse fruto. Vê se está bem escrito ou experimenta outro.')}
      if(n!==cs[i])return falha('«'+v+'» é '+CLASSES[n].nome+'. Aqui preciso de um '+CLASSES[cs[i]].nome+'.');
      inp.value=v;inp.disabled=true;inp.classList.add('certo');inp.parentNode.querySelector('em').textContent='✅';diz($('#m',s),'Boa! «'+v+'» é '+CLASSES[n].nome+'.',true);
      const prox=ins.find(o=>!o.disabled);
      if(prox)prox.focus();else trackedTimeout(()=>fimJogo(s,id,'O cesto ficou cheio de frutos: '+ins.map(o=>o.value).join(', ')+'.'),1300);
    };
    inp.onkeydown=e=>{if(e.key==='Enter')ver()};inp._ver=ver;
  });
  $('#verF',s).onclick=()=>{const a=ins.find(o=>!o.disabled&&o.value.trim());if(a)a._ver();else diz($('#m',s),'Escreve um fruto numa das caixas.',false)};
}

/* ---------- 10. frases ---------- */
function jogoFrases(s){
  const id='frases';
  const lista=baralha([W('bi-bli-o-te-ca'),W('se-gre-do'),W('li-vros'),W('mão'),W('ra-pa-zi-nho'),W('al-dei-a'),W('mun-do')]).slice(0,q(4,2));
  let k=0;const feitas=[];
  function ronda(){
    if(k>=lista.length){E.frases=feitas;guarda();return fimJogo(s,id,'Escreveste '+feitas.length+' frases completas. Vais vê-las no fim.')}
    const w=lista[k];
    s.innerHTML=cabeca('programar','Jogo 8 — Escritor de frases','<p>Primeiro <b>classifica</b> a palavra. Depois escreve uma <b>frase tua</b> com ela (não copies do texto!).</p>')+
     `<div class="conta">Frase ${k+1} de ${lista.length}</div>
      <div class="mostra centro">${w.p}</div>
      <div class="classes">${botoesClasse()}</div>
      <div id="f2" hidden style="margin-top:14px"><textarea id="tx" spellcheck="false" placeholder="Escreve aqui a tua frase…" aria-label="A tua frase"></textarea>
       <ul class="lista-ok"><li id="o1">Tem a palavra «${w.p}»</li><li id="o2">Começa com letra maiúscula</li><li id="o3">Acaba com . ! ou ?</li><li id="o4">Tem pelo menos 5 palavras</li></ul>
       <div class="linha"><button class="btn" id="ver">Verificar a frase</button></div></div>
      <p class="msg" id="m"></p>`;
    $$('.classes button',s).forEach(b=>b.onclick=()=>{
      if(+b.dataset.c===w.c){$$('.classes button',s).forEach(x=>{x.disabled=true;if(x!==b)x.style.opacity=.4});$('#f2',s).hidden=false;$('#tx',s).focus();diz($('#m',s),pontinhos(w)+' — '+classe(w.n).nome+'. Agora escreve a frase.',true)}
      else{erro(id);b.classList.add('treme');b.disabled=true;diz($('#m',s),'Conta outra vez: '+pontinhos(w),false)}
    });
    const tx=$('#tx',s);
    const testa=()=>{const v=tx.value.trim(),pal=v.split(/\s+/).filter(x=>/[a-zà-ú]/i.test(x));
      const r=[new RegExp('(^|[^a-zà-ú])'+w.p+'([^a-zà-ú]|$)','i').test(v),/^[A-ZÀ-Ú]/.test(v),/[.!?]$/.test(v),pal.length>=5];
      r.forEach((x,i)=>$('#o'+(i+1),s).classList.toggle('s',x));return r};
    tx.oninput=testa;
    $('#ver',s).onclick=()=>{
      const r=testa();
      if(r.every(x=>x)){feitas.push(tx.value.trim());tx.disabled=true;$('#ver',s).disabled=true;diz($('#m',s),'Frase completa. Muito bem!',true);k++;trackedTimeout(ronda,1500)}
      else{erro(id);diz($('#m',s),'Ainda falta alguma coisa. Vê a lista: as bolinhas ○ ainda não estão certas.',false)}
    };
  }
  ronda();
}

/* ---------- 11. final ---------- */
function ecraFinal(s){
  const jogos=ECRAS.filter(e=>e.jogo),feitos=jogos.filter(e=>E.feito[e.id]).length,erros=jogos.reduce((a,e)=>a+(E.erros[e.id]||0),0);
  const tudo=feitos===jogos.length;
  s.innerHTML=`<div class="final"><img src="${MASC[tudo?'missao':'pensar']}" alt="Ticl@s">
    <h2 class="fred" style="font-size:1.9rem;color:var(--verde-esc);margin:4px 0">${tudo?'Missão completa!':'Ainda faltam jogos'}</h2>
    <div class="estrelas">${'⭐'.repeat(feitos)}${'☆'.repeat(jogos.length-feitos)}</div>
    <p style="font-size:1.1rem">${tudo?'A biblioteca do avô ficou arrumada. Obrigado pela ajuda!':'Volta atrás e termina os jogos que faltam para ganhares todas as estrelas.'}</p>
    <table class="resumo"><tr><th>Jogo</th><th>Estado</th><th>Tentativas erradas</th></tr>
    ${jogos.map(e=>`<tr><td>${e.t}</td><td>${E.feito[e.id]?'✅ feito':'⏳ por fazer'}</td><td>${E.feito[e.id]?(E.erros[e.id]||0):'—'}</td></tr>`).join('')}
    <tr><th>Total</th><th>${feitos} / ${jogos.length}</th><th>${erros}</th></tr></table>
    ${E.frases.length?`<div class="minhas"><b class="fred">As minhas frases</b>${E.frases.map(f=>`<p>✏️ ${f.replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</p>`).join('')}</div>`:''}
    <p style="margin-top:14px">Chama a professora para ver o teu trabalho.</p></div>`;
  if(tudo)for(let i=0;i<40;i++){const c=document.createElement('i');c.className='confete';c.style.left=Math.random()*100+'vw';
    c.style.background=['#F2B01E','#3F8FC4','#4FA844','#E0603A'][i%4];c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*1.2)+'s';
    document.body.appendChild(c);trackedTimeout(()=>c.remove(),6000)}
}
vai(0);
</script>
</body>
