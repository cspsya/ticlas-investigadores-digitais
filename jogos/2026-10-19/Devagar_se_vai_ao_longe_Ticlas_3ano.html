<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Devagar se vai ao longe – s, ss, ç, c com o Ticl@s</title>
<meta name="author" content="Coordenadora TIC C. Sofia">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#E07A1F;--accd:#A8540C;--accl:#FFE3C2;--bg1:#FFF6EC;--bg2:#FBDDBB;
--ink:#2A2440;--mut:#6B6480;--line:#EADFD2;--ok:#2BA84A;--okl:#DFF5E4;--bad:#E04848;--badl:#FDE2E2;
--k-s:#2F6FDB;--k-sl:#E1EBFF;--k-ss:#7C4DDB;--k-ssl:#ECE4FF;--k-cc:#D9621A;--k-ccl:#FFE6D2;--k-ci:#12996F;--k-cil:#D8F3EA;
--fs:1;--hd:Fredoka,"Segoe UI",system-ui,sans-serif;--bd:Nunito,"Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{font-size:calc(16px * var(--fs))}
body{margin:0;font-family:var(--bd);color:var(--ink);background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%) fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(rgba(150,110,70,.13) 1.2px,transparent 1.6px) 0 0/22px 22px;z-index:0}
body.quadro{--fs:1.12}
body.leg{--hd:Verdana,Tahoma,sans-serif;--bd:Verdana,Tahoma,sans-serif;letter-spacing:.02em;word-spacing:.08em}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#fx span{position:absolute;top:-50px;opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(340deg)}}
#app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:12px 16px 6px;display:flex;flex-direction:column;min-height:100vh}
/* topo */
header.top{display:flex;align-items:center;gap:14px;background:#fff;border-radius:20px;padding:7px 10px 7px 8px;box-shadow:0 3px 0 var(--line),0 0 0 2px #F3E7D8}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.brand .lg{width:46px;height:46px;border-radius:14px;background:var(--accl);display:grid;place-items:center;overflow:hidden;flex:none}
.brand .lg img{width:54px;margin-top:8px}
.brand b{font:600 1.08rem/1.1 var(--hd);display:block;white-space:nowrap}
.brand small{display:block;color:var(--mut);font-size:.78rem;font-weight:700;white-space:nowrap}
.dots{flex:1;display:flex;gap:4px;align-items:center;min-width:80px}
.dots i{flex:1;height:10px;border-radius:6px;background:#EFE5D8;transition:background .3s}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--acc);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--acc)}
.tools{display:flex;gap:6px;flex:none}
.tb{width:40px;height:40px;border-radius:12px;border:0;background:var(--bg1);font:600 15px var(--hd);cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);display:grid;place-items:center}
.tb:active{transform:translateY(2px);box-shadow:0 0 0 2px var(--line) inset}
.tb.on{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--accd)}
/* corpo */
main{flex:1;display:grid;grid-template-columns:230px 1fr;gap:18px;margin:16px 0 8px;align-items:start}
.mascot{position:sticky;top:12px;display:flex;flex-direction:column;align-items:center}
.bubble{position:relative;width:100%;background:#fff;border-radius:20px;padding:14px 16px 12px;font-size:1.02rem;line-height:1.42;font-weight:600;box-shadow:0 3px 0 var(--line),0 0 0 2px #F3E7D8;min-height:86px}
.bubble::after{content:"";position:absolute;bottom:-13px;left:46%;border:13px solid transparent;border-top-color:#fff;border-bottom:0}
.bubble b{color:var(--accd)}
.bubble .ouvir{position:absolute;right:8px;bottom:-16px;width:34px;height:34px;border-radius:50%;border:0;background:var(--acc);color:#fff;cursor:pointer;box-shadow:0 3px 0 var(--accd);font-size:15px}
.mwrap{position:relative;width:205px;margin-top:16px}
.mwrap img{width:100%;display:block;animation:float 3.6s ease-in-out infinite;filter:drop-shadow(0 10px 10px rgba(90,50,10,.16))}
.mwrap .stk{position:absolute;top:0;right:4px;font-size:40px;transform:rotate(14deg);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2));animation:float 3.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.mwrap .stk{animation-name:float2}@keyframes float2{0%,100%{transform:rotate(14deg)}50%{transform:rotate(14deg) translateY(-8px)}}
.stage{background:#fff;border-radius:26px;padding:22px 26px 24px;box-shadow:0 4px 0 var(--line),0 0 0 2px #F3E7D8;min-height:450px;animation:sin .4s ease}
@keyframes sin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{display:inline-flex;gap:7px;align-items:center;font:600 .8rem var(--hd);letter-spacing:.6px;text-transform:uppercase;color:var(--accd);background:var(--accl);padding:5px 12px;border-radius:20px}
h2.t{font:700 2rem/1.1 var(--hd);margin:10px 0 6px}
h2.t em{font-style:normal;color:var(--acc)}
p.sub{color:var(--mut);font-size:1.05rem;margin:0 0 18px;font-weight:700}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nb{font:600 1rem var(--hd);padding:10px 18px;border-radius:14px;border:0;background:#fff;cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line);display:inline-flex;align-items:center;gap:7px}
.nb.pri{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--accd)}
.nb.ok{background:var(--ok);color:#fff;box-shadow:0 3px 0 #1d7a35}
.nb:active{transform:translateY(2px)}
.nb:disabled{opacity:.42;cursor:not-allowed;transform:none}
.nb.big{font-size:1.2rem;padding:13px 26px;border-radius:18px}
.nb.pulse{animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
footer.nav{display:flex;flex-direction:column;align-items:center;gap:7px;padding:4px 0 6px}
.navrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.cnt{font:500 .95rem var(--hd);color:var(--mut);min-width:64px;text-align:center}
.credit{font:500 .85rem var(--hd);color:var(--mut)}
.credit b{color:var(--accd);font-weight:600}
/* início */
.road{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 18px}
.road span{display:flex;align-items:center;gap:6px;background:var(--bg1);border-radius:14px;padding:7px 12px;font-weight:800;font-size:.92rem;box-shadow:0 0 0 2px var(--line) inset}
.road span i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:600 .75rem var(--hd)}
.lbl{font:600 1rem var(--hd);margin:14px 0 8px;display:block}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;background:var(--bg1);border:0;border-radius:18px;padding:14px;cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line)}
.mode .ic{font-size:2rem;width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;flex:none}
.mode b{font:600 1.08rem var(--hd);display:block}
.mode small{color:var(--mut);font-weight:700;font-size:.85rem}
.mode.sel{background:var(--accl);box-shadow:0 0 0 3px var(--acc) inset,0 3px 0 var(--accd)}
.seg{display:inline-flex;background:var(--bg1);border-radius:14px;padding:4px;box-shadow:0 0 0 2px var(--line) inset}
.seg button{border:0;background:none;font:600 .98rem var(--hd);padding:8px 16px;border-radius:10px;cursor:pointer}
.seg button.sel{background:var(--acc);color:#fff;box-shadow:0 2px 0 var(--accd)}
.fld{font:700 1rem var(--bd);padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:#fff;width:90px}
.fld:focus{outline:3px solid var(--accl);border-color:var(--acc)}
.note{font-size:.85rem;color:var(--mut);font-weight:700}
/* chips e caixas */
.bank,.line{display:flex;flex-wrap:wrap;gap:10px;min-height:66px;padding:12px;border-radius:18px}
.bank{background:var(--bg1);box-shadow:0 0 0 2px var(--line) inset}
.line{background:#fff;border:3px dashed var(--line);margin:12px 0 14px;align-items:center}
.line.right{border-color:var(--ok);background:var(--okl)}
.chip{font:600 1.3rem var(--hd);padding:9px 16px;border-radius:14px;border:0;background:#fff;cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 #DCCDB9;transition:transform .15s}
.chip:hover{transform:translateY(-2px)}
.chip.sel{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--accd);transform:translateY(-3px) scale(1.04)}
.chip.bad{background:var(--badl);box-shadow:0 0 0 2px var(--bad) inset}
.chip .em{margin-right:6px}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.reveal{margin-top:14px;display:flex;gap:14px;align-items:center;background:var(--okl);border-radius:18px;padding:14px 18px;font:600 1.5rem var(--hd);color:#1d6b33}
/* quiz */
.qcount{font:600 .9rem var(--hd);color:var(--mut)}
.qq{font:600 1.45rem/1.25 var(--hd);margin:6px 0 16px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:700 1.12rem/1.3 var(--bd);padding:12px 16px;border-radius:16px;border:0;background:var(--bg1);cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line)}
.opt .ol{width:34px;height:34px;flex:none;border-radius:10px;background:#fff;display:grid;place-items:center;font:600 1rem var(--hd);color:var(--accd);box-shadow:0 0 0 2px var(--line) inset}
.opt:hover:not(:disabled){box-shadow:0 0 0 3px var(--acc) inset,0 3px 0 var(--line)}
.opt.right{background:var(--okl);box-shadow:0 0 0 3px var(--ok) inset}
.opt.right .ol{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badl);box-shadow:0 0 0 3px var(--bad) inset;opacity:.75}
.opt:disabled{cursor:default}
/* poema */
.poem{display:grid;grid-template-columns:1fr 1fr;gap:14px 26px;background:var(--bg1);border-radius:20px;padding:20px 24px;box-shadow:0 0 0 2px var(--line) inset;margin-top:6px}
.poem h3{grid-column:1/-1;font:700 1.5rem var(--hd);margin:0;text-align:center;color:var(--accd)}
.poem p{margin:0;font-size:1.2rem;line-height:1.55;font-weight:700}
.poem .src{grid-column:1/-1;text-align:right;font-size:.8rem;color:var(--mut);font-weight:700}
.poem.show .m{border-radius:5px;font-weight:800;box-shadow:0 0 0 2px var(--mbg,transparent)}
.m.s{color:var(--k-s)}.m.ss{color:var(--k-ss)}.m.cc{color:var(--k-cc)}.m.ci{color:var(--k-ci)}
.poem.show .m.s{background:var(--k-sl);--mbg:var(--k-sl)}.poem.show .m.ss{background:var(--k-ssl);--mbg:var(--k-ssl)}.poem.show .m.cc{background:var(--k-ccl);--mbg:var(--k-ccl)}.poem.show .m.ci{background:var(--k-cil);--mbg:var(--k-cil)}
.poem:not(.show) .m{color:inherit}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;font-weight:800;font-size:.9rem}
.legend span{padding:4px 10px;border-radius:10px}
.peek{margin-top:16px}
.peek .poem{font-size:.85rem}
.peek .poem p{font-size:1rem}
/* regras */
.rules{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.rule{border-radius:20px;padding:14px;background:var(--kl);box-shadow:0 0 0 2px var(--k) inset;display:flex;flex-direction:column;gap:8px}
.rule .L{font:700 2.6rem/1 var(--hd);color:var(--k);text-align:center;background:#fff;border-radius:14px;padding:8px 0}
.rule p{margin:0;font-weight:800;font-size:1rem;line-height:1.35}
.rule ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
.rule li{background:#fff;border-radius:10px;padding:5px 9px;font-weight:700;font-size:1.05rem}
.k-s{--k:var(--k-s);--kl:var(--k-sl)}.k-ss{--k:var(--k-ss);--kl:var(--k-ssl)}.k-cc{--k:var(--k-cc);--kl:var(--k-ccl)}.k-ci{--k:var(--k-ci);--kl:var(--k-cil)}
/* agrupar */
.boxes{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
.box{border-radius:20px;background:var(--kl);box-shadow:0 0 0 2px var(--k) inset;padding:10px;min-height:170px;cursor:pointer;transition:transform .15s}
.box.target{box-shadow:0 0 0 4px var(--k) inset;transform:scale(1.02)}
.box h4{margin:0 0 2px;text-align:center;font:700 2rem var(--hd);color:var(--k)}
.box small{display:block;text-align:center;font-weight:800;font-size:.78rem;color:var(--k);margin-bottom:8px}
.box .in{display:flex;flex-direction:column;gap:6px}
.box .in span{background:#fff;border-radius:10px;padding:5px 8px;font:600 1.05rem var(--hd);animation:sin .3s}
/* completar */
.cw{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:6px}
.cw .emo{font-size:4.2rem;line-height:1;width:110px;height:110px;border-radius:30px;background:var(--bg1);display:grid;place-items:center;box-shadow:0 0 0 2px var(--line) inset}
.cw .word{font:700 3rem var(--hd);letter-spacing:.04em}
.cw .slot{display:inline-block;min-width:1.3em;border-bottom:5px solid var(--acc);text-align:center;color:var(--acc)}
.cw .slot.done{border-color:var(--ok)}
.letters{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.letter{font:700 2rem var(--hd);width:96px;height:78px;border-radius:20px;border:0;cursor:pointer;background:var(--kl);color:var(--k);box-shadow:0 0 0 3px var(--k) inset,0 4px 0 var(--k)}
.letter:active{transform:translateY(3px);box-shadow:0 0 0 3px var(--k) inset}
.letter:disabled{opacity:.35;cursor:default}
.bar{height:10px;border-radius:6px;background:#EFE5D8;overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px;transition:width .4s}
/* caça ao erro */
.sent{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.wd{font:600 1.7rem var(--hd);padding:8px 14px;border-radius:14px;border:0;background:var(--bg1);cursor:pointer;box-shadow:0 0 0 2px var(--line) inset,0 3px 0 var(--line)}
.wd:hover{box-shadow:0 0 0 3px var(--acc) inset,0 3px 0 var(--line)}
.wd.no{background:var(--badl);box-shadow:0 0 0 3px var(--bad) inset}
.wd.fix{background:var(--okl);box-shadow:0 0 0 3px var(--ok) inset;color:#1d6b33}
.wd s{color:var(--bad);font-size:.7em;margin-right:6px}
/* teclado */
.type{display:flex;flex-direction:column;gap:12px}
.model{font:600 2.2rem/1.3 var(--hd);background:var(--bg1);border-radius:18px;padding:14px 18px;text-align:center;box-shadow:0 0 0 2px var(--line) inset;letter-spacing:.03em;word-break:break-word}
.model .ch{border-radius:6px;padding:0 1px;transition:background .15s}
.model .ch.ok{color:var(--ok)}
.model .ch.cur{background:var(--accl);box-shadow:0 4px 0 var(--acc)}
.model .ch.bad{background:var(--badl);box-shadow:0 4px 0 var(--bad)}
.model .ch.sp{display:inline-block;min-width:.45em}
.model.snd .ch.m.s,.model.snd .ch.m.ss,.model.snd .ch.m.cc,.model.snd .ch.m.ci{font-weight:700}
.model:not(.snd) .ch.m:not(.ok){color:inherit}
.tin{font:700 1.9rem var(--bd);padding:12px 16px;border-radius:16px;border:3px solid var(--line);width:100%;background:#fff}
.tin:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--accl)}
.tin.bad{border-color:var(--bad);box-shadow:0 0 0 4px var(--badl)}
.tin.good{border-color:var(--ok);box-shadow:0 0 0 4px var(--okl)}
.khint{font-weight:800;font-size:1rem;min-height:1.4em;color:var(--accd);text-align:center}
.kbd{background:#3a3550;border-radius:16px;padding:10px;box-shadow:0 5px 0 #26223a;max-width:780px;margin:0 auto;width:100%}
.krow{display:flex;gap:5px;margin-bottom:5px}
.krow:last-child{margin:0}
.key{flex:1 1 0;min-width:0;height:44px;border-radius:7px;background:#fdfcff;box-shadow:0 3px 0 #b7b1c7;position:relative;font:700 15px var(--bd);color:#2a2440;display:flex;align-items:flex-end;padding:0 0 5px 7px;transition:all .15s}
.key .up{position:absolute;left:7px;top:3px;font-size:11px;color:#6b6480}
.key.w15{flex-grow:1.5}.key.w18{flex-grow:1.8}.key.w22{flex-grow:2.2}.key.sp{flex-grow:7;justify-content:center;padding-left:0}
.key.ent1{border-bottom-left-radius:0;border-bottom-right-radius:0;box-shadow:none}
.key.ent2{margin-top:-10px;height:54px;border-top-left-radius:0;border-top-right-radius:0}
.key.hl{background:var(--acc);color:#fff;box-shadow:0 3px 0 var(--accd);transform:translateY(-2px)}
.key.hl .up{color:#fff}
.key.hl2{background:#8E7CF0;color:#fff;box-shadow:0 3px 0 #5b48c4}
.key.hl2 .up{color:#fff}
.key .ord{position:absolute;top:-9px;right:-5px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:#fff;font:600 11px/20px var(--hd);text-align:center;z-index:2}
.key.bk.hl{background:var(--bad);box-shadow:0 3px 0 #a52a2a}
.tinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* fim */
.res{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin:8px 0 16px}
.res div{display:flex;justify-content:space-between;background:var(--bg1);border-radius:12px;padding:8px 12px;font-weight:800}
.res .st{letter-spacing:2px}
.cert{position:relative;border-radius:24px;padding:22px 26px 18px 200px;background:linear-gradient(135deg,#fff 0%,var(--accl) 100%);box-shadow:0 0 0 4px var(--acc),0 0 0 9px #fff,0 0 0 11px var(--line);margin:16px 6px 18px;min-height:220px}
.cert img{position:absolute;left:14px;bottom:10px;width:175px}
.cert .ck{font:600 .85rem var(--hd);letter-spacing:2px;text-transform:uppercase;color:var(--accd)}
.cert h3{font:700 2rem/1.1 var(--hd);margin:4px 0 6px}
.cert .nm{font:600 1.5rem var(--hd);border-bottom:2px dashed var(--accd);min-height:2rem;margin:8px 0;padding-bottom:2px}
.cert p{margin:4px 0;font-weight:700}
.cert .big{font:700 1.7rem var(--hd);color:var(--accd)}
.cert .sig{font:500 .9rem var(--hd);color:var(--mut);margin-top:8px}
/* bónus */
textarea.free{width:100%;min-height:110px;font:700 1.5rem/1.4 var(--bd);padding:12px 16px;border-radius:16px;border:3px solid var(--line);resize:vertical}
textarea.free:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--accl)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.checks div{display:flex;gap:9px;align-items:center;background:var(--bg1);border-radius:12px;padding:8px 12px;font-weight:800}
.checks div i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#E7DCCF;color:#fff;font-size:.9rem;flex:none}
.checks div.on{background:var(--okl)}
.checks div.on i{background:var(--ok)}
.mine{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.mine div{background:var(--okl);border-radius:12px;padding:8px 12px;font-weight:700;font-size:1.15rem}
/* modal */
#modal{position:fixed;inset:0;background:rgba(42,36,64,.55);z-index:50;display:grid;place-items:center;padding:16px}
.mbox{background:#fff;border-radius:24px;padding:20px 22px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.mbox h3{font:700 1.4rem var(--hd);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.mbox .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.mbox label{font-weight:800;font-size:.92rem;display:flex;flex-direction:column;gap:5px}
.mbox select,.mbox input[type=password]{font:700 1rem var(--bd);padding:8px 10px;border-radius:10px;border:2px solid var(--line)}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.jump button{font:600 .85rem var(--hd);padding:6px 10px;border-radius:10px;border:0;background:var(--bg1);cursor:pointer;box-shadow:0 0 0 2px var(--line) inset}
table.rt{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:6px}
table.rt th,table.rt td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.rt th{background:var(--bg1);font-family:var(--hd);font-weight:600}
#toast{position:fixed;left:50%;top:22px;transform:translate(-50%,-250%);visibility:hidden;white-space:nowrap;background:#fff;border-radius:18px;padding:12px 22px;font:600 1.3rem var(--hd);box-shadow:0 10px 30px rgba(0,0,0,.18),0 0 0 3px var(--ok);z-index:60;transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
#toast.on{transform:translate(-50%,0);visibility:visible}
.conf{position:fixed;width:11px;height:15px;top:-20px;z-index:45;border-radius:3px;pointer-events:none;animation:conf 1.9s ease-in forwards}
@keyframes conf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
/* alto contraste */
body.hc{--bg1:#fff;--bg2:#fff;--line:#000;--mut:#000;--accl:#fff}
body.hc::before,body.hc #fx{display:none}
body.hc .stage,body.hc header.top,body.hc .bubble{box-shadow:0 0 0 3px #000}
body.hc .chip,body.hc .opt,body.hc .wd,body.hc .mode,body.hc .nb:not(.pri):not(.ok){box-shadow:0 0 0 3px #000 inset}
body.hc .bubble::after{border-top-color:#000}
@media (prefers-reduced-motion:reduce){#fx{display:none}.mwrap img,.mwrap .stk,.nb.pulse{animation:none}}
@media (max-width:860px){
 main{grid-template-columns:1fr}
 .mascot{position:static;flex-direction:row-reverse;align-items:flex-end;gap:8px}
 .mwrap{width:105px;margin:0;flex:none}.mwrap .stk{font-size:26px}
 .bubble::after{left:auto;right:-12px;bottom:22px;border:12px solid transparent;border-left-color:#fff;border-right:0}
 .rules,.boxes{grid-template-columns:1fr 1fr}
 .poem,.res,.checks,.modes{grid-template-columns:1fr}
 .brand small{display:none}.dots{display:none}header.top{flex-wrap:wrap;justify-content:space-between}.tools{flex-wrap:wrap}
 .cert{padding-left:22px}.cert img{display:none}
}
@media (max-width:520px){.stage{padding:16px}.tb{width:34px;height:34px}h2.t{font-size:1.6rem}.kbd{display:none}}
@media print{
 body{background:#fff}body::before,#fx,header,footer,.mascot,#toast{display:none!important}
 main{display:block;margin:0}.stage{box-shadow:none;padding:0}
 .stage>*:not(.cert){display:none!important}
 .cert{-webkit-print-color-adjust:exact;print-color-adjust:exact;margin:30px}
}
</style>
