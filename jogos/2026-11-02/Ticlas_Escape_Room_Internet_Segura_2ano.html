<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Room: Liberta o Ticl@s! · 2.º ano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --t-1:#b0632a;--t-1d:#6e3a14;--t-1l:#f8e6d6;--t-2:#5f8a2a;--t-2d:#43631b;--t-fundo:#fff8ef;--t-fundo2:#f6e3cf;
  --ink:#2D3142;--ff:'Nunito','Segoe UI',system-ui,sans-serif;--ft:'Fredoka','Nunito','Segoe UI',system-ui,sans-serif;
  --verde:#2f9e5b;--vermelho:#d94b4b;--amarelo:#FFC857;--azul:#3b7fc4;--pedra:#6d7488;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--ff);color:var(--ink);background:radial-gradient(circle at 20% 0%,var(--t-1l),var(--t-fundo) 60%);overflow:hidden}
body.legivel{--ff:Verdana,Tahoma,sans-serif;--ft:Verdana,Tahoma,sans-serif}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{height:100vh;display:flex;flex-direction:column;align-items:center;padding:8px 8px 2px}
#ecra-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#ecra{position:relative;overflow:hidden;border-radius:20px;box-shadow:0 18px 50px -18px rgba(45,49,66,.55),0 0 0 1px rgba(45,49,66,.08);background:var(--t-fundo)}
#ecra:fullscreen{border-radius:0}
#palco{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden}
footer{font:700 12px var(--ff);color:#7a8194;padding:4px 0 2px;display:flex;gap:14px;justify-content:center}

/* fundo */
#fundo{position:absolute;inset:0}
#fundo svg{position:absolute;inset:0;width:100%;height:100%}
.deco{position:absolute;font-size:40px;opacity:.25;animation:flutua 9s ease-in-out infinite;pointer-events:none}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(6deg)}}

/* barra de cima */
#topo{position:absolute;left:0;right:0;top:0;height:72px;z-index:20;display:flex;align-items:center;gap:12px;padding:0 16px 0 20px;background:linear-gradient(180deg,rgba(28,32,48,.92),rgba(28,32,48,.86));color:#fff}
#topo .nome{font:700 24px var(--ft);white-space:nowrap}
#chaveiro{display:flex;gap:8px;margin:0 auto}
#chaveiro .slot{width:58px;height:52px;border-radius:14px;background:rgba(255,255,255,.1);border:2px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#chaveiro .slot small{font-size:16px;opacity:.7}
#chaveiro .slot b{font:700 24px var(--ft);color:var(--amarelo)}
#chaveiro .slot.cheio{background:rgba(255,200,87,.18);border:2px solid var(--amarelo)}
#chaveiro .slot.cheio small{opacity:1}
#chaveiro .slot.novo{animation:salta .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes salta{0%{transform:scale(.3)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
#relogio{font:800 22px var(--ff);font-variant-numeric:tabular-nums;background:rgba(255,255,255,.1);border-radius:12px;padding:6px 12px;white-space:nowrap}
#relogio.pouco{background:#e8834a}
.tb{width:48px;height:48px;border:0;border-radius:14px;background:rgba(255,255,255,.1);font-size:24px;color:#fff;flex:none}
.tb:hover{background:rgba(255,255,255,.2)}
.tb.desl{opacity:.45}

/* mascote e balão */
#masc{position:absolute;left:14px;bottom:8px;height:180px;width:200px;z-index:15;pointer-events:none;transition:opacity .3s}
#masc img{height:100%;display:block;margin:0 auto;filter:drop-shadow(0 10px 12px rgba(60,30,10,.25));animation:respira 3.2s ease-in-out infinite;transform-origin:50% 100%}
#masc.pose img{animation:pose .45s cubic-bezier(.3,1.6,.5,1)}
#masc .aces{position:absolute;font-size:40px;top:-4px;right:8%;animation:baloica 2.6s ease-in-out infinite}
#masc.oculto{opacity:0}
@keyframes respira{0%,100%{transform:scale(1)}50%{transform:scale(1.015,.99)}}
@keyframes pose{from{transform:scale(.85)}to{transform:scale(1)}}
@keyframes baloica{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(10deg)}}
#balao{pointer-events:none;position:absolute;left:210px;bottom:24px;max-width:820px;z-index:16;background:#fff;border-radius:22px;padding:14px 22px;font:800 26px/1.3 var(--ff);box-shadow:0 12px 26px -12px rgba(0,0,0,.4);border:3px solid var(--t-1l);transition:opacity .25s,transform .25s}
#balao::before{content:"";position:absolute;left:-14px;bottom:22px;border:12px solid transparent;border-right-color:#fff;border-left:0}
#balao:empty{opacity:0;transform:translateY(10px)}
#balao.bom{border-color:#9fd8b4;background:#f1fbf4}
#balao.mau{border-color:#f2c7a0;background:#fff8ef}
body.contraste #balao{background:#000;color:#ffeb3b;border-color:#ffeb3b}

/* ecrãs */
#vista{position:absolute;left:0;right:0;top:72px;bottom:0;z-index:5}
.abs{position:absolute}
.entra{animation:entra .5s ease both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.cartao{background:#fff;border-radius:24px;box-shadow:0 14px 30px -14px rgba(45,49,66,.35),0 0 0 1px rgba(45,49,66,.05)}
body.contraste .cartao{box-shadow:0 0 0 4px #000}
.btn{border:0;border-radius:20px;font:800 26px var(--ff);padding:14px 26px;background:#fff;color:var(--ink);box-shadow:0 7px 0 rgba(45,49,66,.16),0 14px 24px -14px rgba(45,49,66,.5);transition:transform .12s,box-shadow .12s,background .2s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(45,49,66,.16)}
.btn.prim{background:var(--t-1);color:#fff;box-shadow:0 7px 0 var(--t-1d),0 14px 24px -14px rgba(45,49,66,.5)}
.btn.sec{background:var(--t-2);color:#fff;box-shadow:0 7px 0 var(--t-2d),0 14px 24px -14px rgba(45,49,66,.5)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn:focus-visible,.tb:focus-visible{outline:5px solid var(--azul);outline-offset:3px}
.treme{animation:treme .45s}
@keyframes treme{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.chega{animation:chega .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes chega{from{transform:scale(.5) translateY(40px);opacity:0}}
.ouvir{border:0;background:var(--t-1l);border-radius:999px;width:52px;height:52px;font-size:24px;flex:none}
.titulo{font:700 48px/1.08 var(--ft);color:var(--t-1d)}
.pill{display:inline-block;background:var(--t-1);color:#fff;font:600 22px var(--ft);padding:6px 18px;border-radius:999px}
.confete{position:absolute;width:14px;height:20px;border-radius:3px;z-index:60;pointer-events:none;animation:confete 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confete{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* início */
.historia{font:800 27px/1.4 var(--ff);max-width:640px}
.jaula{position:relative}
.jaula img{display:block;filter:drop-shadow(0 12px 14px rgba(60,30,10,.25))}
.jaula .grades{position:absolute;inset:-6px -10px;display:flex;justify-content:space-evenly;transition:transform 1.2s cubic-bezier(.6,-.3,.4,1.3);pointer-events:none}
.jaula .grades i{width:12px;height:100%;border-radius:6px;background:linear-gradient(90deg,#4a4f63,#9aa3b8,#4a4f63);box-shadow:0 4px 8px rgba(0,0,0,.3)}
.jaula .grades::before,.jaula .grades::after{content:"";position:absolute;left:0;right:0;height:12px;border-radius:6px;background:linear-gradient(#9aa3b8,#4a4f63)}
.jaula .grades::before{top:0}.jaula .grades::after{bottom:0}
.jaula.livre .grades{transform:translateY(-130%)}
.teclado-num{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.teclado-num button{height:62px;border:0;border-radius:16px;background:#fff;font:800 28px var(--ff);box-shadow:0 5px 0 rgba(45,49,66,.14)}
.teclado-num button:hover{background:var(--t-1l)}
.teclado-num.letras{grid-template-columns:repeat(9,1fr)}
.teclado-num button.sel{background:var(--t-1);color:#fff}
.letra-visor{width:100px;height:100px;border-radius:24px;background:var(--t-1l);border:4px solid var(--t-1);font:700 68px/92px var(--ft);color:var(--t-1d)}
.letra-visor.vazio{color:#c9b8a8;border-style:dashed}
.letra-visor.proximo{box-shadow:0 0 0 5px var(--amarelo)}

/* mapa */
.porta{position:absolute;width:150px;text-align:center;border:0;background:none;padding:0}
.porta svg{display:block;margin:0 auto;filter:drop-shadow(0 10px 10px rgba(0,0,0,.25))}
.porta .ic{position:absolute;left:50%;top:44px;transform:translateX(-50%);font-size:44px}
.porta .nm{display:inline-block;margin-top:6px;background:#fff;border-radius:999px;padding:6px 14px;font:800 19px var(--ff);color:var(--t-1d);box-shadow:0 6px 14px -8px rgba(0,0,0,.35);white-space:nowrap}
.porta .estado{position:absolute;right:6px;top:-6px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 24px var(--ft);box-shadow:0 6px 12px -6px rgba(0,0,0,.4)}
.porta.fechada{filter:grayscale(.85);opacity:.75;cursor:default}
.porta.fechada .estado{background:#4a4f63;color:#fff;font-size:22px}
.porta.atual .estado{background:var(--t-1);color:#fff}
.porta.atual svg{animation:chama 1.3s ease-in-out infinite}
.porta.feita .estado{background:var(--amarelo);color:#5a3a00}
@keyframes chama{50%{transform:scale(1.07)}}

/* cabeçalho das salas */
.sala-cab{left:220px;right:24px;top:12px;display:flex;align-items:center;gap:16px}
.sala-cab .pill{flex:none}
.sala-cab .instr{flex:1;font:800 25px/1.25 var(--ff)}
.area{left:220px;right:24px;top:92px;bottom:120px}

/* sala 1: semáforo */
.carta{display:flex;align-items:center;gap:22px;padding:20px 28px;width:560px;height:160px}
.carta .e{font-size:84px;line-height:1}
.carta p{margin:0;font:800 34px/1.2 var(--ff);flex:1}
.cores{display:flex;gap:18px}
.cor{flex:1;height:200px;border:0;border-radius:26px;background:var(--f);box-shadow:0 0 0 5px var(--c),0 9px 0 var(--d);display:flex;flex-direction:column;padding:14px 16px;color:var(--d);text-align:left}
.cor .cab{font:700 30px/1.1 var(--ft);display:flex;align-items:center;gap:10px}
.cor .cab span{font-size:42px}
.cor .dentro{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin-top:10px;font-size:38px}
.cor:hover{transform:translateY(-3px)}

/* sala 2: cofre */
.passes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.passe{height:118px;border:0;border-radius:20px;background:#fff;box-shadow:0 6px 0 rgba(45,49,66,.14),0 12px 22px -14px rgba(0,0,0,.4);font:800 21px Consolas,'Courier New',monospace;padding:10px;position:relative;word-break:break-all;transition:background .2s,box-shadow .2s}
.passe::before{content:"🔑";display:block;font-size:30px;margin-bottom:4px;font-family:var(--ff)}
.passe.sel{background:#e7f6ec;box-shadow:0 0 0 5px var(--verde),0 6px 0 #1b6b3a}
.passe.sel::after{content:"💪";position:absolute;right:8px;top:6px;font-size:28px}
.passe.mal{background:#fdeaea;box-shadow:0 0 0 5px var(--vermelho)}
.passe.falta{background:#fff3e0;box-shadow:0 0 0 5px #f08c2a}
.passe .porque{display:block;margin-top:4px;font:800 15px/1.2 var(--ff);color:#9a2929}
.cofre-ok{box-shadow:0 0 0 5px var(--verde)!important}

/* sala 3: mensagens */
.janela{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 20px 40px -18px rgba(30,35,55,.5),0 0 0 1px rgba(45,49,66,.08)}
.janela .barra{height:46px;background:#eef1f6;display:flex;align-items:center;gap:8px;padding:0 16px;font:800 19px var(--ff);color:#56607a}
.janela .barra i{width:13px;height:13px;border-radius:50%;display:inline-block}
.partes{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin-top:8px}
.parte{border:3px dashed transparent;background:#f3f5f9;border-radius:14px;text-align:left;font:800 23px/1.25 var(--ff);padding:7px 14px;position:relative}
.parte:hover{border-color:#b5d3ee;background:#eef5fc}
.parte.pista{background:#fde8e8;border:3px solid var(--vermelho);color:#7a1f1f}
.parte.pista::after{content:attr(data-et);position:absolute;right:10px;top:-14px;background:var(--vermelho);color:#fff;font:800 15px var(--ff);padding:2px 10px;border-radius:999px;white-space:nowrap}
.parte.nao{opacity:.55}
.lista-pistas{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.lista-pistas div{height:50px;border:3px dashed #cfd5e2;border-radius:14px;display:flex;align-items:center;padding:0 14px;font:800 20px var(--ff);color:#b0b6c4}
.lista-pistas div.cheio{border:3px solid var(--vermelho);background:#fdeaea;color:#9a2929}

/* sala 4: verdadeiro ou falso */
.vf-carta{padding:26px 32px;display:flex;align-items:center;gap:24px;min-height:190px}
.vf-carta .e{font-size:90px;line-height:1}
.vf-carta p{margin:0;font:800 36px/1.25 var(--ff);flex:1}
.vf-bts{display:flex;gap:20px;margin-top:22px}
.vf-bts .btn{flex:1;font-size:34px;padding:22px}
.vf-bts .v{background:#e7f6ec;color:#1b6b3a}
.vf-bts .f{background:#fdeaea;color:#9a2929}
.vf-bts .btn.certo{box-shadow:0 0 0 5px var(--verde),0 7px 0 #1b6b3a}
.vf-bts .btn.errado{opacity:.4}

/* sala 5: ligações */
.lig{display:grid;grid-template-columns:1fr 1fr;gap:14px 70px;position:relative}
.lig .btn{text-align:left;font-size:22px;padding:12px 18px;display:flex;align-items:center;gap:12px;min-height:76px;line-height:1.2}
.lig .btn .e{font-size:34px}
.lig .btn.marcado{box-shadow:0 0 0 5px var(--azul),0 7px 0 #24557f}
.lig .btn.feito{color:#fff;cursor:default}
.lig svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

/* sala 6: site armadilha */
.site{position:absolute;inset:0}
.el{position:absolute;border:3px dashed transparent;border-radius:14px;background:none;padding:0;text-align:left}
.el:hover{border-color:#b5d3ee}
.el.apanhado{border:4px solid var(--vermelho);background:rgba(253,234,234,.6)}
.el.apanhado::after{content:"⚠️ ARMADILHA";position:absolute;right:-6px;top:-16px;background:var(--vermelho);color:#fff;font:800 14px var(--ff);padding:2px 10px;border-radius:999px}
.el.seguro{border:4px solid var(--verde)}
.pisca{animation:pisca .7s ease-in-out infinite alternate}
@keyframes pisca{from{transform:scale(1)}to{transform:scale(1.05)}}

/* sala superada */
.modal{position:absolute;inset:0;z-index:40;background:rgba(28,32,48,.55);display:flex;align-items:center;justify-content:center}
.modal .cartao{padding:30px 40px;text-align:center;min-width:560px}
.chave-grande{font:700 96px/1 var(--ft);color:var(--t-1d);display:inline-flex;align-items:center;justify-content:center;width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#ffc857);box-shadow:0 0 0 8px #fff,0 0 0 12px var(--amarelo);margin:14px 0;animation:salta .8s cubic-bezier(.3,1.8,.5,1)}
.estrelas{font-size:46px;letter-spacing:6px}

/* cadeado */
.cadeado{display:flex;gap:14px;justify-content:center}
.roda{display:flex;flex-direction:column;align-items:center;gap:6px}
.roda button{width:76px;height:50px;border:0;border-radius:14px;background:#fff;font-size:24px;box-shadow:0 5px 0 rgba(45,49,66,.14)}
.roda .d{width:76px;height:96px;border-radius:18px;background:linear-gradient(#2d3142,#4a4f63 50%,#2d3142);color:#fff;font:700 64px/96px var(--ft);text-align:center;box-shadow:inset 0 6px 10px rgba(0,0,0,.4)}
.roda small{font-size:28px}

/* bónus */
.nova{width:100%;font:800 24px/1.3 var(--ff);border:3px solid #cfd5e2;border-radius:18px;padding:12px 16px;resize:none;color:var(--ink)}
.nova:focus{outline:none;border-color:var(--t-1)}
.regras-esc{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px}
.regras-esc li{font:800 20px var(--ff);color:#8a91a3}
.regras-esc li::before{content:'○ ';}
.regras-esc li.ok{color:#1d6b3c}
.regras-esc li.ok::before{content:'✓ ';}

/* painel da professora */
.camada{position:absolute;inset:0;z-index:50;background:rgba(255,250,244,.98);display:none}
.camada.aberta{display:block;animation:entra .3s ease}
.fechar{position:absolute;right:24px;top:20px;width:58px;height:58px;border-radius:50%;border:0;background:#fff;font-size:28px;box-shadow:0 6px 16px -8px rgba(0,0,0,.4)}
.abas{display:flex;gap:10px}
.abas button{border:0;border-radius:14px;padding:10px 20px;font:800 22px var(--ff);background:#fff;box-shadow:0 5px 12px -8px rgba(0,0,0,.4)}
.abas button.sel{background:var(--t-1);color:#fff}
table.res{width:100%;border-collapse:collapse;font:800 20px var(--ff)}
table.res th{text-align:left;color:#6b7286;font-size:17px;padding:6px 10px;border-bottom:2px solid #e6e9f0}
table.res td{padding:8px 10px;border-bottom:1px solid #eef1f6}
.defs{display:grid;grid-template-columns:1fr 1fr;gap:14px 40px}
.def{display:flex;flex-direction:column;gap:8px}
.def>span{font:800 21px var(--ff);color:#5a6175}
.seg{display:flex;background:#fff;border-radius:16px;padding:5px;gap:5px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
.seg button{flex:1;border:0;background:transparent;border-radius:12px;padding:9px 8px;font:800 20px var(--ff);color:#5a6175}
.seg button.sel{background:var(--t-1);color:#fff}
.def select,.campo{font:800 21px var(--ff);padding:11px;border-radius:16px;border:0;box-shadow:0 6px 14px -10px rgba(0,0,0,.4);color:var(--ink);background:#fff}

/* diploma */
#folha{position:fixed;inset:0;z-index:100;background:rgba(20,24,36,.7);display:none;align-items:center;justify-content:center;padding:20px}
#folha.aberta{display:flex}
#folha .papel{background:#fff;width:min(1000px,96vw);aspect-ratio:297/210;border-radius:14px;position:relative;padding:4% 6%;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:1.1vh;border:14px double var(--t-1);color:#2D3142}
#folha h1{font:700 clamp(26px,4vw,50px)/1.05 var(--ft);color:var(--t-1d);margin:0}
#folha .sub{font:800 clamp(13px,1.5vw,19px) var(--ff);color:var(--t-2);letter-spacing:2px;text-transform:uppercase}
#folha .nome{margin:2vh auto 0;width:70%;border-bottom:3px dotted #9aa0ad;height:5vh}
#folha p{font:700 clamp(14px,1.6vw,20px)/1.45 var(--ff);margin:0}
#folha img{position:absolute;right:4%;bottom:6%;width:16%}
#folha .ass{display:flex;justify-content:space-between;margin-top:3vh;font:700 clamp(12px,1.3vw,16px) var(--ff);padding:0 18%}
#folha .ass div{border-top:2px solid #9aa0ad;padding-top:6px;min-width:28%}
#folha .acoes{position:absolute;top:-64px;right:0;display:flex;gap:10px}
@media print{
  @page{size:A4 landscape;margin:8mm}
  body{background:#fff;overflow:visible}
  #app{display:none}
  #folha{position:static;display:flex!important;background:none;padding:0}
  #folha .papel{width:100%;border-radius:0}
  #folha .acoes{display:none}
}

/* 2.º ano */
.bolhas{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.bolha-msg{border:0;border-radius:24px;border-top-left-radius:6px;background:#eef1f6;min-height:120px;padding:14px 16px;font:800 26px/1.25 var(--ff);display:flex;align-items:center;gap:10px;text-align:left;box-shadow:0 6px 0 rgba(45,49,66,.12);position:relative}
.bolha-msg .txt{flex:1}
.bolha-msg .ouvir{width:44px;height:44px;font-size:20px;background:#fff}
.bolha-msg.sel{background:#e7f6ec;box-shadow:0 0 0 5px var(--verde),0 6px 0 #1b6b3a}
.bolha-msg.sel::after{content:"💌";position:absolute;right:-8px;top:-14px;font-size:32px}
.bolha-msg.mal{background:#fdeaea;box-shadow:0 0 0 5px var(--vermelho)}

    svg.insertAdjacentHTML('beforeend', `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${cor}" stroke-width="7" stroke-linecap="round"/><circle cx="${x1}" cy="${y1}" r="8" fill="${cor}"/><circle cx="${x2}" cy="${y2}" r="8" fill="${cor}"/>`);
  };

    if (b.classList.contains('feito')) return;
    if (prefs.narr) falar(b.textContent);
    if (!sel || sel.dataset.l === b.dataset.l) { area.querySelectorAll('.marcado').forEach(x => x.classList.remove('marcado')); sel = b; b.classList.add('marcado'); bip('pop'); return; }
    const a = sel.dataset.l === 's' ? sel : b, c = sel.dataset.l === 's' ? b : sel;
    sel.classList.remove('marcado'); sel = null;
    if (a.dataset.i === c.dataset.i) {
      const cor = cores[feitos % cores.length]; feitos++;
      [a, c].forEach(x => { x.classList.add('feito'); x.style.background = cor; });
      linha(a, c, cor); bip('certo'); diz('Ligação certa!', 'bom', 'trofeu');
      if (feitos === pares.length) setTimeout(() => concluir(pares.length - erros, pares.length), 1000);
    } else {
      erros++; bip('errado'); [a, c].forEach(x => { x.classList.add('treme'); setTimeout(() => x.classList.remove('treme'), 500); });
      diz('Essas duas não combinam. Tenta outra!', 'mau', 'duvida');
    }
  });
}

/* =====================================================================
   8. CADEADO FINAL, RESULTADO, BÓNUS E DIPLOMA
   ===================================================================== */
function verCadeado() {
  const rodas = SALAS.map(() => 0);
  mostrar(`
    <div class="abs cartao" style="left:230px;top:30px;width:820px;padding:24px 30px;text-align:center">
      <div class="titulo" style="font-size:42px">🔒 O cadeado da torre</div>
      <p style="font:800 22px var(--ff);color:#6b7286;margin:6px 0 18px">Põe os números do chaveiro pela ordem das salas.</p>
      <div class="cadeado">${SALAS.map((s, i) => `<div class="roda"><small>${s.e}</small><button data-i="${i}" data-d="1">▲</button><div class="d" id="d${i}">0</div><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>
      <button class="btn prim" id="abrir-c" style="margin-top:22px;font-size:30px">🔓 Abrir</button>
    </div>`);
  diz('Estou quase livre! Usa os números do chaveiro.', '', 'duvida');
  vista.querySelectorAll('.roda button').forEach(b => b.onclick = () => { const i = +b.dataset.i; rodas[i] = (rodas[i] + +b.dataset.d + 10) % 10; $('#d' + i).textContent = rodas[i]; bip('pop'); });
  $('#abrir-c').onclick = () => {
    if (rodas.every((d, i) => d === J.codigo[i])) { bip('chave'); verLibertado(); }
    else { bip('errado'); $('#abrir-c').classList.add('treme'); setTimeout(() => $('#abrir-c').classList.remove('treme'), 500); diz('Ainda não abriu. Confirma os números no chaveiro, pela ordem das salas!', 'mau', 'duvida'); }
  };
}
function guardarResultado() {
  const [p, m] = pontos(), res = ler(CHAVE + '-resultados', []);
  res.push({ aluno: J.aluno, data: new Date().toISOString(), p, m, s: Math.round((J.fim - J.inicio) / 1000), salas: J.salas.map(x => x.p + '/' + x.m) });
  gravar(CHAVE + '-resultados', res);
}
function verLibertado(primeira = true) {
  if (primeira) { J.fim = Date.now(); guardarResultado(); }
  const [p, m] = pontos(), pct = Math.round(100 * p / m), est = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  const seg = Math.round((J.fim - J.inicio) / 1000);
  masc.classList.add('oculto');
  mostrar(`
    <div class="abs" style="left:80px;top:60px">${jaula(380)}</div>
    <div class="abs cartao" style="left:560px;top:30px;width:660px;padding:26px 32px;text-align:center">
      <div class="titulo" style="font-size:46px">🎉 Libertaste o Ticl@s!</div>
      <div class="estrelas" style="margin:10px 0">${est}</div>
      <div style="font:800 26px var(--ff)">Acertaste à primeira <b style="color:var(--t-1)">${p} de ${m}</b> (${pct}%)</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0;font:800 18px var(--ff)">${SALAS.map((s, i) => `<div style="background:var(--t-1l);border-radius:12px;padding:6px">${s.e} ${J.salas[i].p}/${J.salas[i].m}</div>`).join('')}</div>
      <div style="font:700 19px var(--ff);color:#6b7286">⏱ ${Math.floor(seg / 60)} min ${seg % 60} s · ${/^[A-Z]{2}$/.test(J.aluno || '') ? 'Iniciais ' + J.aluno : esc(J.aluno || '')}</div>
      <div style="display:flex;gap:12px;justify-content:center;margin-top:18px;flex-wrap:wrap">
        <button class="btn sec" id="b-bonus">✍️ Desafio bónus</button>
        <button class="btn prim" id="b-diploma">🏅 Diploma</button>
        <button class="btn" id="b-outra">↺ Jogar outra vez</button>
      </div>
    </div>`, false);
  setTimeout(() => { const j = vista.querySelector('.jaula'); if (j) { j.classList.add('livre'); j.querySelector('img').src = IMG.trofeu; } if (primeira) { confetes(260, 250, 110); bip('certo'); } }, 700);
  if (primeira) falar(`Obrigado! Estou livre! Acertaste à primeira ${p} de ${m}.`);
  $('#b-bonus').onclick = verBonus;
  $('#b-diploma').onclick = abrirDiploma;
  $('#b-outra').onclick = verInicio;
}
function verBonus() {
  pose('ideia');
  mostrar(`
    <div class="abs cartao" style="left:230px;top:14px;width:1020px;padding:18px 28px">
      <div class="titulo" style="font-size:36px">✍️ Desafio bónus: ${BONUS.frases === 1 ? 'um conselho' : 'conselhos'} para o Ticl@s</div>
      <p style="font:800 22px var(--ff);color:#5a6175;margin:6px 0 12px">Escreve <b>${BONUS.frases === 1 ? 'uma frase' : 'duas frases'}</b> com ${BONUS.frases === 1 ? 'um conselho' : 'conselhos'} para o Ticl@s não voltar a ficar preso.</p>
      ${Array.from({ length: BONUS.frases }, (_, i) => i + 1).map(n => `<textarea class="nova" data-n="${n}" rows="2" maxlength="140" placeholder="${n === 1 ? 'Ex.: Não digas a tua morada.' : 'Escreve outro conselho...'}" style="margin-top:${n === 2 ? 14 : 0}px"></textarea>
      <ul class="regras-esc" data-n="${n}"><li data-r="0">Começa com maiúscula</li><li data-r="1">Acaba com ponto</li><li data-r="2">Pelo menos ${BONUS.min} palavras</li><li data-r="3">Fala de segurança na Internet</li></ul>`).join('')}
      <div style="display:flex;gap:12px;margin-top:16px"><button class="btn prim" id="b-ok">✅ Verificar</button><button class="btn" id="b-volta">↩ Voltar</button></div>
    </div>`);
  diz('Escreve com cuidado: maiúscula no início e ponto no fim!', '', 'ideia');
  const regras = t => [/^\s*\p{Lu}/u.test(t), /[.!?]\s*$/.test(t), t.trim().split(/\s+/).filter(Boolean).length >= BONUS.min, BONUS.palavras.some(p => t.toLowerCase().includes(p))];
  vista.querySelectorAll('.nova').forEach(ta => ta.oninput = () => { const r = regras(ta.value); vista.querySelectorAll(`.regras-esc[data-n="${ta.dataset.n}"] li`).forEach((li, i) => li.classList.toggle('ok', r[i])); });
  $('#b-ok').onclick = () => {
    const ok = [...vista.querySelectorAll('.nova')].every(ta => regras(ta.value).every(Boolean));
    if (ok) { bip('certo'); confetes(740, 300, 70); diz('Que bom conselho, Guardião! Mostra-o à professora.', 'bom', 'trofeu');
      if (!J.bonus) { J.bonus = true; const r = ler(CHAVE + '-resultados', []); if (r.length) { r[r.length - 1].bonus = true; gravar(CHAVE + '-resultados', r); } } }
    else { bip('errado'); diz('Quase! Vê as regras que ainda não estão verdes.', 'mau', 'duvida'); }
  };
  $('#b-volta').onclick = () => verLibertado(false);
}
function abrirDiploma() {
  const d = new Date(), meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const [p, m] = pontos(), pct = Math.round(100 * p / m), est = pct >= 90 ? '⭐⭐⭐' : pct >= 70 ? '⭐⭐' : '⭐';
  const f = $('#folha');
  f.innerHTML = `<div class="papel">
    <div class="acoes"><button class="btn prim" onclick="window.print()">🖨️ Imprimir</button><button class="btn" onclick="document.getElementById('folha').classList.remove('aberta')">✕ Fechar</button></div>
    <div class="sub">Escape Room do Ticl@s · 2.º ano</div>
    <h1>Diploma de Guardião<br>da Internet</h1>
    <p style="margin-top:1vh">Este diploma é atribuído a</p><div class="nome"></div>
    <p style="margin-top:1.5vh">por ter libertado o Ticl@s da Torre da Internet,<br>mostrando que sabe guardar os seus tesouros na Internet.</p>
    <div style="font-size:clamp(22px,3vw,38px);margin-top:1vh">${est}</div>
    <div class="ass"><div>${d.getDate()} de ${meses[d.getMonth()]} de ${d.getFullYear()}</div><div>A Coordenadora TIC<br>C. Sofia O.</div></div>
    <img src="${IMG.trofeu}" alt="Ticl@s"></div>`;
  f.classList.add('aberta');
}

/* =====================================================================
   9. PAINEL DA PROFESSORA (palavra-passe: ticlas2026)
   ===================================================================== */
const HASH_PROF = 'a85926d3d4ecdff3a0c40e20754c3552ee0040c9cc68ab65aa75d89c33b76a4f';
async function sha256(t) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { return null; }
}
let profOk = false;
function abrirPainel() {
  const c = $('#painel'); c.classList.add('aberta');
  if (!profOk) {
    c.innerHTML = `<button class="fechar">✕</button><div class="abs cartao" style="left:390px;top:150px;width:500px;padding:30px;text-align:center">
      <div class="titulo" style="font-size:36px">👩‍🏫 Painel da professora</div>
      <input class="campo" type="password" id="pp" placeholder="Palavra-passe" style="width:100%;margin-top:18px;text-align:center">
      <button class="btn prim" id="pp-ok" style="margin-top:16px">Entrar</button><div id="pp-msg" style="margin-top:10px;font:800 19px var(--ff);color:var(--vermelho)"></div></div>`;
    c.querySelector('.fechar').onclick = () => c.classList.remove('aberta');
    const tentar = async () => {
      const v = $('#pp').value.trim(), h = await sha256(v);
      if ((h && h === HASH_PROF) || (!h && v === 'ticlas2026')) { profOk = true; abrirPainel(); }
      else $('#pp-msg').textContent = 'Palavra-passe errada.';
    };
    $('#pp-ok').onclick = tentar; $('#pp').onkeydown = e => { if (e.key === 'Enter') tentar(); };
    setTimeout(() => $('#pp').focus(), 50);
    return;
  }
  painelResultados();
}
function cabPainel(aba) {
  return `<button class="fechar">✕</button><div class="abs" style="left:60px;top:30px;right:110px;display:flex;align-items:center;gap:20px"><span class="titulo" style="font-size:36px">👩‍🏫 Painel</span>
    <div class="abas"><button data-a="res" class="${aba === 'res' ? 'sel' : ''}">📊 Resultados</button><button data-a="defs" class="${aba === 'defs' ? 'sel' : ''}">⚙️ Definições</button><button data-a="salas" class="${aba === 'salas' ? 'sel' : ''}">🚪 Ir para sala</button></div></div>`;
}
function ligarPainel() {
  const c = $('#painel');
  c.querySelector('.fechar').onclick = () => c.classList.remove('aberta');
  c.querySelectorAll('.abas button').forEach(b => b.onclick = () => ({ res: painelResultados, defs: painelDefs, salas: painelSalas })[b.dataset.a]());
}
function painelResultados() {
  const c = $('#painel'), res = ler(CHAVE + '-resultados', []);
  c.innerHTML = cabPainel('res') + `<div class="abs cartao" style="left:60px;right:60px;top:110px;bottom:110px;padding:16px 20px;overflow:auto">
    ${res.length ? `<table class="res"><tr><th>Iniciais</th><th>Data</th><th>Acertos</th><th>%</th><th>Tempo</th><th>${SALAS.map(s => s.e).join(' · ')}</th><th>✍️</th></tr>
    ${res.slice().reverse().map(r => `<tr><td>${esc(r.aluno)}</td><td>${new Date(r.data).toLocaleString('pt-PT', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</td><td>${r.p}/${r.m}</td><td>${Math.round(100 * r.p / r.m)}%</td><td>${Math.floor(r.s / 60)}:${String(r.s % 60).padStart(2, '0')}</td><td style="font-size:17px">${r.salas.join(' · ')}</td><td>${r.bonus ? '✅' : ''}</td></tr>`).join('')}</table>`
      : '<p style="font:800 22px var(--ff);color:#7a8194">Ainda não há resultados neste computador.</p>'}</div>
    <div class="abs" style="left:60px;bottom:30px;display:flex;gap:12px"><button class="btn sec" id="csv">⬇️ Exportar (CSV)</button><button class="btn" id="limpar">🗑️ Apagar resultados</button>
    <span style="align-self:center;font:700 17px var(--ff);color:#7a8194">Guardados só neste computador, só com as iniciais.</span></div>`;
  ligarPainel();
  $('#csv').onclick = () => {
    const linhas = [['Iniciais', 'Data', 'Acertos', 'Maximo', 'Percentagem', 'Segundos', ...SALAS.map(s => s.nome), 'Bonus'], ...res.map(r => [r.aluno, r.data, r.p, r.m, Math.round(100 * r.p / r.m), r.s, ...r.salas.map(x => ' ' + x), r.bonus ? 'sim' : ''])];
    const blob = new Blob(['﻿' + linhas.map(l => l.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'escape_room_ticlas_3ano.csv'; a.click();
  };
  $('#limpar').onclick = () => { if (confirm('Apagar todos os resultados deste computador?')) { gravar(CHAVE + '-resultados', []); painelResultados(); } };
}
function painelDefs() {
  const c = $('#painel');
  const seg = (k, ops) => `<div class="seg" data-k="${k}">${ops.map(([v, t]) => `<button data-v="${v}" class="${String(prefs[k]) === String(v) ? 'sel' : ''}">${t}</button>`).join('')}</div>`;
  c.innerHTML = cabPainel('defs') + `<div class="abs defs" style="left:60px;right:60px;top:120px">
    <label class="def"><span>🎨 Tema (muda sozinho com a data)</span><select id="sel-tema"><option value="auto">Automático: ${TEMAS[temaDoDia()].nome}</option>${Object.entries(TEMAS).map(([k, t]) => `<option value="${k}" ${prefs.tema === k ? 'selected' : ''}>${t.nome}</option>`).join('')}</select></label>
    <div class="def"><span>👥 Perfil</span>${seg('perfil', [['turma', 'Turma'], ['apoio', 'Apoio (menos itens)']])}</div>
    <div class="def"><span>🗣️ Narração do Ticl@s</span>${seg('narr', [[true, 'Ligada'], [false, 'Desligada']])}</div>
    <div class="def"><span>🔔 Sons</span>${seg('som', [[true, 'Ligados'], [false, 'Desligados']])}</div>
    <div class="def"><span>⏱ Tempo do escape room</span>${seg('minutos', [[30, '30 min'], [40, '40 min'], [50, '50 min']])}</div>
    <div class="def"><span>👓 Leitura</span>${seg('contraste', [[false, 'Cores normais'], [true, 'Alto contraste']])}${seg('legivel', [[false, 'Letra do jogo'], [true, 'Letra simples']])}</div>
  </div>
  <div class="abs" style="left:60px;bottom:30px;font:700 17px var(--ff);color:#7a8194">O perfil de apoio aplica-se às salas seguintes. A palavra-passe do painel é ticlas2026.</div>`;
  ligarPainel();
  c.querySelector('#sel-tema').onchange = e => { prefs.tema = e.target.value; guardar(); aplicarAparencia(); };
  c.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = g.dataset.k, v = b.dataset.v; prefs[k] = v === 'true' ? true : v === 'false' ? false : isNaN(v) ? v : +v;
    g.querySelectorAll('button').forEach(x => x.classList.toggle('sel', x === b)); guardar(); aplicarAparencia();
  }));
}
function painelSalas() {
  const c = $('#painel');
  c.innerHTML = cabPainel('salas') + `<div class="abs" style="left:60px;right:60px;top:130px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
    ${SALAS.map((s, i) => `<button class="btn" data-i="${i}" style="text-align:left">${s.e} ${i + 1}. ${s.nome}</button>`).join('')}
    <button class="btn" data-i="c">🔒 Cadeado final</button><button class="btn" data-i="b">✍️ Desafio bónus</button><button class="btn" data-i="i">🏠 Ecrã inicial</button></div>
    <div class="abs" style="left:60px;bottom:30px;font:700 17px var(--ff);color:#7a8194">Útil para experimentar ou retomar. As salas abertas por aqui não desbloqueiam o cadeado.</div>`;
  ligarPainel();
  c.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
    c.classList.remove('aberta'); const v = b.dataset.i;
    if (!J.inicio) novoJogo('Professora');
    if (v === 'c') verCadeado(); else if (v === 'b') verBonus(); else if (v === 'i') verInicio(); else entrarSala(+v);
  });
}

/* =====================================================================
   10. ARRANQUE
   ===================================================================== */
$('#bmapa').onclick = () => J.inicio ? verMapa() : verInicio();
$('#bsom').onclick = () => { const on = !(prefs.narr || prefs.som); prefs.narr = on; prefs.som = on; guardar(); aplicarAparencia(); if (!on) calar(); };
$('#bprof').onclick = abrirPainel;
$('#bfs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : $('#ecra').requestFullscreen(); } catch (e) { } };
document.addEventListener('keydown', e => { if (e.key === 'Escape') { $('#painel').classList.remove('aberta'); $('#folha').classList.remove('aberta'); } });
mascImg.src = IMG.duvida; mascImg.dataset.p = 'duvida';
aplicarAparencia(); ajustar(); verInicio();
addEventListener('load', ajustar);
</script>
