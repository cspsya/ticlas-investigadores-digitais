<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="generator" content="Investigadores Digitais · Jogo-base V3">
<title>Investigadores Digitais — com o Ticl@s</title>
<style>
/* ==========================================================
   Investigadores Digitais · Jogo-base V3 · estilo
   O tema (cores e decoração) muda só as variáveis --t-*.
   ========================================================== */
:root{
  --t-1:#5BA3D0; --t-1d:#285775; --t-1l:#e6f3f5;
  --t-2:#E8834A; --t-2d:#b9582e;
  --t-fundo:#FFF8F0; --t-fundo2:#e6f3f5;
  --ink:#2D3142; --muted:#66778a; --line:#e6e3dc; --white:#fff;
  --ok:#3f8f2f; --okl:#e3f4dd; --bad:#c0392b; --badl:#fbe3df; --yellow:#FFC857;
  --ff:'Nunito','Segoe UI','Trebuchet MS',Verdana,system-ui,sans-serif;
  --escala:1; --radius:18px;
  --base:calc(20px * var(--escala));
}
*{box-sizing:border-box}
html{font-size:var(--base);min-height:100%;background:var(--t-fundo)}
body{margin:0;font-family:var(--ff);color:var(--ink);line-height:1.35;
  background:linear-gradient(160deg,var(--t-fundo) 0%,var(--t-fundo2) 100%) fixed;min-height:100vh;overflow-x:hidden}
body.ano-1,body.ano-2{--base:calc(22px * var(--escala))}
body.quadro{--base:calc(27px * var(--escala))}
body.legivel{--ff:Verdana,Tahoma,'Segoe UI',sans-serif;letter-spacing:.03em;word-spacing:.12em}
body.contraste{--t-1:#0b4f8a;--t-1d:#002b55;--t-1l:#fff;--t-2:#a33d00;--t-2d:#6b2600;--t-fundo:#fff;--t-fundo2:#fff;--ink:#000;--muted:#222;--line:#000}
body.contraste .decor{display:none}
button{font-family:inherit;font-size:1rem;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

/* decoração do tema */
.decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.decor span{position:absolute;font-size:2.2rem;opacity:.22;animation:flutua 9s ease-in-out infinite}
@keyframes flutua{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-16px) rotate(8deg)}}

.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto;padding:10px 14px 6px}
body.quadro .wrap{max-width:1560px}
body.quadro .mascote img{width:190px}body.quadro .palco{grid-template-columns:200px 1fr}

/* barra superior */
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.marca{flex:1;min-width:200px;font-weight:900;color:var(--t-1d);font-size:1.05rem;line-height:1.1}
.marca small{display:block;font-weight:700;color:var(--muted);font-size:.68rem}
.pill{background:var(--white);border:2px solid var(--line);border-radius:99px;padding:5px 12px;font-weight:900;font-size:.8rem;white-space:nowrap}
.icon{background:var(--white);border:2px solid var(--line);border-radius:12px;min-width:44px;height:44px;font-weight:900;cursor:pointer;font-size:.85rem;padding:0 8px}
.icon:hover{border-color:var(--t-1)}

/* painel principal */
.painel{background:var(--white);border-radius:26px;box-shadow:0 8px 26px rgba(40,87,117,.13);padding:16px 18px;border:2px solid var(--t-1l)}
.progresso{display:flex;gap:5px;margin-bottom:6px}
.progresso i{flex:1;height:10px;border-radius:9px;background:var(--t-1l)}
.progresso i.feito{background:var(--t-1)}
.progresso i.atual{background:var(--t-2)}
.etiqueta{display:flex;justify-content:space-between;gap:8px;font-weight:800;color:var(--muted);font-size:.75rem;margin-bottom:8px;flex-wrap:wrap}
.fase{background:var(--t-1l);color:var(--t-1d);border-radius:99px;padding:2px 10px;text-transform:uppercase;letter-spacing:.04em;font-size:.68rem}

.palco{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:start}
.mascote{position:relative;text-align:center}
.mascote img{width:150px;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12));transition:transform .25s}
.mascote img.salta{animation:salta .5s}
@keyframes salta{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.acessorio{position:absolute;right:4px;top:-6px;font-size:2.1rem;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.balao{position:relative;background:var(--t-1l);border-radius:16px;padding:9px 12px;font-weight:800;font-size:.78rem;color:var(--t-1d);margin-top:8px}
.balao:before{content:'';position:absolute;top:-10px;left:50%;margin-left:-10px;border:10px solid transparent;border-top:0;border-bottom-color:var(--t-1l)}

.area{min-height:300px;display:flex;flex-direction:column;gap:12px}
.titulo-ronda{margin:0;color:var(--t-1d);font-size:1.25rem;line-height:1.15}
.linha-titulo{display:flex;align-items:center;gap:10px}
.traducao{display:block;font-style:italic;font-weight:700;color:var(--t-1d);margin-top:2px}
.a-ler{outline:5px solid var(--yellow)!important;outline-offset:3px;transform:scale(1.05)}
.btn.grande{font-size:1.15rem;padding:14px 26px}
.instrucao{margin:0;font-weight:700;color:var(--muted);font-size:.85rem}
.pergunta{background:var(--t-fundo);border:2px dashed var(--t-1l);border-radius:var(--radius);padding:14px 16px;font-weight:900;font-size:1.15rem;text-align:center;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.pergunta .emoji{font-size:2.6rem;line-height:1}
.pergunta img.ilustra{max-height:120px;max-width:200px;border-radius:12px}
.ouvir{border:0;background:var(--t-1);color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;font-size:1.1rem;flex:none}

/* botões */
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:900;cursor:pointer;background:var(--t-2);color:#fff;box-shadow:0 5px 0 var(--t-2d);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--t-2d)}
.btn.azul{background:var(--t-1);box-shadow:0 5px 0 var(--t-1d)}
.btn.leve{background:var(--white);color:var(--t-1d);border:2px solid var(--t-1l);box-shadow:0 4px 0 var(--t-1l)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linha{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}

.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.opcao{min-height:68px;border:3px solid var(--t-1l);background:var(--white);border-radius:var(--radius);padding:10px 12px;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 5px 0 var(--t-1l);transition:transform .12s,border-color .12s}
.opcao:hover:not(:disabled){border-color:var(--t-1);transform:translateY(-2px)}
body.quadro .opcao{min-height:88px;font-size:1.15rem}
.opcao.certo,.peca.certo{background:var(--okl);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:#1f5a15}
.opcao.errado,.peca.errado{background:var(--badl);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);animation:abana .45s}
.opcao.revela{border-color:var(--ok);border-style:dashed}
.opcao:disabled{cursor:default}
.opcao.errado:disabled{opacity:.6}
@keyframes abana{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

/* visual: balões */
.v-baloes{display:flex;flex-wrap:wrap;justify-content:center;gap:22px;padding:6px 0 30px}
.v-baloes .opcao{width:150px;min-height:0;height:172px;border-radius:50% 50% 47% 47% / 56% 56% 44% 44%;background:var(--bc,#e8834a);color:#fff;border:0;box-shadow:inset -12px -14px 0 rgba(0,0,0,.13);position:relative;animation:sobe 3.2s ease-in-out infinite;text-shadow:0 2px 2px rgba(0,0,0,.3)}
body.quadro .v-baloes .opcao{width:200px;height:230px;min-height:0}
.v-baloes .opcao:after{content:'';position:absolute;bottom:-28px;left:50%;width:2px;height:28px;background:#9aa}
.v-baloes .opcao:before{content:'';position:absolute;bottom:-7px;left:50%;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:var(--bc,#e8834a)}
.v-baloes .opcao:nth-child(2){animation-delay:-1s}.v-baloes .opcao:nth-child(3){animation-delay:-2s}.v-baloes .opcao:nth-child(4){animation-delay:-.5s}
.v-baloes .opcao.certo{animation:rebenta .5s forwards;background:var(--ok)}
.v-baloes .opcao.errado{background:#999}
@keyframes sobe{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes rebenta{0%{transform:scale(1)}60%{transform:scale(1.18)}100%{transform:scale(1.05)}}
/* visual: comboio */
.v-comboio{display:flex;gap:6px;overflow:hidden;align-items:flex-end;padding:6px 0 18px;border-bottom:6px solid #8a6b52;position:relative}
.v-comboio .loco{font-size:3rem;align-self:flex-end;flex:none}
.v-comboio .opcao{flex:1;min-width:0;border-radius:12px 12px 6px 6px;position:relative;animation:chega .8s ease-out both}
.v-comboio .opcao:after{content:'● ●';position:absolute;bottom:-20px;left:0;right:0;color:#555;font-size:.8rem}
@keyframes chega{from{transform:translateX(120%)}to{transform:translateX(0)}}

/* visual: comboio que parte */
.v-comboio.parte{animation:partida 1.1s ease-in forwards}
@keyframes partida{to{transform:translateX(-115%)}}

/* visual: o Ticl@s salta dos buracos */
.v-buracos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.opcao.buraco{position:relative;height:190px;min-height:0;border:0;background:none;box-shadow:none;overflow:hidden;padding:0;border-radius:0 0 50% 50%/0 0 30px 30px}
.opcao.buraco:hover:not(:disabled){transform:none}
.buraco:before{content:'';position:absolute;left:6%;right:6%;bottom:4px;height:46px;border-radius:50%;background:radial-gradient(ellipse at 50% 40%,#2c1d12 0 55%,#6b4a2f 56% 100%);z-index:0}
.buraco:after{content:'';position:absolute;left:2%;right:2%;bottom:0;height:24px;border-radius:0 0 50% 50%;background:linear-gradient(#7a9e45,#5e7f31);z-index:3}
.buraco .bicho{position:absolute;left:50%;bottom:-170px;transform:translateX(-50%);transition:bottom .35s cubic-bezier(.3,1.5,.5,1);z-index:2;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.buraco.cima .bicho{bottom:6px}
.buraco .bicho img{width:104px;height:auto;margin-top:-6px}
.buraco .bicho b{background:#fff;border:3px solid var(--t-1);border-radius:14px;padding:4px 12px;font-size:1.05rem;white-space:nowrap;box-shadow:0 3px 0 var(--t-1l);position:relative;z-index:1}
.buraco.certo .bicho b{background:var(--okl);border-color:var(--ok);color:#1f5a15}
.buraco.errado{animation:none}.buraco.errado .bicho b{background:var(--badl);border-color:var(--bad)}
.buraco.revela .bicho b{border-style:dashed;border-color:var(--ok)}
.buraco:disabled{opacity:1}
body.quadro .opcao.buraco{height:230px}body.quadro .buraco .bicho img{width:130px}

/* visual: avião controlável */
.ceu{position:relative;height:260px;border-radius:20px;background:linear-gradient(#bfe3fb,#eef8ff 70%,#fff);overflow:hidden;outline-offset:3px}
.ceu:before,.ceu:after{content:'';position:absolute;width:120px;height:34px;border-radius:20px;background:rgba(255,255,255,.8);animation:ventos 16s linear infinite}
.ceu:before{top:14%;left:-130px}.ceu:after{top:66%;left:-130px;animation-delay:-8s}
@keyframes ventos{to{transform:translateX(1400px)}}
.aviao{position:absolute;left:5%;top:50%;font-size:3.6rem;transform:translateY(-50%);transition:top .4s ease,left .55s ease-in;z-index:2;filter:drop-shadow(0 4px 3px rgba(0,0,0,.15));animation:plana 1.6s ease-in-out infinite}
.aviao.voa{left:62%}
.aviao.vitoria{animation:looping .9s ease-in-out}
@keyframes plana{0%,100%{margin-top:-4px}50%{margin-top:4px}}
@keyframes looping{50%{transform:translateY(-50%) rotate(-25deg) scale(1.2)}}
.opcao.nuvem{position:absolute;right:4%;transform:translateY(-50%);min-height:56px;min-width:150px;border-radius:40px;border:3px solid #fff;box-shadow:0 6px 0 rgba(91,163,208,.35);background:#fff;z-index:1}
.opcao.nuvem:hover:not(:disabled){transform:translateY(-50%) scale(1.04)}
.opcao.nuvem.alvo{border-color:var(--t-2)}
.opcao.nuvem.errado{animation:none;opacity:.55}
.controlos-aviao .btn{min-width:64px}
body.quadro .ceu{height:340px}

/* imagens maiores para contar (perguntas e opções) */
.pergunta > span .emo>img{height:1.7em;width:1.7em;vertical-align:-0.45em}
.opcao .emo>img,.peca .emo>img,.carta .emo>img{height:1.5em;width:1.5em;vertical-align:-0.35em}

/* celebrações */
.confete{position:fixed;width:10px;height:14px;border-radius:3px;pointer-events:none;z-index:60;animation:confete 1.1s ease-out forwards}
@keyframes confete{40%{transform:translate(calc(var(--dx) * .6),var(--dy)) rotate(calc(var(--r) * .5))}100%{transform:translate(var(--dx),calc(var(--dy) + 220px)) rotate(var(--r));opacity:0}}

/* mapa de missões */
.mapa-topo{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.mapa-topo .mascote img{width:96px}
.mapa{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:8px}
.missao{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;border:3px solid var(--t-1l);background:#fff;border-radius:20px;padding:12px 10px 10px;cursor:pointer;box-shadow:0 5px 0 var(--t-1l);font-weight:900;text-align:center;transition:transform .12s}
.missao:hover:not(:disabled){transform:translateY(-3px);border-color:var(--t-1)}
.missao-num{position:absolute;left:10px;top:8px;background:var(--t-1);color:#fff;border-radius:99px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-size:.75rem}
.missao-icone{font-size:2.2rem;line-height:1.1}
.missao small{color:var(--muted);font-weight:800;font-size:.66rem;text-transform:uppercase}
.missao-estado{font-size:.72rem;color:var(--t-1d)}
.missao.feita{background:var(--okl);border-color:var(--ok);box-shadow:0 5px 0 var(--ok)}
.missao.sugerida{border-color:var(--t-2);box-shadow:0 5px 0 var(--t-2);animation:pulsa 1.8s ease-in-out infinite}
@keyframes pulsa{50%{transform:translateY(-3px)}}
.missao:disabled{opacity:.55;cursor:not-allowed}

/* feedback */
.feedback{min-height:1.6em;text-align:center;font-weight:900;font-size:1rem}
.feedback.ok{color:var(--ok)}.feedback.bad{color:var(--bad)}
.explica{background:var(--okl);border-radius:14px;padding:8px 12px;font-weight:700;font-size:.85rem;text-align:center}
.dica{background:#fff5d6;border:2px solid var(--yellow);border-radius:14px;padding:8px 12px;font-weight:800;font-size:.85rem;text-align:center}

/* completar */
.lacuna{display:inline-block;min-width:4.5em;border-bottom:4px solid var(--t-2);color:var(--t-2d);padding:0 6px}

/* escrever */
.escrita{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.escrita input,.escrita textarea{font:inherit;font-size:1.15rem;font-weight:800;border:3px solid var(--t-1l);border-radius:14px;padding:10px 14px;min-width:min(420px,100%);color:var(--ink);background:#fff}
.escrita textarea{width:100%;min-height:96px;resize:vertical}
.criterios{list-style:none;padding:0;margin:0;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;font-size:.78rem;font-weight:800}
.criterios li{background:var(--t-fundo);border:2px solid var(--line);border-radius:99px;padding:4px 10px}
.criterios li.sim{background:var(--okl);border-color:var(--ok)}

/* peças (ordenar / classificar / pares) */
.pecas{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:64px}
.peca{min-height:58px;min-width:58px;border:3px solid var(--t-1l);background:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--t-1l);touch-action:none}
.peca.sel{border-color:var(--t-2);background:#fff1e8;transform:translateY(-3px)}
.peca:disabled{cursor:default}
.peca.fixa{background:var(--okl);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.montagem{min-height:76px;border:3px dashed var(--t-1);border-radius:18px;padding:8px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center;background:var(--t-fundo)}
.montagem:empty:before{content:attr(data-vazio);color:var(--muted);font-weight:700;font-size:.8rem}
.caixas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.caixa{border:3px dashed var(--t-1);border-radius:18px;min-height:130px;padding:8px;background:var(--t-fundo);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center}
.caixa h4{margin:0 0 4px;color:var(--t-1d);font-size:1rem}
.caixa.alvo{background:#fff1e8;border-color:var(--t-2)}
.caixa .peca{min-height:44px;font-size:.9rem;padding:4px 10px;pointer-events:none}
.lista-caixa{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.colunas{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px}
.colunas .col{display:flex;flex-direction:column;gap:10px}
.colunas .peca{width:100%}
.memoria{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.carta{min-height:92px;border-radius:16px;border:3px solid var(--t-1);background:var(--t-1);color:#fff;font-weight:900;font-size:1.05rem;cursor:pointer;padding:6px}
.carta.virada{background:#fff;color:var(--ink)}
.carta.par{background:var(--okl);color:#1f5a15;border-color:var(--ok);cursor:default}

/* início e fim */
.inicio{display:grid;grid-template-columns:200px 1fr;gap:22px;align-items:center}
.inicio .mascote img{width:200px}
.inicio h1{margin:.1em 0 .2em;color:var(--t-1d);font-size:1.9rem;line-height:1.08}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.linha-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.seletor-lingua{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800}
.seletor-lingua select{font:inherit;font-size:.75rem;border:2px solid var(--t-1l);border-radius:10px;padding:4px 6px;background:#fff}
.tag{background:var(--t-1l);color:var(--t-1d);border-radius:99px;padding:3px 11px;font-weight:900;font-size:.7rem}
.escolhas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.escolha{border:3px solid var(--t-1l);border-radius:18px;background:#fff;padding:10px;text-align:left;cursor:pointer;font-weight:900}
.escolha small{display:block;color:var(--muted);font-weight:700;font-size:.7rem}
.escolha[aria-pressed="true"]{border-color:var(--t-2);background:#fff1e8}
.grupo-titulo{font-weight:900;font-size:.75rem;color:var(--muted);margin-top:6px}
.numero{display:flex;gap:8px;align-items:center;font-weight:800;font-size:.8rem}
.numero input{width:80px;font:inherit;font-weight:900;border:2px solid var(--t-1l);border-radius:10px;padding:6px}
.estrelas-grandes{font-size:3rem;letter-spacing:.1em}
.frases-lista{text-align:left;background:var(--t-fundo);border-radius:14px;padding:8px 14px;font-size:.85rem}

/* navegação inferior */
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:12px}
.nav .btn{padding:10px 16px;font-size:.85rem}

.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-weight:800;font-size:.66rem;padding:10px 4px 2px}

/* janela (painel da professora, acessibilidade, erros) */
.janela{position:fixed;inset:0;background:rgba(20,30,40,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.janela .cartao{background:#fff;border-radius:22px;padding:18px 20px;max-width:560px;width:100%;max-height:92vh;overflow:auto;font-size:.8rem}
.janela h3{margin:0 0 10px;color:var(--t-1d);font-size:1.1rem}
.janela label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:7px 0;font-weight:800}
.janela select,.janela input[type=password]{font:inherit;padding:6px 8px;border-radius:10px;border:2px solid var(--line);max-width:60%}
.janela .info{background:var(--t-fundo);border-radius:12px;padding:8px 10px;margin:8px 0;font-weight:700}
.erros{color:var(--bad);font-weight:800}
.resultados{width:100%;border-collapse:collapse;font-size:.72rem}
.resultados th,.resultados td{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top}
.resultados th{background:var(--t-1l)}
.resultados details ul{margin:4px 0;padding-left:16px}

/* certificado (só aparece na impressão) */
#certificado{display:none}
@media print{
  body{background:#fff}
  .wrap,.decor,.janela{display:none!important}
  #certificado{display:block;text-align:center;border:10px double var(--t-1);border-radius:24px;padding:40px;margin:20px;font-family:var(--ff);color:#2D3142}
  #certificado img{width:180px}
  #certificado h1{color:var(--t-1d);font-size:34px;margin:10px 0}
  #certificado p{font-size:20px}
}

/* ecrãs pequenos ou embebidos no Google Sites */
@media (max-width:760px){
  .palco,.inicio{grid-template-columns:1fr}
  .mascote img{width:90px}.inicio .mascote img{width:120px}
  .balao{display:none}
  .colunas{gap:10px}
  .escolhas{grid-template-columns:1fr}
}
@media (max-height:720px){
  .mascote img,body.quadro .mascote img{width:120px}.inicio .mascote img{width:160px}
  .area{min-height:240px}
  .v-baloes .opcao,body.quadro .v-baloes .opcao{width:124px;height:142px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

/* ---------- controlador de um item (tentativas, pontos, pistas) ---------- */
function criarItem(ri, it, nOpcoes, aoRevelar) {
  const limiteBase = apoio() ? 3 : 2;
  const limite = nOpcoes ? Math.max(1, Math.min(limiteBase, nOpcoes - 1)) : limiteBase;

  const btDica = it.dica && apoio() ? h('button', { class: 'btn leve', onclick: () => { dica.hidden = false; poseMascote('ideia'); btDica.hidden = true; } }, t('pista')) : null;

    aoContinuar(fn) { btContinuar.onclick = () => { calar(); fn(); }; },
    aviso(msg) { fb.className = 'feedback bad'; fb.textContent = msg; poseMascote('duvida'); },
    errou(el, msg) {

      fb.className = 'feedback bad'; fb.textContent = msg || t('errado');

      c.bloqueado = true; depois(700, () => { c.bloqueado = false; });
    },
    acertou(el, extra) {
      if (c.resolvido) return;
      c.resolvido = true;
      const p = c.erros === 0 ? 3 : c.erros === 1 ? 1 : 0;
      est.pontos[ri] += p; est.maximos[ri] += 3; atualizarEstrelas(); guardarProgresso();
      som('certo'); poseMascote('ideia', true); dizerBalao(p === 3 ? t('primeira') : t('conseguiste'));
      fb.className = 'feedback ok'; fb.textContent = t('certo') + (extra ? ' ' + extra : '');
      if (el) el.classList.add('certo');
      festa(el || fb);
      if (explica) explica.hidden = false;
      if (dica) dica.hidden = true; if (btDica) btDica.hidden = true;
      btContinuar.hidden = false; btContinuar.focus({ preventScroll: true });
    },
    revelar() {
      c.resolvido = true; est.maximos[ri] += 3; guardarProgresso();
      poseMascote('ideia'); dizerBalao(t('vamosVer'));
      fb.className = 'feedback bad';
      fb.textContent = aoRevelar ? aoRevelar() : '';
      if (explica) explica.hidden = false;
      if (btDica) btDica.hidden = true;
      btContinuar.hidden = false; btContinuar.focus({ preventScroll: true });
    }
  };
  return c;
}

/* ---------- rondas item a item ---------- */

// escrever (resposta exata ou frase livre), completar sem opções e ditado

    h('label', null, 'Tema', sel(prefs.tema, [['auto', 'Automático (pela data)'], ...Object.entries(TEMAS).map(([k, x]) => [k, x.nome])], v => mudar('tema', v))),
    h('label', null, 'Modo', sel(prefs.modo, [['quadro', 'Quadro interativo'], ['computador', 'Computador']], v => { delete prefs.som; mudar('modo', v); })),
    h('label', null, 'Perfil', sel(prefs.perfil, [['turma', 'Turma'], ['apoio', 'Apoio']], v => mudar('perfil', v))),
    h('label', null, 'Língua da interface', sel(prefs.lingua, Object.entries(LINGUAS), v => mudar('lingua', v))),
    h('label', null, 'Som e narração', h('input', { type: 'checkbox', checked: somLigado() || null, onchange: e => mudar('som', e.target.checked) })),
    h('label', null, 'Navegação livre (Próximo sempre ativo)', h('input', { type: 'checkbox', checked: prefs.livre || null, onchange: e => { mudar('livre', e.target.checked); const b = $('#btProximo'); if (b && e.target.checked) b.disabled = false; } })),
    h('label', null, 'Ir para a ronda', h('span', { class: 'linha' }, destino, h('button', {
      class: 'btn azul', onclick: () => { if (!destino.value) return; const [s, k] = destino.value.split(':'); est.seq = s; est.p = +k; j.remove(); iniciarRonda(); }
    }, 'Ir'))),
    h('h4', { style: 'margin:12px 0 4px' }, 'Resultados neste computador'),
    tabelaResultados(),
    h('p', { style: 'font-size:.7rem;color:var(--muted)' }, 'Cada computador guarda apenas os resultados de quem jogou nele, identificados pelo número do aluno (sem nomes). As alterações de modo, perfil e língua aplicam-se na ronda seguinte ou ao voltar ao início.'),
    h('div', { class: 'linha' }, h('button', { class: 'btn leve', onclick: () => { j.remove(); ecraInicio(); } }, '🏠 Início'), h('button', { class: 'btn', onclick: () => j.remove() }, 'Fechar')));
}
function ecraInteiro() {
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  const el = document.documentElement;
  if (el.requestFullscreen && document.fullscreenEnabled) el.requestFullscreen().catch(() => window.open(location.href, '_blank'));
  else window.open(location.href, '_blank'); // ex.: dentro do Google Sites sem permissão de ecrã inteiro
}

/* ---------- arranque ---------- */
(function arrancar() {
  $('#btAcess').onclick = abrirAcessibilidade;
  $('#btProf').onclick = abrirProfessor;
  $('#btEcra').onclick = ecraInteiro;
  $('#btSom').onclick = () => { prefs.som = !somLigado(); guardarPrefs(); atualizarBotaoSom(); if (!prefs.som) calar(); };
  if (!T[prefs.lingua]) prefs.lingua = 'pt';
  try { MASCOTE = JSON.parse($('#mascote').textContent); } catch (e) { MASCOTE = {}; }
  if (temFala()) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
  let erros;
  try { AULA = JSON.parse($('#aula').textContent); erros = validarAula(AULA); }
  catch (e) { erros = ['O bloco AULA não é JSON válido: ' + e.message + '. Verifica vírgulas, aspas e chavetas.']; }
  aplicarAparencia();
  if (erros.length) { ecraErros(erros); return; }
  document.title = AULA.titulo + ' · Investigadores Digitais';
  $('#subtitulo').textContent = 'com o Ticl@s · ' + AULA.titulo;
  ecraInicio();
})();
</script>
